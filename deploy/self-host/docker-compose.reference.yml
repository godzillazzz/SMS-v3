name: sms-self-host

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?POSTGRES_ADMIN_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD is required}
      TZ: UTC
      PGTZ: UTC
    volumes:
      - sms_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      sms_private:

  api:
    build:
      context: ../..
      target: runtime
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      TRUST_PROXY: ${TRUST_PROXY:-10.42.0.0/24}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-memory}
      RATE_LIMIT_HASH_SECRET: ${RATE_LIMIT_HASH_SECRET:-}
      WEBAUTHN_ENABLED: ${WEBAUTHN_ENABLED:-false}
      WEBAUTHN_RP_NAME: ${WEBAUTHN_RP_NAME:-}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-}
      DISABLE_EMAIL_NOTIFICATIONS: ${DISABLE_EMAIL_NOTIFICATIONS:-true}
      OTP_DELIVERY_PROVIDER: ${OTP_DELIVERY_PROVIDER:-disabled}
      ALERTING_ENABLED: ${ALERTING_ENABLED:-false}
      ALERT_DEDUP_STORE: ${ALERT_DEDUP_STORE:-memory}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    networks:
      sms_private:

  migrate:
    profiles: ["migration"]
    build:
      context: ../..
      target: migration
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DIRECT_URL: ${DIRECT_URL:?DIRECT_URL is required}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    networks:
      sms_private:

  frontend:
    build:
      context: ../..
      target: frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ${TLS_DIRECTORY:?TLS_DIRECTORY is required}:/etc/nginx/tls:ro
    networks:
      sms_private:

volumes:
  sms_postgres_data:
    name: sms_postgres_data

networks:
  sms_private:
    driver: bridge
    ipam:
      config:
        - subnet: 10.42.0.0/24
