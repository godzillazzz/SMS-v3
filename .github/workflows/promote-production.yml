name: g03-production-promote-exact

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-v3-staging-production
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_NAME: sms-v3-staging
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_DEPLOYMENT_ID: dpl_rK4D47D2HaJ2ur4cLV1YfWtnu2eL
  EXPECTED_APPLICATION_SHA: 1701bcf90a1998ea4999ee02e687172295984c9a
  EXPECTED_APPLICATION_BRANCH: feat/leave-quota-provisioning-v1
  EXPECTED_CANDIDATE_URL: https://sms-v3-staging-eoux0ahlo-godzillazz.vercel.app
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_PREVIOUS_CANONICAL_DEPLOYMENT: dpl_9kb9pKc14A5zMWo6AFeM6JqSWusk
  EXPECTED_PREVIOUS_CANONICAL_SHA: 148c7b8ab17698c011008335c23b99895bba7bf8
  EXPECTED_WORKFLOW_BRANCH: ci/g03-production-promotion-v1

jobs:
  g03-production-promote-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID_SECRET: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID_SECRET: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate fixed G03 promotion contract
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_WORKFLOW_BRANCH"
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          test "$VERCEL_PROJECT_ID_SECRET" = "$EXPECTED_PROJECT_ID"
          test "$VERCEL_ORG_ID_SECRET" = "$EXPECTED_ORG_ID"

          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_APPLICATION_BRANCH" | awk '{print $1}')"
          test "$remote_sha" = "$EXPECTED_APPLICATION_SHA"

          node <<'NODE'
          const fail = (code) => {
            console.error(`G03_PROMOTION_GUARD=${code}`);
            process.exit(1);
          };

          const required = [
            'VERCEL_TOKEN',
            'EXPECTED_PROJECT_NAME',
            'EXPECTED_PROJECT_ID',
            'EXPECTED_ORG_ID',
            'EXPECTED_DEPLOYMENT_ID',
            'EXPECTED_APPLICATION_SHA',
            'EXPECTED_CANONICAL_URL',
            'EXPECTED_PREVIOUS_CANONICAL_DEPLOYMENT',
            'EXPECTED_PREVIOUS_CANONICAL_SHA',
          ];
          for (const key of required) if (!process.env[key]) fail(`MISSING_${key}`);

          const authHeaders = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
          const apiJson = async (path) => {
            const response = await fetch(`https://api.vercel.com${path}`, {
              headers: authHeaders,
              redirect: 'manual',
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) fail(`VERCEL_READ_HTTP_${response.status}`);
            try {
              return await response.json();
            } catch {
              fail('VERCEL_READ_JSON_INVALID');
            }
          };
          const shaOf = (deployment) => deployment?.meta?.gitCommitSha || deployment?.meta?.githubCommitSha || '';
          const projectIdOf = (deployment) => deployment?.projectId || deployment?.project?.id || '';
          const projectNameOf = (deployment) => deployment?.name || deployment?.project?.name || '';

          const candidate = await apiJson(`/v13/deployments/${process.env.EXPECTED_DEPLOYMENT_ID}?teamId=${process.env.EXPECTED_ORG_ID}`);
          if (candidate.id !== process.env.EXPECTED_DEPLOYMENT_ID) fail('CANDIDATE_DEPLOYMENT_ID_MISMATCH');
          if (projectIdOf(candidate) !== process.env.EXPECTED_PROJECT_ID) fail('CANDIDATE_PROJECT_ID_MISMATCH');
          if (projectNameOf(candidate) !== process.env.EXPECTED_PROJECT_NAME) fail('CANDIDATE_PROJECT_NAME_MISMATCH');
          if (candidate?.team?.id !== process.env.EXPECTED_ORG_ID) fail('CANDIDATE_TEAM_MISMATCH');
          if (candidate.target !== 'production') fail('CANDIDATE_TARGET_NOT_PRODUCTION');
          if ((candidate.readyState || candidate.state || candidate.status) !== 'READY') fail('CANDIDATE_NOT_READY');
          if (shaOf(candidate) !== process.env.EXPECTED_APPLICATION_SHA) fail('CANDIDATE_SHA_MISMATCH');

          const canonicalHost = new URL(process.env.EXPECTED_CANONICAL_URL).hostname;
          const canonical = await apiJson(`/v13/deployments/${canonicalHost}?teamId=${process.env.EXPECTED_ORG_ID}`);
          if (canonical.id !== process.env.EXPECTED_PREVIOUS_CANONICAL_DEPLOYMENT) fail('PRE_CANONICAL_DEPLOYMENT_MISMATCH');
          if (shaOf(canonical) !== process.env.EXPECTED_PREVIOUS_CANONICAL_SHA) fail('PRE_CANONICAL_SHA_MISMATCH');

          console.log('FIXED_CONTRACT=PASS');
          console.log(`CANDIDATE_DEPLOYMENT=${candidate.id}`);
          console.log(`CANDIDATE_SHA=${shaOf(candidate)}`);
          console.log(`PRE_CANONICAL_DEPLOYMENT=${canonical.id}`);
          console.log(`PRE_CANONICAL_SHA=${shaOf(canonical)}`);
          NODE

      - name: Protected candidate health preflight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fail = (code) => {
            console.error(`G03_PROMOTION_GUARD=${code}`);
            process.exit(1);
          };
          const headers = { 'x-vercel-protection-bypass': process.env.VERCEL_AUTOMATION_BYPASS_SECRET };
          const getJson = async (path) => {
            const response = await fetch(`${process.env.EXPECTED_CANDIDATE_URL}${path}`, {
              headers,
              redirect: 'manual',
              signal: AbortSignal.timeout(20_000),
            });
            if (response.status !== 200) fail(`PREHEALTH_HTTP_${response.status}`);
            let body;
            try { body = await response.json(); } catch { fail('PREHEALTH_JSON_INVALID'); }
            return body;
          };
          const health = await getJson('/api/v1/health');
          if (health.status !== 'ok') fail('PREHEALTH_STATUS_INVALID');
          console.log('PRE_AUTH_HEALTH=PASS');
          for (let attempt = 1; attempt <= 3; attempt += 1) {
            const ready = await getJson('/api/v1/ready');
            if (ready.status !== 'ready' || ready.database !== 'ok') fail(`PREREADY_${attempt}_INVALID`);
            console.log(`PRE_AUTH_READY_${attempt}=PASS database=ok`);
            if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, 500));
          }
          NODE

      - name: Promote exact existing G03 deployment via Vercel API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fail = (code) => {
            console.error(`G03_PROMOTION_API=${code}`);
            process.exit(1);
          };
          const url = `https://api.vercel.com/v10/projects/${process.env.EXPECTED_PROJECT_ID}/promote/${process.env.EXPECTED_DEPLOYMENT_ID}?teamId=${process.env.EXPECTED_ORG_ID}`;
          const response = await fetch(url, {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` },
            redirect: 'manual',
            signal: AbortSignal.timeout(30_000),
          });
          const text = await response.text();
          if (!response.ok) {
            console.error(`G03_PROMOTION_API=HTTP_${response.status}`);
            process.exit(1);
          }
          let keys = [];
          if (text.trim()) {
            try { keys = Object.keys(JSON.parse(text)).sort(); } catch { keys = ['NON_JSON_RESPONSE']; }
          }
          console.log(`PROMOTION_API_STATUS=${response.status}`);
          console.log(`PROMOTION_RESPONSE_KEYS=${keys.join(',') || 'NONE'}`);
          console.log(`PROMOTION_REQUEST_UTC=${new Date().toISOString()}`);
          NODE

      - name: Prove exact canonical identity
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fail = (code) => {
            console.error(`G03_PROMOTION_GUARD=${code}`);
            process.exit(1);
          };
          const headers = { Authorization: `Bearer ${process.env.VERCEL_TOKEN}` };
          const shaOf = (deployment) => deployment?.meta?.gitCommitSha || deployment?.meta?.githubCommitSha || '';
          const projectIdOf = (deployment) => deployment?.projectId || deployment?.project?.id || '';
          const projectNameOf = (deployment) => deployment?.name || deployment?.project?.name || '';
          const canonicalHost = new URL(process.env.EXPECTED_CANONICAL_URL).hostname;

          for (let attempt = 1; attempt <= 60; attempt += 1) {
            const response = await fetch(`https://api.vercel.com/v13/deployments/${canonicalHost}?teamId=${process.env.EXPECTED_ORG_ID}`, {
              headers,
              redirect: 'manual',
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) fail(`CANONICAL_READ_HTTP_${response.status}`);
            const deployment = await response.json();
            if (deployment.id === process.env.EXPECTED_DEPLOYMENT_ID) {
              if (shaOf(deployment) !== process.env.EXPECTED_APPLICATION_SHA) fail('CANONICAL_SHA_MISMATCH');
              if (projectIdOf(deployment) !== process.env.EXPECTED_PROJECT_ID) fail('CANONICAL_PROJECT_ID_MISMATCH');
              if (projectNameOf(deployment) !== process.env.EXPECTED_PROJECT_NAME) fail('CANONICAL_PROJECT_NAME_MISMATCH');
              if ((deployment.readyState || deployment.state || deployment.status) !== 'READY') fail('CANONICAL_NOT_READY');
              console.log('CANONICAL_IDENTITY=PASS');
              console.log(`CANONICAL_DEPLOYMENT=${deployment.id}`);
              console.log(`CANONICAL_SHA=${shaOf(deployment)}`);
              console.log('CANONICAL_STATE=READY');
              process.exit(0);
            }
            if (attempt < 60) await new Promise((resolve) => setTimeout(resolve, 2000));
          }
          fail('CANONICAL_DEPLOYMENT_TIMEOUT');
          NODE

      - name: Publish sanitized promotion summary
        shell: bash
        run: |
          {
            echo '### G03 exact production promotion'
            echo '- Release: G03 — LEAVE QUOTA PROVISIONING V1'
            echo '- Project: sms-v3-staging'
            echo '- Deployment: dpl_rK4D47D2HaJ2ur4cLV1YfWtnu2eL'
            echo '- Application SHA: 1701bcf90a1998ea4999ee02e687172295984c9a'
            echo '- Operation: POST /v10/projects/{projectId}/promote/{deploymentId}'
            echo '- Canonical identity: verified exact'
            echo '- Rebuild/deploy/migration: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
