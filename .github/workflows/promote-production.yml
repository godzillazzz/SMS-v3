name: Promote sms-v3-staging Production

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-v3-staging-production
  cancel-in-progress: false

env:
  EXPECTED_CANDIDATE_SHA: 0951d4ce08de817dda7b986924232e86e745b532
  EXPECTED_STAGED_DEPLOYMENT: dpl_FmYkoc5hfCJ6g6xyGfdvufE56sYs
  EXPECTED_STAGED_URL: https://sms-v3-staging-ayoq2ueh1-godzillazz.vercel.app
  EXPECTED_OLD_CANONICAL_DEPLOYMENT: dpl_rK4D47D2HaJ2ur4cLV1YfWtnu2eL
  EXPECTED_OLD_CANONICAL_SHA: 1701bcf90a1998ea4999ee02e687172295984c9a
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout fixed Promotion harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preserve fixed read-only snapshot helper
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "ci/g03-1-production-promotion-v1"
          cp scripts/ci/g03-1-staged-technical-snapshot.js /tmp/g03-1-promotion-snapshot.js
          test -s /tmp/g03-1-promotion-snapshot.js

      - name: Checkout exact Candidate for Prisma client
        uses: actions/checkout@v4
        with:
          ref: 0951d4ce08de817dda7b986924232e86e745b532
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts
          npx --no-install prisma generate

      - name: Verify protected Production database target
        run: node scripts/ci/verify-deployment-target.js --verify

      - name: Verify exact Promotion-time deployment identities
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          staged_json=$(mktemp)
          canonical_json=$(mktemp)
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --get --data-urlencode "teamId=$EXPECTED_ORG_ID" --data-urlencode 'withGitRepoInfo=true' \
            "https://api.vercel.com/v13/deployments/$EXPECTED_STAGED_DEPLOYMENT" >"$staged_json"
          canonical_host="${EXPECTED_CANONICAL_URL#https://}"
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --get --data-urlencode "teamId=$EXPECTED_ORG_ID" --data-urlencode 'withGitRepoInfo=true' \
            "https://api.vercel.com/v13/deployments/$canonical_host" >"$canonical_json"
          node - "$staged_json" "$canonical_json" <<'NODE'
          const fs = require('node:fs');
          const [stagedFile, canonicalFile] = process.argv.slice(2);
          const staged = JSON.parse(fs.readFileSync(stagedFile, 'utf8'));
          const canonical = JSON.parse(fs.readFileSync(canonicalFile, 'utf8'));
          const sha = (d) => d?.meta?.githubCommitSha || d?.meta?.gitCommitSha || d?.gitSource?.sha || d?.source?.sha || null;
          if (staged.id !== process.env.EXPECTED_STAGED_DEPLOYMENT) throw new Error('PROMOTION_STAGED_ID_MISMATCH');
          if (sha(staged) !== process.env.EXPECTED_CANDIDATE_SHA) throw new Error('PROMOTION_STAGED_SHA_MISMATCH');
          if (staged.projectId !== process.env.EXPECTED_PROJECT_ID || staged.name !== process.env.EXPECTED_PROJECT_NAME) throw new Error('PROMOTION_STAGED_PROJECT_MISMATCH');
          if (staged.target !== 'production' || staged.readyState !== 'READY') throw new Error('PROMOTION_STAGED_STATE_INVALID');
          if (`https://${staged.url}` !== process.env.EXPECTED_STAGED_URL) throw new Error('PROMOTION_STAGED_URL_MISMATCH');
          if (canonical.id !== process.env.EXPECTED_OLD_CANONICAL_DEPLOYMENT) throw new Error('PROMOTION_OLD_CANONICAL_ID_MISMATCH');
          if (sha(canonical) !== process.env.EXPECTED_OLD_CANONICAL_SHA) throw new Error('PROMOTION_OLD_CANONICAL_SHA_MISMATCH');
          if (canonical.target !== 'production' || canonical.readyState !== 'READY') throw new Error('PROMOTION_OLD_CANONICAL_STATE_INVALID');
          console.log(`PROMOTION_IDENTITY=PASS staged=${staged.id} canonical=${canonical.id}`);
          NODE

      - name: Verify pre-Promotion Candidate and Canonical health
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          verify_url() {
            local base="$1"
            local label="$2"
            local health_json ready_json
            health_json=$(mktemp)
            curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$base/api/v1/health" >"$health_json"
            node - "$health_json" <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(d.status!=='ok') process.exit(1);
          NODE
            echo "${label}_HEALTH=200/ok"
            for n in 1 2 3; do
              ready_json=$(mktemp)
              curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
                --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                "$base/api/v1/ready" >"$ready_json"
              node - "$ready_json" <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(d.status!=='ready'||d.database!=='ok') process.exit(1);
          NODE
              echo "${label}_READY_${n}=200/ready/ok"
            done
            echo "${label}_READY=3/3"
          }
          verify_url "$EXPECTED_STAGED_URL" CANDIDATE_PREPROMOTION
          verify_url "$EXPECTED_CANONICAL_URL" CANONICAL_PREPROMOTION

      - name: Capture read-only Production safety snapshot before Promotion
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/g03-1-promotion-snapshot.js | tee /tmp/g03-1-promotion-pre.log
          node - /tmp/g03-1-promotion-pre.log /tmp/g03-1-promotion-pre.json <<'NODE'
          const fs=require('node:fs');
          const [logFile,outFile]=process.argv.slice(2);
          const line=fs.readFileSync(logFile,'utf8').split(/\r?\n/).find(v=>v.startsWith('STAGED_TECH_SNAPSHOT='));
          if(!line) throw new Error('PROMOTION_PRE_SNAPSHOT_MISSING');
          const d=JSON.parse(line.slice('STAGED_TECH_SNAPSHOT='.length));
          if(d.readOnly.transactionReadOnly!=='on'||d.readOnly.transactionIdAssigned!==null) throw new Error('PROMOTION_PRE_NOT_READ_ONLY');
          if(d.activation.effective!=='INACTIVE') throw new Error('G03_1_PROMOTION_ACTIVATION_UNSAFE');
          if(d.counts.quotaYearOtherRows!==0) throw new Error('G03_1_PROMOTION_SECOND_YEAR_ROW_DETECTED');
          if(d.schema.migrationCount!==17||d.schema.pendingMigrations.length!==0||!d.schema.authorizedMigrationApplied) throw new Error('PROMOTION_MIGRATION_STATE_INVALID');
          if(d.counts.leaveQuotaRows!==66||d.counts.quotaYear2026Rows!==63||d.counts.quotaYearNullRows!==3) throw new Error('PROMOTION_QUOTA_DISTRIBUTION_INVALID');
          const e=d.totals2026.entitlement;
          if(e.sickLeave!==1856||e.personalLeave!==164||e.vacationLeave!==299) throw new Error('G03_1_PROMOTION_2026_ENTITLEMENT_INVALID');
          fs.writeFileSync(outFile, JSON.stringify(d));
          console.log(`PROMOTION_PRE_SNAPSHOT=PASS activation=${d.activation.valueClass}/${d.activation.effective} quota=${d.counts.leaveQuotaRows}/${d.counts.quotaYear2026Rows}/${d.counts.quotaYearNullRows}/${d.counts.quotaYearOtherRows}`);
          console.log(`PROMOTION_PRE_2026=sick:${e.sickLeave}/${d.totals2026.used.sickLeave}/${d.totals2026.remaining.sickLeave} personal:${e.personalLeave}/${d.totals2026.used.personalLeave}/${d.totals2026.remaining.personalLeave} vacation:${e.vacationLeave}/${d.totals2026.used.vacationLeave}/${d.totals2026.remaining.vacationLeave}`);
          console.log(`PROMOTION_PRE_FINGERPRINT=${d.businessFingerprint}`);
          NODE

      - name: Hard-gate activation and Promote exact existing deployment once
        shell: bash
        run: |
          set -euo pipefail
          # Final DB gate occurs in the same step immediately before the single Promotion API call.
          node /tmp/g03-1-promotion-snapshot.js | tee /tmp/g03-1-promotion-hard-gate.log
          node - /tmp/g03-1-promotion-hard-gate.log /tmp/g03-1-promotion-pre.json <<'NODE'
          const fs=require('node:fs');
          const [gateLog,preFile]=process.argv.slice(2);
          const line=fs.readFileSync(gateLog,'utf8').split(/\r?\n/).find(v=>v.startsWith('STAGED_TECH_SNAPSHOT='));
          if(!line) throw new Error('PROMOTION_HARD_GATE_SNAPSHOT_MISSING');
          const d=JSON.parse(line.slice('STAGED_TECH_SNAPSHOT='.length));
          const pre=JSON.parse(fs.readFileSync(preFile,'utf8'));
          if(d.readOnly.transactionReadOnly!=='on'||d.readOnly.transactionIdAssigned!==null) throw new Error('PROMOTION_HARD_GATE_NOT_READ_ONLY');
          if(d.activation.effective!=='INACTIVE') throw new Error('G03_1_PROMOTION_ACTIVATION_UNSAFE');
          if(d.counts.quotaYearOtherRows!==0) throw new Error('G03_1_PROMOTION_SECOND_YEAR_ROW_DETECTED');
          if(d.businessFingerprint!==pre.businessFingerprint) throw new Error('PROMOTION_HARD_GATE_FINGERPRINT_CHANGED');
          const e=d.totals2026.entitlement;
          if(e.sickLeave!==1856||e.personalLeave!==164||e.vacationLeave!==299) throw new Error('G03_1_PROMOTION_2026_ENTITLEMENT_INVALID');
          console.log(`PROMOTION_HARD_GATE=PASS activation=${d.activation.valueClass}/${d.activation.effective}`);
          NODE

          staged_json=$(mktemp)
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --get --data-urlencode "teamId=$EXPECTED_ORG_ID" --data-urlencode 'withGitRepoInfo=true' \
            "https://api.vercel.com/v13/deployments/$EXPECTED_STAGED_DEPLOYMENT" >"$staged_json"
          node - "$staged_json" <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const sha=d?.meta?.githubCommitSha||d?.meta?.gitCommitSha||d?.gitSource?.sha||d?.source?.sha||null;
          if(d.id!==process.env.EXPECTED_STAGED_DEPLOYMENT||sha!==process.env.EXPECTED_CANDIDATE_SHA||d.projectId!==process.env.EXPECTED_PROJECT_ID||d.target!=='production'||d.readyState!=='READY') throw new Error('PROMOTION_FINAL_IDENTITY_GATE_FAILED');
          console.log('PROMOTION_FINAL_IDENTITY_GATE=PASS');
          NODE

          promote_body=$(mktemp)
          promote_http=$(curl --silent --show-error --location --proto '=https' --tlsv1.2 \
            --request POST \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --output "$promote_body" \
            --write-out '%{http_code}' \
            "https://api.vercel.com/v10/projects/$EXPECTED_PROJECT_ID/promote/$EXPECTED_STAGED_DEPLOYMENT?teamId=$EXPECTED_ORG_ID")
          echo "PROMOTION_API=POST /v10/projects/{projectId}/promote/{deploymentId}"
          echo "PROMOTION_HTTP=$promote_http"
          if [[ ! "$promote_http" =~ ^2[0-9][0-9]$ ]]; then
            node - "$promote_body" <<'NODE'
          const fs=require('node:fs'); let code='UNKNOWN'; try{const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); code=String(d?.error?.code||d?.code||'UNKNOWN').replace(/[^A-Za-z0-9_-]/g,'').slice(0,80)}catch{} console.error(`PROMOTION_API_ERROR_CODE=${code}`);
          NODE
            exit 1
          fi
          echo 'PROMOTION_EXECUTED=YES'
          echo 'PROMOTION_DISPATCH_COUNT=1'

      - name: Poll until Canonical resolves to exact promoted deployment
        shell: bash
        run: |
          set -euo pipefail
          canonical_host="${EXPECTED_CANONICAL_URL#https://}"
          matched=0
          for attempt in $(seq 1 30); do
            canonical_json=$(mktemp)
            curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --get --data-urlencode "teamId=$EXPECTED_ORG_ID" --data-urlencode 'withGitRepoInfo=true' \
              "https://api.vercel.com/v13/deployments/$canonical_host" >"$canonical_json"
            if node - "$canonical_json" <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const sha=d?.meta?.githubCommitSha||d?.meta?.gitCommitSha||d?.gitSource?.sha||d?.source?.sha||null;
          if(d.id!==process.env.EXPECTED_STAGED_DEPLOYMENT||sha!==process.env.EXPECTED_CANDIDATE_SHA||d.target!=='production'||d.readyState!=='READY') process.exit(1);
          NODE
            then
              matched=1
              echo "PROMOTION_CANONICAL_MATCH_ATTEMPT=$attempt"
              break
            fi
            sleep 2
          done
          test "$matched" = 1
          echo "PROMOTION_CANONICAL_DEPLOYMENT=$EXPECTED_STAGED_DEPLOYMENT"
          echo "PROMOTION_CANONICAL_SHA=$EXPECTED_CANDIDATE_SHA"
          echo 'PROMOTION_CANONICAL_STATE=READY'
          echo 'PROMOTION_CANONICAL_IDENTITY=PASS'

      - name: Recheck activation and Production accounting after Promotion
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/g03-1-promotion-snapshot.js | tee /tmp/g03-1-promotion-post.log
          node - /tmp/g03-1-promotion-post.log /tmp/g03-1-promotion-pre.json <<'NODE'
          const fs=require('node:fs');
          const [postLog,preFile]=process.argv.slice(2);
          const line=fs.readFileSync(postLog,'utf8').split(/\r?\n/).find(v=>v.startsWith('STAGED_TECH_SNAPSHOT='));
          if(!line) throw new Error('PROMOTION_POST_SNAPSHOT_MISSING');
          const post=JSON.parse(line.slice('STAGED_TECH_SNAPSHOT='.length));
          const pre=JSON.parse(fs.readFileSync(preFile,'utf8'));
          if(post.readOnly.transactionReadOnly!=='on'||post.readOnly.transactionIdAssigned!==null) throw new Error('PROMOTION_POST_NOT_READ_ONLY');
          if(post.activation.effective!=='INACTIVE') throw new Error('G03_1_PROMOTION_POST_ACTIVATION_UNSAFE');
          if(post.counts.quotaYearOtherRows!==0) throw new Error('G03_1_PROMOTION_SECOND_YEAR_ROW_DETECTED');
          if(post.counts.leaveQuotaRows!==pre.counts.leaveQuotaRows||post.counts.quotaYear2026Rows!==pre.counts.quotaYear2026Rows||post.counts.quotaYearNullRows!==pre.counts.quotaYearNullRows) throw new Error('PROMOTION_QUOTA_ROWS_CHANGED');
          if(post.counts.systemSettingRows!==pre.counts.systemSettingRows) throw new Error('PROMOTION_SYSTEM_SETTING_ROWS_CHANGED');
          if(post.counts.migrationRows!==pre.counts.migrationRows) throw new Error('PROMOTION_MIGRATION_ROWS_CHANGED');
          if(post.businessFingerprint!==pre.businessFingerprint) throw new Error('G03_1_PROMOTION_2026_PRESERVATION_FAILED');
          const pe=pre.totals2026.entitlement, qe=post.totals2026.entitlement;
          if(JSON.stringify(pe)!==JSON.stringify(qe)) throw new Error('G03_1_PROMOTION_2026_ENTITLEMENT_CHANGED');
          const usedSame=JSON.stringify(pre.totals2026.used)===JSON.stringify(post.totals2026.used);
          const remainingSame=JSON.stringify(pre.totals2026.remaining)===JSON.stringify(post.totals2026.remaining);
          console.log(`PROMOTION_POST_ACTIVATION=${post.activation.valueClass}/${post.activation.effective}`);
          console.log(`PROMOTION_POST_QUOTA=${post.counts.leaveQuotaRows}/${post.counts.quotaYear2026Rows}/${post.counts.quotaYearNullRows}/${post.counts.quotaYearOtherRows}`);
          console.log(`PROMOTION_POST_2026=sick:${qe.sickLeave}/${post.totals2026.used.sickLeave}/${post.totals2026.remaining.sickLeave} personal:${qe.personalLeave}/${post.totals2026.used.personalLeave}/${post.totals2026.remaining.personalLeave} vacation:${qe.vacationLeave}/${post.totals2026.used.vacationLeave}/${post.totals2026.remaining.vacationLeave}`);
          console.log(`PROMOTION_POST_FINGERPRINT=${post.businessFingerprint}`);
          console.log(`PROMOTION_2026_ENTITLEMENT_PRESERVED=YES`);
          console.log(`PROMOTION_2026_USED_EXACT=${usedSame?'YES':'NO_CONCURRENT_ACTIVITY_REVIEW_REQUIRED'}`);
          console.log(`PROMOTION_2026_REMAINING_EXACT=${remainingSame?'YES':'NO_CONCURRENT_ACTIVITY_REVIEW_REQUIRED'}`);
          console.log('PROMOTION_BUSINESS_WRITE_GUARD=PASS');
          NODE

      - name: Verify post-Promotion Canonical health and ready 3 of 3
        shell: bash
        run: |
          set -euo pipefail
          health_json=$(mktemp)
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
            --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$EXPECTED_CANONICAL_URL/api/v1/health" >"$health_json"
          node - "$health_json" <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(d.status!=='ok') process.exit(1);
          NODE
          echo 'PROMOTION_POST_HEALTH=200/ok'
          for n in 1 2 3; do
            ready_json=$(mktemp)
            curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
              --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
              "$EXPECTED_CANONICAL_URL/api/v1/ready" >"$ready_json"
            node - "$ready_json" <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(d.status!=='ready'||d.database!=='ok') process.exit(1);
          NODE
            echo "PROMOTION_POST_READY_${n}=200/ready/ok"
          done
          echo 'PROMOTION_POST_READY=3/3'

      - name: Publish fixed Promotion summary
        shell: bash
        run: |
          {
            echo '### G03.1 exact existing-deployment Promotion'
            echo '- Project: sms-v3-staging'
            echo '- Deployment: dpl_FmYkoc5hfCJ6g6xyGfdvufE56sYs'
            echo '- Application SHA: 0951d4ce08de817dda7b986924232e86e745b532'
            echo '- Promotion execution: exactly one API call'
            echo '- New deployment: not created'
            echo '- Activation: remains INACTIVE'
            echo '- Migration: not performed'
            echo '- Business data mutation: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
