name: Apply Approved Production Migration V2

on:
  workflow_dispatch:
  push:
    branches:
      - fix/serverless-database-reliability
    paths:
      - .github/workflows/apply-approved-production-migration-v2.yml
      - .github/releases/approved-cfg06-production-migration.json
      - scripts/ci/verify-approved-production-migration.js
      - scripts/ci/verify-cfg06-production-migration.js

permissions:
  contents: read
  actions: read

concurrency:
  group: sms-v3-staging-production-migration-v2
  cancel-in-progress: false

env:
  MANIFEST_PATH: .github/releases/approved-cfg06-production-migration.json
  EXPECTED_SOURCE_BRANCH: fix/serverless-database-reliability
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app

jobs:
  prepare:
    name: Prepare exact approved Production migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.manifest.outputs.source_commit_sha }}
      source_tree: ${{ steps.manifest.outputs.source_tree_sha }}
      migration_name: ${{ steps.manifest.outputs.migration_name }}
      migration_path: ${{ steps.manifest.outputs.migration_path }}
      post_verify_script: ${{ steps.manifest.outputs.post_verify_script }}
      current_production_deployment_id: ${{ steps.manifest.outputs.current_production_deployment_id }}
      current_production_application_sha: ${{ steps.manifest.outputs.current_production_application_sha }}
      prisma_schema_changed: ${{ steps.manifest.outputs.prisma_schema_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate migration manifest and controlled SQL policy
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          output=$(mktemp)
          trap 'rm -f "$output"' EXIT
          node scripts/ci/verify-approved-production-migration.js "$MANIFEST_PATH" >"$output"
          grep -Fxq 'PRODUCTION_MIGRATION_MANIFEST_GUARD=PASS' "$output"
          while IFS='=' read -r key value; do
            case "$key" in
              source_commit_sha|source_tree_sha|migration_name|migration_path|post_verify_script|current_production_deployment_id|current_production_application_sha|prisma_schema_changed)
                echo "$key=$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <"$output"

      - name: Validate exact source identity, Prisma delta, and successful CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.manifest.outputs.source_commit_sha }}
          SOURCE_TREE: ${{ steps.manifest.outputs.source_tree_sha }}
          MIGRATION_PATH: ${{ steps.manifest.outputs.migration_path }}
          CURRENT_PRODUCTION_APPLICATION_SHA: ${{ steps.manifest.outputs.current_production_application_sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$EXPECTED_SOURCE_BRANCH"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git cat-file -e "${CURRENT_PRODUCTION_APPLICATION_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" "origin/$EXPECTED_SOURCE_BRANCH"
          git merge-base --is-ancestor "$CURRENT_PRODUCTION_APPLICATION_SHA" "$SOURCE_SHA"
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$SOURCE_TREE"

          changed_prisma=$(git diff --name-only "$CURRENT_PRODUCTION_APPLICATION_SHA" "$SOURCE_SHA" -- prisma/schema.prisma prisma/migrations | sort)
          if test "${{ steps.manifest.outputs.prisma_schema_changed }}" = "true"; then
            expected_prisma=$(printf '%s\n%s\n' "$MIGRATION_PATH" 'prisma/schema.prisma' | sort)
          else
            expected_prisma=$(printf '%s\n' "$MIGRATION_PATH" | sort)
          fi
          test "$changed_prisma" = "$expected_prisma"

          ci_success=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SOURCE_SHA" --limit 20 --json status,conclusion --jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
          test "$ci_success" -ge 1
          test -z "$(git status --porcelain)"

      - name: Publish Owner migration decision summary
        shell: bash
        run: |
          {
            echo '### CFG-06 Production migration prepared'
            echo "- Exact application source SHA: ${{ steps.manifest.outputs.source_commit_sha }}"
            echo "- Exact application tree: ${{ steps.manifest.outputs.source_tree_sha }}"
            echo "- Migration: ${{ steps.manifest.outputs.migration_name }}"
            echo '- Policy: governed SystemSetting seed only; no schema change; no data backfill'
            echo '- Historical data backfill: NO'
            echo '- Application deployment: NO'
            echo '- Destructive rollback: NO'
            echo "- Current Production deployment remains: ${{ steps.manifest.outputs.current_production_deployment_id }}"
            echo '- Owner action: Approve Production Migration only'
          } >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Approve Production Migration
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      NODE_ENV: production
      VERCEL_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
      SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
      SOURCE_TREE: ${{ needs.prepare.outputs.source_tree }}
      MIGRATION_NAME: ${{ needs.prepare.outputs.migration_name }}
      MIGRATION_PATH: ${{ needs.prepare.outputs.migration_path }}
      POST_VERIFY_SCRIPT: ${{ needs.prepare.outputs.post_verify_script }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revalidate exact migration source after Owner approval
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$SOURCE_TREE"
          test -z "$(git status --porcelain)"
          git fetch --no-tags origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:scripts/ci/verify-approved-production-migration.js" >/tmp/verify-approved-production-migration.js
          git show "$GITHUB_SHA:$MANIFEST_PATH" >/tmp/approved-production-migration.json
          git show "$GITHUB_SHA:$POST_VERIFY_SCRIPT" >/tmp/post-verify-production-migration.js
          node - <<'NODE'
          const fs = require('node:fs');
          const verifier = require('/tmp/verify-approved-production-migration.js');
          const manifest = JSON.parse(fs.readFileSync('/tmp/approved-production-migration.json', 'utf8'));
          const result = verifier.validateMigrationManifest(manifest, { root: process.cwd(), verifySql: false });
          const sql = fs.readFileSync(result.migrationPath, 'utf8');
          verifier.validateSqlForMigration(result.migrationId, sql);
          process.stdout.write('POST_APPROVAL_MIGRATION_REVALIDATION=PASS\n');
          NODE
          test -z "$(git status --porcelain)"

      - run: npm ci
      - run: npx prisma generate

      - name: Verify Production database target guard
        run: node scripts/ci/verify-deployment-target.js --verify

      - name: Require exactly the approved CFG-06 migration to be pending
        shell: bash
        run: |
          set -euo pipefail
          status_output=$(mktemp)
          trap 'rm -f "$status_output"' EXIT
          node scripts/ci/prisma-migration.js status --allow-pending >"$status_output"
          grep -Fxq 'MIGRATION_STATUS_CLASS=PENDING_MIGRATIONS_ONLY' "$status_output"
          grep -Fxq "MIGRATION_NAME=$MIGRATION_NAME" "$status_output"
          grep -Fxq 'PENDING_MIGRATIONS=true' "$status_output"
          node - <<'NODE'
          const fs = require('node:fs');
          const verifier = require('/tmp/verify-approved-production-migration.js');
          const manifest = JSON.parse(fs.readFileSync('/tmp/approved-production-migration.json', 'utf8'));
          const result = verifier.validateMigrationManifest(manifest, { root: process.cwd(), verifySql: false });
          verifier.validateSqlForMigration(result.migrationId, fs.readFileSync(result.migrationPath, 'utf8'));
          process.stdout.write('MIGRATION_POLICY_REVALIDATION=PASS\n');
          NODE
          echo 'EXACT_PENDING_MIGRATION=PASS'

      - name: Apply exact approved Production migration
        run: node scripts/ci/prisma-migration.js deploy

      - name: Verify migration status and CFG-06 database invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prisma-migration.js status
          NODE_PATH="$PWD/node_modules" node /tmp/post-verify-production-migration.js

      - name: Verify canonical application remains healthy
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl --fail --silent --show-error "$EXPECTED_CANONICAL_URL/api/v1/health")
          ready=$(curl --fail --silent --show-error "$EXPECTED_CANONICAL_URL/api/v1/ready")
          node - "$health" "$ready" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const ready = JSON.parse(process.argv[3]);
          if (health.status !== 'ok') throw new Error('Canonical health failed');
          if (ready.status !== 'ready' || ready.database !== 'ok') throw new Error('Canonical readiness failed');
          process.stdout.write('CANONICAL_APPLICATION_AFTER_MIGRATION=PASS\n');
          NODE

      - name: Migration summary
        shell: bash
        run: |
          {
            echo '### CFG-06 Production migration'
            echo '- Migration status: PASS'
            echo '- Approval Authority policy defaults: VERIFIED'
            echo '- Historical data backfill: NOT PERFORMED'
            echo '- Admin authority / reviewer-role / SLA seed invariants: VERIFIED'
            echo '- Canonical application health/readiness: PASS'
            echo '- Application deployment performed: NO'
            echo '- Destructive rollback performed: NO'
          } >> "$GITHUB_STEP_SUMMARY"
