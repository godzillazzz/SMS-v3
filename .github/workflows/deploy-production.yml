name: Deploy sms-v3-staging Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit SHA already present on fix/serverless-database-reliability
        required: true
        type: string
      tree_sha:
        description: Exact Git tree SHA for the approved release source
        required: true
        type: string
      confirm_project_name:
        description: Type sms-v3-staging to confirm the target project
        required: true
        type: string
      confirm_environment:
        description: Type production to confirm the Vercel target
        required: true
        type: string
      rollback_deployment_id:
        description: Known-good rollback target for the summary only
        required: false
        default: dpl_FBBYLL6oZ9AcwUDtX5eaLJ1stN2R
        type: string
      diagnostic_only:
        description: Run sanitized Vercel identity/linkage diagnostics without migration or deployment
        required: false
        default: false
        type: boolean
      stage_only:
        description: Create a READY production-target deployment without aliasing canonical domains; promote separately
        required: false
        default: false
        type: boolean
      run_migrations:
        description: Run protected Prisma migrations before deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sms-v3-staging-production
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_CANONICAL_SOURCE_SHA: 70d1113233cea5ebc909eb6db656ec35cde49106
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Verify environment governance contract definition
        run: node scripts/ci/verify-environment-contract.js --contract-only
      - name: Validate exact branch commit and confirmations
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_project_name }}" = "$EXPECTED_PROJECT_NAME"
          test "${{ inputs.confirm_environment }}" = "production"
          TARGET_SHA="${{ inputs.commit_sha }}"
          TARGET_TREE="${{ inputs.tree_sha }}"
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_TREE" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin fix/serverless-database-reliability
          git cat-file -e "${TARGET_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" origin/fix/serverless-database-reliability
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          if [[ "${{ inputs.run_migrations }}" == "false" ]]; then
            git diff --quiet "$EXPECTED_CANONICAL_SOURCE_SHA" "$TARGET_SHA" -- prisma/schema.prisma prisma/migrations
          fi
          test -z "$(git status --porcelain)"
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  migrate:
    if: ${{ inputs.diagnostic_only != true && inputs.run_migrations == true }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      NODE_ENV: production
      VERCEL_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Verify production database target guard
        run: node scripts/ci/verify-deployment-target.js --verify
      - name: Diagnose Prisma migration status (sanitized)
        shell: bash
        run: |
          set -u
          diagnostics_dir=$(mktemp -d)
          trap 'rm -rf "$diagnostics_dir"' EXIT
          validate_log="$diagnostics_dir/validate.log"
          diff_log="$diagnostics_dir/diff.log"

          validate_exit=0
          npx prisma validate --schema prisma/schema.prisma >"$validate_log" 2>&1 || validate_exit=$?

          status_exit=0
          node scripts/ci/prisma-migration.js status --allow-pending || status_exit=$?

          diff_exit=0
          npx prisma migrate diff \
            --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma \
            --script >"$diff_log" 2>&1 || diff_exit=$?

          if [[ "$diff_exit" -eq 0 ]]; then
            if grep -Eiq 'no difference detected|no differences detected' "$diff_log"; then
              diff_summary=no_difference
            else
              diff_summary="summary_lines=$(wc -l < "$diff_log" | tr -d ' ')"
            fi
          else
            diff_summary=unavailable
          fi

          echo "PRISMA_VALIDATE=$([[ "$validate_exit" -eq 0 ]] && echo passed || echo failed)"
          echo "MIGRATE_DIFF_SUMMARY=$diff_summary"

          if [[ "$validate_exit" -ne 0 ]]; then
            exit "$validate_exit"
          fi
          if [[ "$status_exit" -ne 0 ]]; then
            exit "$status_exit"
          fi
      - name: Apply pending migrations with direct connection
        run: node scripts/ci/prisma-migration.js deploy
      - name: Verify no pending migrations remain
        run: node scripts/ci/prisma-migration.js status

  diagnose:
    if: ${{ inputs.diagnostic_only == true }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run sanitized Vercel identity and linkage diagnostics
        run: node scripts/ci/vercel-linkage.js --diagnostic

  deploy:
    if: ${{ always() && inputs.diagnostic_only != true && (inputs.run_migrations == false || needs.migrate.result == 'success') && needs.validate.result == 'success' }}
    needs: [validate, migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    outputs:
      deployment_url: ${{ steps.deploy.outputs.deployment_url }}
      deployment_id: ${{ steps.deploy.outputs.deployment_id }}
    env:
      NODE_ENV: production
      VERCEL_ENV: production
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
      RUN_MIGRATIONS: ${{ inputs.run_migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Vercel project linkage
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          npx --yes vercel@"$VERCEL_CLI_VERSION" pull --yes --environment=production --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >/tmp/vercel-pull.log 2>&1
          node - <<'NODE'
          const fs = require('node:fs');
          const project = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (project.projectId !== process.env.EXPECTED_PROJECT_ID || project.orgId !== process.env.EXPECTED_ORG_ID) process.exit(1);
          NODE
      - name: Verify Production control-plane contract and master database target before build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        shell: bash
        run: |
          set -euo pipefail
          env_file=.vercel/.env.production.local
          test -f "$env_file"
          metadata_file=$(mktemp)
          trap 'rm -f "$metadata_file"' EXIT
          npx --yes vercel@"$VERCEL_CLI_VERSION" env list production --format json --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >"$metadata_file"
          node - "$metadata_file" "$env_file" <<'NODE'
          const fs = require('node:fs');
          const dotenv = require('dotenv');
          const contract = require('./config/environment-contract.json');
          const { validateCors } = require('./scripts/ci/verify-environment-contract');
          const [metadataFile, envFile] = process.argv.slice(2);
          const data = JSON.parse(fs.readFileSync(metadataFile, 'utf8'));
          const rows = Array.isArray(data.envs) ? data.envs : [];
          const required = [...new Set([...contract.environments.production.required, 'DIRECT_URL'])];
          const productionRows = (key) => rows.filter((row) =>
            row && row.key === key && Array.isArray(row.target) && row.target.includes('production') && !row.gitBranch
          );
          for (const key of required) {
            const matches = productionRows(key);
            if (matches.length !== 1) throw new Error(`${key} must have exactly one project-level Production row`);
          }
          for (const key of ['DATABASE_URL', 'DIRECT_URL']) {
            const type = String(productionRows(key)[0].type || '').toLowerCase();
            if (type !== 'sensitive') throw new Error(`${key} must remain Vercel Sensitive`);
          }
          const corsType = String(productionRows('CORS_ORIGIN')[0].type || '').toLowerCase();
          if (corsType !== 'encrypted') throw new Error('CORS_ORIGIN must remain Vercel non-sensitive/encrypted');
          const pulled = dotenv.parse(fs.readFileSync(envFile, 'utf8'));
          validateCors('production', pulled, contract);
          process.stdout.write([
            'PRODUCTION_CONTROL_PLANE_PREFLIGHT=PASS',
            'DATABASE_URL_METADATA=SENSITIVE_PRESENT',
            'DIRECT_URL_METADATA=SENSITIVE_PRESENT',
            'CORS_ORIGIN_METADATA=ENCRYPTED_PRESENT',
            'CORS_CONTRACT=PASS'
          ].join('\n') + '\n');
          NODE
          test -n "$DATABASE_URL"
          test -n "$DIRECT_URL"
          test "$(git rev-parse HEAD)" = "${{ needs.validate.outputs.commit_sha }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ inputs.tree_sha }}"
          node scripts/ci/verify-deployment-target.js --verify
          echo 'PRODUCTION_DATABASE_MASTER_TARGET=PASS'
      - name: Verify current canonical Production CORS baseline
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const base = process.env.EXPECTED_CANONICAL_URL.replace(/\/$/, '');
          const trustedOrigin = new URL(process.env.EXPECTED_CANONICAL_URL).origin;
          const untrustedOrigin = 'https://untrusted.invalid';
          async function preflight(origin) {
            return fetch(`${base}/api/v1/auth/login`, {
              method: 'OPTIONS',
              headers: { Origin: origin, 'Access-Control-Request-Method': 'POST' },
              redirect: 'manual'
            });
          }
          async function main() {
            const trusted = await preflight(trustedOrigin);
            if (trusted.status !== 204) throw new Error(`trusted CORS baseline status ${trusted.status}`);
            if (trusted.headers.get('access-control-allow-origin') !== trustedOrigin) throw new Error('trusted CORS baseline origin mismatch');
            if (trusted.headers.get('access-control-allow-credentials') !== 'true') throw new Error('trusted CORS baseline credentials mismatch');
            const denied = await preflight(untrustedOrigin);
            if (denied.status !== 403) throw new Error(`untrusted CORS baseline status ${denied.status}`);
            if (denied.headers.get('access-control-allow-origin')) throw new Error('untrusted CORS baseline unexpectedly allowed');
            process.stdout.write('CURRENT_CANONICAL_CORS_BASELINE=PASS\n');
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE
      - name: Build prebuilt artifact after migration gate
        shell: bash
        run: |
          set -euo pipefail
          build_log=$(mktemp)
          trap 'rm -f "$build_log"' EXIT
          CI_MIGRATION_COMPLETED=true npx --yes vercel@"$VERCEL_CLI_VERSION" build --prod --token "$VERCEL_TOKEN" >"$build_log" 2>&1
          grep -Fq 'Vercel build is build-only' "$build_log"
          grep -Fq 'Prisma generate passed' "$build_log"
          grep -Fq 'Application build passed' "$build_log"
          if grep -Eiq 'prisma migrate deploy|Prisma migrate deploy started|Prisma migrate deploy passed' "$build_log"; then
            echo 'Vercel build unexpectedly invoked Prisma migration'
            exit 1
          fi
          test -f frontend/dist/index.html
          compgen -G 'frontend/dist/assets/index-*.js' >/dev/null
          if find frontend/dist -type f -path '*/_next/*' -print -quit | grep -q .; then
            echo 'Vite artifact unexpectedly contains _next output'
            exit 1
          fi
          if grep -Eiq 'postgresql://|DATABASE_URL=.*[^<]|DIRECT_URL=.*[^<]|password=|SUPABASE_SERVICE_ROLE_KEY' "$build_log"; then
            echo 'Vercel build log secret scan failed'
            exit 1
          fi
          node scripts/ci/verify-release-artifact.js frontend/dist .vercel/output/static
          node scripts/ci/verify-linux-artifact.js .vercel/output --require-sharp-load
      - name: Restore exact source and verify git-clean prebuilt deploy
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree -- .
          git clean -fd
          test -f frontend/dist/index.html
          test -f .vercel/output/config.json
          test -z "$(git status --porcelain)"
      - name: Deploy prebuilt artifact to the approved production project
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_stdout=$(mktemp)
          deploy_stderr=$(mktemp)
          deployment_output=$(mktemp)
          inspect_stdout=$(mktemp)
          inspect_stderr=$(mktemp)
          inspection_output=$(mktemp)
          trap 'rm -f "$deploy_stdout" "$deploy_stderr" "$deployment_output" "$inspect_stdout" "$inspect_stderr" "$inspection_output"' EXIT
          deploy_args=(deploy --prebuilt --prod --yes --project "$EXPECTED_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --format=json)
          if [[ "${{ inputs.stage_only }}" == "true" ]]; then
            deploy_args+=(--skip-domain)
          fi
          npx --yes vercel@"$VERCEL_CLI_VERSION" "${deploy_args[@]}" >"$deploy_stdout" 2>"$deploy_stderr"
          node scripts/ci/vercel-deployment.js "$deploy_stdout" "$EXPECTED_PROJECT_ID" "${{ inputs.rollback_deployment_id }}" >"$deployment_output"
          while IFS='=' read -r key value; do
            case "$key" in
              deployment_id) deployment_id="$value" ;;
              deployment_url) deployment_url="$value" ;;
              deployment_created_at) deployment_created_at="$value" ;;
              deployment_ready_state) deployment_ready_state="$value" ;;
              deployment_source) deployment_source="$value" ;;
            esac
          done <"$deployment_output"
          test -n "${deployment_id:-}"
          test -n "${deployment_url:-}"
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$deployment_url" =~ ^https://sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app/?$ ]]
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$deployment_id" --format=json --token "$VERCEL_TOKEN" >"$inspect_stdout" 2>"$inspect_stderr"
          node - "$inspect_stdout" "$deployment_id" "$EXPECTED_PROJECT_ID" "${{ needs.validate.outputs.commit_sha }}" <<'NODE' >"$inspection_output"
          const fs = require('node:fs');
          const { inspectDeploymentRecord } = require('./scripts/ci/vercel-deployment');
          const [file, expectedId, expectedProjectId, expectedCommit] = process.argv.slice(2);
          const record = inspectDeploymentRecord(fs.readFileSync(file, 'utf8'), { expectedId, expectedProjectId });
          if (record.target !== 'production') throw new Error('Vercel deployment target is not production');
          if (record.commitSha && record.commitSha !== expectedCommit) throw new Error('Vercel deployment commit mismatch');
          process.stdout.write(`inspection_id=${record.id}\ninspection_created_at=${record.createdAt || 'unknown'}\ninspection_commit=${record.commitSha || expectedCommit}\ninspection_source=prebuilt\n`);
          NODE
          while IFS='=' read -r key value; do
            case "$key" in
              inspection_created_at) inspection_created_at="$value" ;;
              inspection_commit) inspection_commit="$value" ;;
              inspection_source) inspection_source="$value" ;;
            esac
          done <"$inspection_output"
          if [[ "${{ inputs.stage_only }}" == "true" ]]; then
            expected_previous="${{ inputs.rollback_deployment_id }}"
            [[ "$expected_previous" =~ ^dpl_[A-Za-z0-9]+$ ]]
            canonical_log=$(mktemp)
            npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >"$canonical_log" 2>&1
            node - "$canonical_log" "$expected_previous" <<'NODE'
          const fs = require('node:fs');
          const [file, expectedId] = process.argv.slice(2);
          const raw = fs.readFileSync(file, 'utf8');
          const match = raw.match(/\{[\s\S]*\}/);
          const fail = (category) => { console.error(`STAGE_GUARD=${category}`); process.exit(1); };
          if (!match) fail('CANONICAL_INSPECT_JSON_MISSING');
          let data;
          try { data = JSON.parse(match[0]); } catch { fail('CANONICAL_INSPECT_JSON_INVALID'); }
          if (data.id !== expectedId) fail('CANONICAL_CHANGED_DURING_STAGE');
          if (data.target !== 'production') fail('CANONICAL_TARGET_NOT_PRODUCTION');
          if ((data.readyState || data.state) !== 'READY') fail('CANONICAL_NOT_READY');
          console.log(`STAGE_ONLY_CANONICAL_UNCHANGED=${data.id}`);
          NODE
            rm -f "$canonical_log"
          fi
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          {
            echo '### Vercel deployment'
            echo "- Project: $EXPECTED_PROJECT_NAME"
            echo "- Deployment URL: $deployment_url"
            echo "- Deployment ID: $deployment_id"
            echo "- Source: $deployment_source"
            echo "- Build commit: $inspection_commit"
            echo "- Created at: $inspection_created_at"
            echo "- Ready state: $deployment_ready_state"
            echo "- Rollback target: ${{ inputs.rollback_deployment_id }}"
            echo "- Stage only: ${{ inputs.stage_only }}"
          } >> "$GITHUB_STEP_SUMMARY"

  health:
    if: ${{ always() && inputs.diagnostic_only != true && needs.validate.result == 'success' && needs.deploy.result == 'success' }}
    needs: [validate, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate deployment outputs
        env:
          DEPLOYMENT_URL: ${{ needs.deploy.outputs.deployment_url }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOYMENT_URL"
          test -n "$DEPLOYMENT_ID"
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$DEPLOYMENT_URL" =~ ^https://sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app/?$ ]]
          echo 'DEPLOYMENT_OUTPUTS=VALID'
      - name: Verify deployment and canonical health
        env:
          CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
        run: node scripts/ci/verify-health.js
      - name: Report manual acceptance status
        run: |
          {
            echo '### Post-deploy gate'
            echo '- Root/health/readiness: verified by health script'
            echo '- Stage only: ${{ inputs.stage_only }}'
            echo '- Rollback/current canonical checkpoint: ${{ inputs.rollback_deployment_id }}'
            echo '- Authenticated ADMIN/MANAGER smoke: pending dedicated non-human account'
            echo '- Automatic rollback: disabled; use rollback-production.yml after approval'
          } >> "$GITHUB_STEP_SUMMARY"
