name: Migrate Approved Preview Database (Registration Shim)

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact application commit SHA on the authoritative release branch
        required: true
        type: string
      source_tree:
        description: Exact application tree SHA for source_sha
        required: true
        type: string
      expected_migration_head:
        description: Expected Prisma migration head
        required: true
        default: 202609010002_mdg_master_codes_department_site_authority
        type: string

permissions:
  contents: read

jobs:
  registration-only:
    name: REGISTRATION_ONLY (no database access)
    runs-on: ubuntu-24.04
    steps:
      - name: Prove harmless default-branch registration
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "main"
          echo 'WORKFLOW_REGISTRATION_ONLY=PASS'
          echo 'DATABASE_ACCESSED=NO'
          echo 'MIGRATION_EXECUTED=NO'
          echo 'ENVIRONMENT_ATTACHED=NO'
          echo 'SECRETS_REFERENCED=NO'
          echo 'DEPLOYMENT_PERFORMED=NO'
