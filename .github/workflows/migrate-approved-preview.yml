name: Migrate Approved Preview Database

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact application commit SHA on the authoritative Preview branch
        required: true
        type: string
      source_tree:
        description: Exact application tree SHA for source_sha
        required: true
        type: string
      expected_migration_head:
        description: Expected Prisma migration head
        required: true
        default: 202609280002_g06_gps_only_uat_event_provenance_constraint
        type: string
      confirmation:
        description: Type MIGRATE_G06_GPS_ONLY_UAT_PREVIEW
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sms-v3-staging-preview-migration
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_BRANCH: preview/enterprise-evolution-20260927
  EXPECTED_SUPERVISOR_MIGRATION: 202609240001_add_supervisor_user_role
  EXPECTED_ROSTER_MIGRATION: 202609250001_add_schedule_roster_order
  EXPECTED_ENUM_MIGRATION: 202609280001_g06_gps_only_uat_event_provenance
  EXPECTED_MIGRATION_HEAD: 202609280002_g06_gps_only_uat_event_provenance_constraint
  REQUIRED_CONFIRMATION: MIGRATE_G06_GPS_ONLY_UAT_PREVIEW

jobs:
  migrate:
    name: Migrate approved isolated Preview database
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: 'Preview – sms-v3-staging'
    env:
      NODE_ENV: production
      VERCEL_ENV: preview
      RUN_MIGRATIONS: 'true'
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT }}
      APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      REQUESTED_MIGRATION_HEAD: ${{ inputs.expected_migration_head }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Require exact manual Preview authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "$EXPECTED_SOURCE_BRANCH"
          test "$GITHUB_SHA" = "$SOURCE_SHA"
          test "$REQUESTED_MIGRATION_HEAD" = "$EXPECTED_MIGRATION_HEAD"
          test "$CONFIRMATION" = "$REQUIRED_CONFIRMATION"
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s\n' "$SOURCE_TREE" | grep -Eq '^[0-9a-fA-F]{40}$'
          echo 'DISPATCH_AUTHORITY=PASS'

      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact source identity and approved Preview migration set
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git fetch --no-tags origin "$EXPECTED_SOURCE_BRANCH"
          test "$(git rev-parse "origin/$EXPECTED_SOURCE_BRANCH")" = "$SOURCE_SHA"
          test -f "prisma/migrations/$EXPECTED_SUPERVISOR_MIGRATION/migration.sql"
          test -f "prisma/migrations/$EXPECTED_ROSTER_MIGRATION/migration.sql"
          test -f "prisma/migrations/$EXPECTED_ENUM_MIGRATION/migration.sql"
          test -f "prisma/migrations/$EXPECTED_MIGRATION_HEAD/migration.sql"
          test -z "$(git status --porcelain)"
          echo 'SOURCE_IDENTITY=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies and generate Prisma client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npx prisma generate
          echo 'PRISMA_TOOLING=PASS'

      - name: Verify protected Preview secrets and target guards exist
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          test -n "${DIRECT_URL:-}"
          test -n "${APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT:-}"
          test -n "${APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT:-}"
          echo 'PREVIEW_SECRET_GATE=PASS'

      - name: Prove isolated Preview database target without exposing secrets
        shell: bash
        run: node scripts/ci/verify-preview-migration-target.js

      - name: Require exactly the approved Preview migration set pending before mutation
        shell: bash
        run: |
          set -euo pipefail
          status_output=$(mktemp)
          trap 'rm -f "$status_output"' EXIT
          node scripts/ci/prisma-migration.js status --allow-pending >"$status_output"
          echo 'PREVIEW_MIGRATION_STATUS_DIAGNOSTICS_BEGIN'
          cat "$status_output"
          echo 'PREVIEW_MIGRATION_STATUS_DIAGNOSTICS_END'
          grep -Fxq 'MIGRATION_STATUS_CLASS=PENDING_MIGRATIONS_ONLY' "$status_output"
          grep -Fxq 'MIGRATION_HISTORY_MISMATCH=false' "$status_output"
          grep -Fxq 'SCHEMA_MISMATCH=false' "$status_output"
          grep -Fxq 'PENDING_MIGRATIONS=true' "$status_output"
          grep -Fxq "MIGRATION_NAME=$EXPECTED_SUPERVISOR_MIGRATION,$EXPECTED_ROSTER_MIGRATION,$EXPECTED_ENUM_MIGRATION,$EXPECTED_MIGRATION_HEAD" "$status_output"
          echo 'PREVIEW_PENDING_SET=EXACT_APPROVED_FOUR_MIGRATIONS'

      - name: Apply repository-governed Preview migrations
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prisma-migration.js deploy
          echo 'PREVIEW_MIGRATION_EXECUTION=PASS'

      - name: Verify current migration state and G06 provenance invariants
        shell: bash
        run: |
          set -euo pipefail
          status_output=$(mktemp)
          trap 'rm -f "$status_output"' EXIT
          node scripts/ci/prisma-migration.js status >"$status_output"
          grep -Fxq 'MIGRATION_STATUS_CLASS=UP_TO_DATE' "$status_output"
          grep -Fxq 'PENDING_MIGRATIONS=false' "$status_output"
          node scripts/ci/verify-g06-gps-uat-preview-migration.js

      - name: Publish safe Preview migration summary
        shell: bash
        run: |
          {
            echo '### G06 GPS-only UAT Preview migration'
            echo '- Target: isolated sms-v3 Preview database (fingerprint-guarded)'
            echo '- Source identity: PASS'
            echo '- Pending set: exact Supervisor + roster-order prerequisites + G06 enum + provenance constraint'
            echo '- Prisma migration state: CURRENT'
            echo '- ONLINE requires Face session: enforced by DB constraint'
            echo '- GPS_ONLY_UAT requires null Face session: enforced by DB constraint'
            echo '- Production database accessed: NO'
            echo '- Production changed: NO'
            echo '- Seed or additional data mutation: NOT PERFORMED'
            echo '- Raw secrets emitted: NO'
          } >> "$GITHUB_STEP_SUMMARY"