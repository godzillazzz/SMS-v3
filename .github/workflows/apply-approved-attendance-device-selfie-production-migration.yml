name: Apply Approved Attendance Device Selfie Production Migration

on:
  workflow_dispatch:
  push:
    branches:
      - fix/serverless-database-reliability
    paths:
      - .github/workflows/apply-approved-attendance-device-selfie-production-migration.yml
      - .github/releases/approved-attendance-device-selfie-migration.json
      - .github/releases/approved-attendance-multilevel-production-migration.json

permissions:
  contents: read
  actions: read

concurrency:
  group: sms-v3-staging-production-migration-device2-selfie
  cancel-in-progress: false

env:
  MANIFEST_PATH: .github/releases/approved-attendance-device-selfie-migration.json
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_PROJECT_NAME: sms-v3-staging
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_MIGRATION_PATH: prisma/migrations/202610190001_attendance_device_selfie/migration.sql

jobs:
  prepare:
    name: Prepare exact approved DEVICE2-SELFIE migration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.manifest.outputs.source_sha }}
      source_tree: ${{ steps.manifest.outputs.source_tree }}
      migration_path: ${{ steps.manifest.outputs.migration_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate approved migration manifest and exact source identity
        id: manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node - "$MANIFEST_PATH" <<'NODE'
          const fs = require('node:fs');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const required = {
            schema_version: 1,
            migration_id: 'DEVICE2-SELFIE',
            manifest_state: 'APPROVED_FOR_OWNER_PRODUCTION_MIGRATION_DECISION',
            target_environment: 'production',
            target_project_name: 'sms-v3-staging',
            target_project_id: 'prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s',
            canonical_url: 'https://sms-v3-staging-ten.vercel.app',
            owner_action: 'APPROVE_PRODUCTION_MIGRATION_ONLY',
            application_deploy: false,
            destructive_rollback: false,
            additive_only: true,
            data_mutation: false,
            legacy_status_retained: true
          };
          for (const [key, value] of Object.entries(required)) {
            if (manifest[key] !== value) throw new Error(`Manifest mismatch: ${key}`);
          }
          for (const key of ['source_commit_sha', 'source_tree_sha']) {
            if (!/^[0-9a-f]{40}$/.test(manifest[key])) throw new Error(`Invalid ${key}`);
          }
          if (manifest.migration_path !== 'prisma/migrations/202610190001_attendance_device_selfie/migration.sql') {
            throw new Error('Unexpected ATT-CHAIN-ML migration path');
          }
          NODE
          SOURCE_SHA=$(node -p "require('./$MANIFEST_PATH').source_commit_sha")
          SOURCE_TREE=$(node -p "require('./$MANIFEST_PATH').source_tree_sha")
          MIGRATION_PATH=$(node -p "require('./$MANIFEST_PATH').migration_path")
          git fetch --no-tags origin fix/serverless-database-reliability
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$SOURCE_SHA" origin/fix/serverless-database-reliability
          test "$(git rev-parse "${SOURCE_SHA}^{tree}")" = "$SOURCE_TREE"
          git show "${SOURCE_SHA}:${MIGRATION_PATH}" >/tmp/att-chain-ml-migration.sql
          test -s /tmp/att-chain-ml-migration.sql
          # Constraint-only widening: no row data may be touched.
          ! grep -Eiq 'INSERT[[:space:]]+INTO|DELETE[[:space:]]+FROM|TRUNCATE|UPDATE[[:space:]]+"|DROP[[:space:]]+(TABLE|COLUMN|INDEX)|ALTER[[:space:]]+COLUMN' /tmp/att-chain-ml-migration.sql
          test "$(grep -Ec 'CREATE TABLE "attendance_device_selfies"' /tmp/att-chain-ml-migration.sql)" -eq 1
          test "$(grep -Ec 'CREATE (UNIQUE )?INDEX "attendance_device_selfies' /tmp/att-chain-ml-migration.sql)" -eq 4
          test "$(grep -Ec 'ADD CONSTRAINT "attendance_device_selfies_[a-z_]+_fkey"' /tmp/att-chain-ml-migration.sql)" -eq 2
          ! grep -Eiq 'INSERT[[:space:]]+INTO|DELETE[[:space:]]+FROM|TRUNCATE|UPDATE[[:space:]]+"|DROP[[:space:]]+(TABLE|COLUMN|INDEX)|ALTER[[:space:]]+COLUMN' /tmp/att-chain-ml-migration.sql
          CI_SUCCESS=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow CI --commit "$SOURCE_SHA" --limit 10 --json status,conclusion --jq '[.[] | select(.status=="completed" and .conclusion=="success")] | length')
          test "$CI_SUCCESS" -ge 1
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "source_tree=$SOURCE_TREE" >> "$GITHUB_OUTPUT"
          echo "migration_path=$MIGRATION_PATH" >> "$GITHUB_OUTPUT"
          {
            echo '### DEVICE2-SELFIE migration prepared'
            echo "- Exact source SHA: $SOURCE_SHA"
            echo "- Exact tree SHA: $SOURCE_TREE"
            echo "- Migration: $MIGRATION_PATH"
            echo '- Scope: one new table (attendance_device_selfies) with indexes and foreign keys only'
            echo '- Application deployment: disabled'
            echo '- Destructive rollback: disabled'
          } >> "$GITHUB_STEP_SUMMARY"

  migrate:
    name: Approve Production Migration
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      NODE_ENV: production
      VERCEL_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Revalidate exact migration source after Owner approval
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ needs.prepare.outputs.source_sha }}"
          test "$(git rev-parse HEAD^{tree})" = "${{ needs.prepare.outputs.source_tree }}"
          test -z "$(git status --porcelain)"
      - run: npm ci
      - run: npx prisma generate
      - name: Verify Production database target guard
        run: node scripts/ci/verify-deployment-target.js --verify
      - name: Verify migration is constraint-only before execution
        shell: bash
        run: |
          set -euo pipefail
          MIGRATION_PATH="${{ needs.prepare.outputs.migration_path }}"
          ! grep -Eiq 'INSERT[[:space:]]+INTO|DELETE[[:space:]]+FROM|TRUNCATE|DROP[[:space:]]+(TABLE|COLUMN|INDEX)|ALTER[[:space:]]+COLUMN' "$MIGRATION_PATH"
          test "$(grep -Ec 'CREATE TABLE "attendance_device_selfies"' "$MIGRATION_PATH")" -eq 1
          node scripts/ci/prisma-migration.js status --allow-pending
      - name: Apply approved DEVICE2-SELFIE migration only
        run: node scripts/ci/prisma-migration.js deploy
      - name: Verify migration status and live constraints
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prisma-migration.js status
          # Verify the script that actually runs matches the reviewed commit exactly.
          git fetch --no-tags origin "$GITHUB_SHA"
          # Run it inside the worktree so @prisma/client resolves from the installed node_modules.
          git show "$GITHUB_SHA:scripts/ci/verify-attendance-device-selfie-table.js" > ./verify-attendance-device-selfie-table.runtime.js
          node ./verify-attendance-device-selfie-table.runtime.js
      - name: Verify canonical application remains healthy
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl --fail --silent --show-error "$EXPECTED_CANONICAL_URL/api/v1/health")
          ready=$(curl --fail --silent --show-error "$EXPECTED_CANONICAL_URL/api/v1/ready")
          node - "$health" "$ready" <<'NODE'
          const health = JSON.parse(process.argv[2]);
          const ready = JSON.parse(process.argv[3]);
          if (health.status !== 'ok') throw new Error('Canonical health failed');
          if (ready.status !== 'ready' || ready.database !== 'ok') throw new Error('Canonical readiness failed');
          NODE
      - name: Migration summary
        run: |
          {
            echo '### DEVICE2-SELFIE Production migration'
            echo '- Migration status: PASS'
            echo '- attendance_device_selfies table + indexes + FKs: VERIFIED'
            echo '- No data mutation performed: VERIFIED'
            echo '- Canonical application health/readiness: PASS'
            echo '- Application deployment performed: NO'
            echo '- Destructive rollback performed: NO'
          } >> "$GITHUB_STEP_SUMMARY"
