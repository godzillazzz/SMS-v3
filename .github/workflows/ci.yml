name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only_password
          POSTGRES_DB: sms_v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d sms_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: echo "DATABASE_URL=postgresql://ci_user:ci_test_only_password@localhost:5432/sms_v3_test?schema=public" >> $GITHUB_ENV
      - run: echo "JWT_SECRET=ci-test-only-secret-at-least-thirty-two-characters" >> $GITHUB_ENV
      - run: echo "NODE_ENV=test" >> $GITHUB_ENV
      - run: npm run prisma:format:check
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run db:test:migrate
      - run: npm test
      - run: RUN_INTEGRATION_TESTS=true npm run test:integration
      - run: npm run audit:dependencies
