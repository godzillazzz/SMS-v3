name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - preview/enterprise-evolution-20260927
      - fix/serverless-database-reliability
      - fix/sms-v1-2-1-visual-consistency-inactive-darkmode
      - fix/g05-license-document-delete-audit-tombstone
      - fix/email-01-production-backport-v1
      - fix/production-mobile-responsive-v1
      - fix/production-leave-p2028-transaction-reliability-v1
      - fix/minio-complete-integration
      - feature/approval-workflow-standard-v1
      - feature/g06-department-security-site-v1
      - feature/q11-production-assurance-dependency-hardening
      - feature/q12a-data-scale-export-correctness
      - feature/q12b-performance-code-splitting
      - feature/q12c-native-dialog-replacement
      - feature/q12d-node22-build-repro
  pull_request:
    branches: [main, fix/serverless-database-reliability]

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  t22-schedule-benchmark:
    name: t22-schedule-benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: sms_v3_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d sms_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:5432/sms_v3_test?schema=public
      DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:5432/sms_v3_test?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - name: Run T22 schedule benchmark
        run: node scripts/perf/t22-schedule-bench.js
      - name: Upload T22 benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t22-schedule-benchmark
          path: t22-schedule-benchmark-result.json
          if-no-files-found: error

  minio-real-integration:
    name: minio-real-integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MINIO_ROOT_USER: ci-minio-root
      MINIO_ROOT_PASSWORD: ci-minio-root-password-2026
      MINIO_CI_ACCESS_KEY: ci-minio-restricted
      MINIO_CI_SECRET_KEY: ci-minio-restricted-secret-2026
      MINIO_BUCKET: sms-v3-ci-private
      MINIO_ENDPOINT: http://127.0.0.1:9000
      MINIO_COMPOSE_FILE: deploy/minio/docker-compose.yml
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start pinned disposable MinIO
        run: |
          set -euo pipefail
          docker compose -f "$MINIO_COMPOSE_FILE" up -d
          for attempt in $(seq 1 30); do
            if curl --fail --silent "$MINIO_ENDPOINT/minio/health/ready" >/dev/null; then break; fi
            if [ "$attempt" = 30 ]; then docker compose -f "$MINIO_COMPOSE_FILE" logs --no-color minio; exit 1; fi
            sleep 2
          done
      - name: Configure private bucket and restricted credentials
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/mc https://github.com/minio/mc/releases/download/RELEASE.2025-08-13T08-35-41Z/mc.linux-amd64.RELEASE.2025-08-13T08-35-41Z
          chmod +x /tmp/mc
          /tmp/mc alias set local http://127.0.0.1:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
          /tmp/mc mb --ignore-existing "local/$MINIO_BUCKET"
          printf '%s\n' '{"Version":"2012-10-17","Statement":[{"Action":["s3:GetBucketLocation","s3:ListBucket","s3:PutObject","s3:GetObject","s3:DeleteObject"],"Effect":"Allow","Resource":["arn:aws:s3:::'"$MINIO_BUCKET"'","arn:aws:s3:::'"$MINIO_BUCKET"'/*"]}]}' > /tmp/sms-v3-ci-policy.json
          /tmp/mc admin policy create local sms-v3-ci-policy /tmp/sms-v3-ci-policy.json || true
          /tmp/mc admin user add local "$MINIO_CI_ACCESS_KEY" "$MINIO_CI_SECRET_KEY" || true
          /tmp/mc admin policy attach local sms-v3-ci-policy --user "$MINIO_CI_ACCESS_KEY"
          /tmp/mc anonymous set none "local/$MINIO_BUCKET"
          /tmp/mc anonymous get "local/$MINIO_BUCKET"
          rm -f /tmp/mc /tmp/sms-v3-ci-policy.json
      - run: npm ci
      - name: Run real MinIO storage integration
        env:
          S3_ENDPOINT: ${{ env.MINIO_ENDPOINT }}
          S3_REGION: us-east-1
          S3_ACCESS_KEY_ID: ${{ env.MINIO_CI_ACCESS_KEY }}
          S3_SECRET_ACCESS_KEY: ${{ env.MINIO_CI_SECRET_KEY }}
          S3_ALLOWED_BUCKETS: ${{ env.MINIO_BUCKET }}
          ATTENDANCE_DEVICE_SELFIE_BUCKET: ${{ env.MINIO_BUCKET }}
          ATTENDANCE_FACE_EVIDENCE_BUCKET: ${{ env.MINIO_BUCKET }}
          EMPLOYEE_REFERENCE_PHOTOS_BUCKET: ${{ env.MINIO_BUCKET }}
          LICENSE_DOCUMENTS_BUCKET: ${{ env.MINIO_BUCKET }}
          MINIO_COMPOSE_FILE: ${{ env.MINIO_COMPOSE_FILE }}
          MINIO_BUCKET: ${{ env.MINIO_BUCKET }}
          MINIO_RESTRICTED_ACCESS_KEY: ${{ env.MINIO_CI_ACCESS_KEY }}
          MINIO_RESTRICTED_SECRET_KEY: ${{ env.MINIO_CI_SECRET_KEY }}
          RUN_REAL_MINIO: 'true'
        run: node --test --test-concurrency=1 test/integration/minio-object-storage.integration.test.js
      - name: Capture MinIO service evidence
        if: always()
        run: |
          docker compose -f "$MINIO_COMPOSE_FILE" ps
          docker compose -f "$MINIO_COMPOSE_FILE" logs --no-color minio
      - name: Stop disposable MinIO
        if: always()
        run: docker compose -f "$MINIO_COMPOSE_FILE" down -v

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: sms_v3_test
        ports:
          - 5432:5432
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d sms_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      RUN_INTEGRATION_TESTS: "true"
      DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:5432/sms_v3_test?schema=public
      DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:5432/sms_v3_test?schema=public
      TEST_DATABASE_RUNNER: docker-container-network
      JWT_SECRET: ci-test-secret-at-least-thirty-two-characters
      DISABLE_EMAIL_NOTIFICATIONS: "true"
      OTP_DELIVERY_PROVIDER: disabled
      ALERTING_ENABLED: "false"
      RATE_LIMIT_STORE: memory
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SEED_ADMIN_PASSWORD: ci-seed-password-only-for-ephemeral-db
    steps:
      - uses: actions/checkout@v4
        with:
          # Release-control tests verify the committed post-release history, the archived dispatch
          # manifests and the Prisma baseline ancestry against real Git objects; a shallow checkout
          # would make those verifications unprovable.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Linux sharp install excludes musl and loads pinned runtime
        run: node scripts/ci/verify-linux-artifact.js node_modules --require-sharp-load
      - run: npm --prefix frontend ci
      - name: Install the existing Playwright Chromium browser for local print fixtures
        run: npx playwright install --with-deps chromium
      - name: Run R7.1 browser acceptance evidence
        run: npx playwright test frontend/e2e/r71-validation/r71-browser-acceptance.pw.ts --config frontend/playwright.print.config.ts --workers=1 --reporter=line
      - name: Run approval badge desktop and mobile browser acceptance
        run: npx playwright test frontend/e2e/approvals/approval-badges.pw.ts --config frontend/playwright.print.config.ts --workers=1 --reporter=line
      - name: Run T29 print and T09 application-routing browser regressions
        run: npx playwright test --config frontend/playwright.print.config.ts --workers=1
      - name: Upload print and application-routing browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-regression-artifacts
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/*.pdf
            frontend/playwright-report/print/
          if-no-files-found: ignore
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high
      - name: Verify environment governance contract definition
        run: node scripts/ci/verify-environment-contract.js --contract-only
      - run: npm run prisma:format:check
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run db:test:migrate
      - run: npm run db:seed
      - run: node scripts/ci/prisma-migration.js status
      - run: npm test
      - run: npm run test:integration
      - name: Run authoritative Attendance event integration
        env:
          TEST_DATABASE_RUNNER: g06-attendance-event-disposable-local
          DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
          DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
        run: node --test --test-concurrency=1 test/integration/attendance-event-workflow.integration.test.js
      - name: Run support-Site Attendance PostgreSQL integration
        env:
          TEST_DATABASE_RUNNER: g06-attendance-event-disposable-local
          DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
          DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
        run: node --test --test-concurrency=1 test/integration/attendance-support-site.integration.test.js
      - name: Run foreign-device selfie PostgreSQL concurrency integration
        env:
          TEST_DATABASE_RUNNER: g06-attendance-event-disposable-local
          DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
          DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
        run: node --test --test-concurrency=1 test/integration/attendance-foreign-selfie-concurrency.integration.test.js
      - name: Run attendance selfie policy migration direct re-run integration
        env:
          RUN_INTEGRATION_TESTS: 'true'
          TEST_DATABASE_RUNNER: g06-attendance-event-disposable-local
          DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
          DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
        run: node --test --test-concurrency=1 test/integration/attendance-selfie-policy-migration.integration.test.js
      - name: Verify physical acceptance SQL and PostgreSQL read-only enforcement
        env:
          RUN_INTEGRATION_TESTS: 'true'
          TEST_DATABASE_RUNNER: g06-physical-readonly-disposable-ci
          DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
          DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
        run: node --test test/integration/g06-physical-event-readonly.integration.test.js
      - run: npm --prefix frontend test
      - run: npx tsc --noEmit
        working-directory: frontend
      - name: Build frontend production bundle
        env:
          NODE_ENV: production
        run: npm --prefix frontend run build
      - name: Verify frontend production bundle
        run: node scripts/ci/verify-frontend-production-bundle.js
      - name: Restore tracked frontend build metadata
        shell: bash
        run: git restore -- frontend/tsconfig.tsbuildinfo
      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          secret_patterns='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|ver''cel_[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----'
          if git grep -n -I -E "$secret_patterns" -- ':!test/**' ':!docs/**' ':!**/*.example' >/dev/null; then
            echo 'Secret-pattern scan failed'
            exit 1
          fi
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Verify integration PR Preview health, readiness, and CORS
        if: github.event_name == 'pull_request' && github.base_ref == 'fix/serverless-database-reliability'
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          node scripts/ci/verify-integration-pr-preview.js
