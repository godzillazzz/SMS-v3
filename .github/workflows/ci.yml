name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - preview/enterprise-evolution-20260927
      - fix/serverless-database-reliability
      - fix/sms-v1-2-1-visual-consistency-inactive-darkmode
      - fix/g05-license-document-delete-audit-tombstone
      - fix/email-01-production-backport-v1
      - fix/production-mobile-responsive-v1
      - fix/production-leave-p2028-transaction-reliability-v1
      - feature/approval-workflow-standard-v1
      - feature/g06-department-security-site-v1
      - feature/q11-production-assurance-dependency-hardening
      - feature/q12a-data-scale-export-correctness
      - feature/q12b-performance-code-splitting
      - feature/q12c-native-dialog-replacement
      - feature/q12d-node22-build-repro
  pull_request:
    branches: [main, fix/serverless-database-reliability]

permissions:
  contents: read
  deployments: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_test_only
          POSTGRES_DB: sms_v3_test
        ports:
          - 5432:5432
          - 55438:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d sms_v3_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      NODE_ENV: test
      RUN_INTEGRATION_TESTS: "true"
      DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:5432/sms_v3_test?schema=public
      DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:5432/sms_v3_test?schema=public
      TEST_DATABASE_RUNNER: docker-container-network
      JWT_SECRET: ci-test-secret-at-least-thirty-two-characters
      DISABLE_EMAIL_NOTIFICATIONS: "true"
      OTP_DELIVERY_PROVIDER: disabled
      ALERTING_ENABLED: "false"
      RATE_LIMIT_STORE: memory
      SEED_ADMIN_EMAIL: ci-admin@example.test
      SEED_ADMIN_PASSWORD: ci-seed-password-only-for-ephemeral-db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Linux sharp install excludes musl and loads pinned runtime
        run: node scripts/ci/verify-linux-artifact.js node_modules --require-sharp-load
      - run: npm --prefix frontend ci
      - name: Install the existing Playwright Chromium browser for local print fixtures
        run: npx playwright install --with-deps chromium
      - name: Run T29 print and T09 application-routing browser regressions
        run: npx playwright test --config frontend/playwright.print.config.ts
      - name: Upload print and application-routing browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-regression-artifacts
          path: |
            frontend/test-results/**/*.png
            frontend/test-results/**/*.pdf
            frontend/playwright-report/print/
          if-no-files-found: ignore
      - name: Audit backend dependencies
        run: npm audit --audit-level=high
      - name: Audit frontend dependencies
        run: npm --prefix frontend audit --audit-level=high
      - name: Verify environment governance contract definition
        run: node scripts/ci/verify-environment-contract.js --contract-only
      - run: npm run prisma:format:check
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run db:test:migrate
      - run: npm run db:seed
      - run: node scripts/ci/prisma-migration.js status
      - run: npm test
      - run: npm run test:integration
      - name: Run authoritative Attendance event integration
        env:
          TEST_DATABASE_RUNNER: g06-attendance-event-disposable-local
          DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
          DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
        run: node --test --test-concurrency=1 test/integration/attendance-event-workflow.integration.test.js
      - name: Run support-Site Attendance PostgreSQL integration
        env:
          TEST_DATABASE_RUNNER: g06-attendance-event-disposable-local
          DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
          DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
        run: node --test --test-concurrency=1 test/integration/attendance-support-site.integration.test.js
      - name: Verify physical acceptance SQL and PostgreSQL read-only enforcement
        env:
          RUN_INTEGRATION_TESTS: 'true'
          TEST_DATABASE_RUNNER: g06-physical-readonly-disposable-ci
          DATABASE_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
          DIRECT_URL: postgresql://ci_user:ci_test_only@127.0.0.1:55438/sms_v3_test?schema=public
        run: node --test test/integration/g06-physical-event-readonly.integration.test.js
      - run: npm --prefix frontend test
      - run: npx tsc --noEmit
        working-directory: frontend
      - name: Build frontend production bundle
        env:
          NODE_ENV: production
        run: npm --prefix frontend run build
      - name: Verify frontend production bundle
        run: node scripts/ci/verify-frontend-production-bundle.js
      - name: Restore tracked frontend build metadata
        shell: bash
        run: git restore -- frontend/tsconfig.tsbuildinfo
      - name: Verify repository hygiene
        shell: bash
        run: |
          set -euo pipefail
          secret_patterns='ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|ver''cel_[A-Za-z0-9]{20,}|-----BEGIN (RSA|OPENSSH|EC|PRIVATE) KEY-----'
          if git grep -n -I -E "$secret_patterns" -- ':!test/**' ':!docs/**' ':!**/*.example' >/dev/null; then
            echo 'Secret-pattern scan failed'
            exit 1
          fi
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Verify integration PR Preview health, readiness, and CORS
        if: github.event_name == 'pull_request' && github.base_ref == 'fix/serverless-database-reliability'
        shell: bash
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EXPECTED_PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          node scripts/ci/verify-integration-pr-preview.js
