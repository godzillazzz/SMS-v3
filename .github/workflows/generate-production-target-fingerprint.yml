name: g03-1-post-technical-readonly-preservation-v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-v3-staging-production
  cancel-in-progress: false

env:
  EXPECTED_CANDIDATE_SHA: 0951d4ce08de817dda7b986924232e86e745b532
  EXPECTED_CANONICAL_DEPLOYMENT: dpl_rK4D47D2HaJ2ur4cLV1YfWtnu2eL
  EXPECTED_CANONICAL_SHA: 1701bcf90a1998ea4999ee02e687172295984c9a
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  readonly-preservation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: production-sms-v3-staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout fixed preservation harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preserve fixed read-only snapshot helper
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/g03-1-staged-technical-snapshot.js /tmp/g03-1-staged-technical-snapshot.js
          test -s /tmp/g03-1-staged-technical-snapshot.js

      - name: Checkout exact Candidate for schema/client identity
        uses: actions/checkout@v4
        with:
          ref: 0951d4ce08de817dda7b986924232e86e745b532
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies without lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts
          npx --no-install prisma generate

      - name: Verify protected Production database target
        run: node scripts/ci/verify-deployment-target.js --verify

      - name: Post-Technical read-only Production snapshot
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/g03-1-staged-technical-snapshot.js | tee /tmp/g03-1-post-tech-snapshot.log
          node - /tmp/g03-1-post-tech-snapshot.log <<'NODE'
          const fs=require('node:fs');
          const line=fs.readFileSync(process.argv[2],'utf8').split(/\r?\n/).find(v=>v.startsWith('STAGED_TECH_SNAPSHOT='));
          if(!line) throw new Error('POST_TECH_SNAPSHOT_MISSING');
          const d=JSON.parse(line.slice('STAGED_TECH_SNAPSHOT='.length));
          if(d.readOnly.transactionReadOnly!=='on'||d.readOnly.transactionIdAssigned!==null) throw new Error('POST_TECH_NOT_READ_ONLY');
          if(!d.schema.quotaYearExists||!d.schema.quotaYearNullable||!d.schema.uniqueInvariantPresent||!d.schema.quotaYearIndexPresent) throw new Error('POST_TECH_SCHEMA_INVALID');
          if(d.schema.migrationCount!==17||d.schema.pendingMigrations.length!==0||!d.schema.authorizedMigrationApplied) throw new Error('POST_TECH_MIGRATION_INVALID');
          if(d.activation.effective!=='INACTIVE') throw new Error('G03_1_TECHNICAL_ACTIVATION_CHANGED');
          if(d.counts.quotaYearOtherRows!==0) throw new Error('POST_TECH_SECOND_YEAR_AUTHORITY_CREATED');
          if(d.authority.employeesWithMultipleLinkedRows!==0||d.authority.maximumLinkedRowsPerEmployee>1) throw new Error('POST_TECH_MULTI_AUTHORITY_INVALID');
          if(d.authority.unclassifiedAuthorities!==0) throw new Error('POST_TECH_LINKED_AUTHORITY_UNCLASSIFIED');
          console.log('POST_TECH_SNAPSHOT_GATE=PASS');
          NODE

      - name: Verify old G03 Canonical still unchanged
        shell: bash
        run: |
          set -euo pipefail
          canonical_json=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" >"$canonical_json" 2>/dev/null
          node - "$canonical_json" <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(d.id!==process.env.EXPECTED_CANONICAL_DEPLOYMENT) throw new Error('CANONICAL_DEPLOYMENT_CHANGED');
          const sha=d?.meta?.gitCommitSha||d?.meta?.githubCommitSha||d?.gitSource?.sha||d?.source?.sha;
          if(sha!==process.env.EXPECTED_CANONICAL_SHA) throw new Error('CANONICAL_SHA_CHANGED');
          if(d.readyState!=='READY'||d.target!=='production') throw new Error('CANONICAL_STATE_CHANGED');
          console.log('POST_TECH_CANONICAL=UNCHANGED');
          NODE
