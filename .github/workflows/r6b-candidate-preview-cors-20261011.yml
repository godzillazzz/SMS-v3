name: R6-B Candidate Preview CORS (Read Only)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: sms-v3-r6b-candidate-preview-cors
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'godzillazzz/SMS-v3' &&
      github.ref == 'refs/heads/main' &&
      github.event.issue.number == 611 &&
      github.event.issue.pull_request != null &&
      github.event.sender.login == 'godzillazzz' &&
      github.event.comment.user.login == 'godzillazzz' &&
      github.event.comment.body == '/sms-v3-r6b-preview-cors-20261011'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
      deployments: read
      issues: read
      pull-requests: read
    outputs:
      plan: \${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: \${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Validate trusted main, draft candidate, exact CI and Hosted UAT policy
        id: plan
        env:
          GH_TOKEN: \${{ github.token }}
        run: node scripts/ci/r6b-candidate-preview-cors.cjs prepare

  protected-preview:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: Hosted UAT
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: \${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Verify exact Candidate Preview, health, readiness, CORS and unchanged canonicals
        env:
          GH_TOKEN: \${{ github.token }}
          R6B_CORS_PLAN: \${{ needs.prepare.outputs.plan }}
          VERCEL_TOKEN: \${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: \${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: node scripts/ci/r6b-candidate-preview-cors.cjs verify
