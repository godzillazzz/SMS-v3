name: Apply Reconciled G06 Preview Attendance Migrations

on:
  workflow_dispatch:
    inputs:
      source_pr_number:
        description: Open Draft PR #417
        required: true
        type: string
      source_sha:
        description: Exact PR #417 head SHA
        required: true
        type: string
      source_tree:
        description: Exact PR #417 source tree SHA
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: read

concurrency:
  group: sms-v3-staging-preview-g06-reconciled-migration
  cancel-in-progress: false

env:
  EXPECTED_RELEASE_BRANCH: fix/serverless-database-reliability
  EXPECTED_RELEASE_SHA: 9fc77d0490f6a49f8d637879f6395237ac34247a
  EXPECTED_RELEASE_TREE: 0cf1a6806625a28633b2697d5b6068df509a1a79
  EXPECTED_PR_NUMBER: '417'
  EXPECTED_PR_BRANCH: codex/g06-time-policy-20261002
  PREVIEW_ORIGIN: https://sms-v3-staging-git-codex-g06-time-policy-20261002-godzillazz.vercel.app

jobs:
  migrate:
    name: Reconcile and apply only Preview G06 migrations 001 then 002
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment:
      name: 'Preview – sms-v3-staging'
    env:
      NODE_ENV: production
      VERCEL_ENV: preview
      APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT }}
      APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
      SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}

    steps:
      - name: Require manual dispatch on main with exact source inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_REF_NAME" = "main"
          test "$SOURCE_PR_NUMBER" = "$EXPECTED_PR_NUMBER"
          printf '%s' "$SOURCE_SHA" | grep -Eq '^[0-9a-f]{40}$'
          printf '%s' "$SOURCE_TREE" | grep -Eq '^[0-9a-f]{40}$'
          echo 'DISPATCH_AUTHORITY=PASS'

      - name: Checkout immutable workflow source and candidate history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify PR #417, exact-head CI and Preview, and release checkpoint
        uses: actions/github-script@v7
        env:
          SOURCE_PR_NUMBER: ${{ inputs.source_pr_number }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const expected = process.env;
            const number = Number(expected.SOURCE_PR_NUMBER);
            if (number !== 417) throw new Error('Unexpected source PR');
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            if (pr.state !== 'open' || pr.draft !== true) throw new Error('PR #417 must remain open and Draft');
            if (pr.base.ref !== 'fix/serverless-database-reliability' || pr.base.sha !== process.env.EXPECTED_RELEASE_SHA) throw new Error('PR #417 base checkpoint mismatch');
            if (pr.head.ref !== 'codex/g06-time-policy-20261002' || pr.head.repo?.full_name !== owner + '/' + repo) throw new Error('PR #417 head identity mismatch');
            if (pr.head.sha !== expected.SOURCE_SHA) throw new Error('PR #417 head SHA changed');
            const { data: appCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: pr.head.sha });
            if (appCommit.tree.sha !== expected.SOURCE_TREE) throw new Error('PR #417 tree changed');
            const { data: releaseRef } = await github.rest.git.getRef({ owner, repo, ref: 'heads/fix/serverless-database-reliability' });
            if (releaseRef.object.sha !== process.env.EXPECTED_RELEASE_SHA) throw new Error('Release branch checkpoint changed');
            const { data: releaseCommit } = await github.rest.git.getCommit({ owner, repo, commit_sha: releaseRef.object.sha });
            if (releaseCommit.tree.sha !== process.env.EXPECTED_RELEASE_TREE) throw new Error('Release branch tree changed');
            const { data: workflows } = await github.rest.actions.listRepoWorkflows({ owner, repo, per_page: 100 });
            const ci = workflows.workflows.find((item) => item.path === '.github/workflows/ci.yml' && item.name === 'CI');
            if (!ci) throw new Error('Required CI workflow unavailable');
            const { data: runs } = await github.rest.actions.listWorkflowRuns({ owner, repo, workflow_id: ci.id, branch: pr.head.ref, event: 'pull_request', per_page: 100 });
            const ciRun = runs.workflow_runs.filter((run) => run.head_sha === pr.head.sha && run.head_branch === pr.head.ref)
              .sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!ciRun || ciRun.status !== 'completed' || ciRun.conclusion !== 'success') throw new Error('Exact-head CI is not green');
            const { data: statuses } = await github.rest.repos.listCommitStatusesForRef({ owner, repo, ref: pr.head.sha, per_page: 100 });
            const preview = statuses.filter((item) => item.context === 'Vercel').sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at))[0];
            if (!preview || preview.state !== 'success') throw new Error('Exact-head Vercel Preview is not green');
            core.info('PR_417_DRAFT=PASS');
            core.info('APPLICATION_SHA=' + pr.head.sha + ' TREE=' + appCommit.tree.sha);
            core.info('EXACT_HEAD_CI=PASS run_id=' + ciRun.id);
            core.info('EXACT_HEAD_PREVIEW=PASS');
            core.info('RELEASE_CHECKPOINT=PASS');

      - name: Checkout exact approved PR #417 application source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: application-source
          fetch-depth: 0
          persist-credentials: true

      - name: Checkout exact release-control target guard
        uses: actions/checkout@v4
        with:
          ref: 9fc77d0490f6a49f8d637879f6395237ac34247a
          path: release-control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact application identity and candidate source availability
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C application-source rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git -C application-source rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test "$(git -C release-control rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
          git -C release-control fetch --no-tags origin "$EXPECTED_RELEASE_BRANCH"
          test "$(git -C release-control rev-parse FETCH_HEAD)" = "$EXPECTED_RELEASE_SHA"
          test -f application-source/prisma/schema.prisma
          test -f application-source/prisma/migrations/202610020001_g06_simple_device_offline/migration.sql
          test -f application-source/prisma/migrations/202610020002_attendance_time_policy_v1/migration.sql
          node -e "const m=require('./scripts/ci/g06-preview-migration-candidates.json'); if(m.canonicalCandidates.length!==18||m.historicalPreviewMigrations.length!==2) process.exit(1); for(const x of [...m.canonicalCandidates,...m.historicalPreviewMigrations]) {const {execFileSync}=require('node:child_process'); if(execFileSync('git',['rev-parse',x.commit+':prisma/migrations/'+x.name+'/migration.sql'],{encoding:'utf8'}).trim()!==x.blob) process.exit(2)}"
          echo 'EXACT_SOURCE_AND_PINNED_HISTORY=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install pinned workflow tooling and generate the exact Prisma client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npx --no-install prisma generate --schema "$GITHUB_WORKSPACE/application-source/prisma/schema.prisma"
          echo 'PRISMA_TOOLING=PASS'

      - name: Mask protected Preview database and target values
        uses: actions/github-script@v7
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT }}
          APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
        with:
          github-token: ${{ github.token }}
          script: |
            for (const name of ['DATABASE_URL', 'DIRECT_URL', 'APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT', 'APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT']) {
              const value = process.env[name];
              if (!value) throw new Error('Required protected Preview setting is unavailable');
              core.setSecret(value);
            }
            core.info('PROTECTED_VALUES_MASKED=true');

      - name: Run read-only migration preflight, exact 001 then 002 apply, and same-run verification
        id: migration
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPLICATION_SOURCE_ROOT: ${{ github.workspace }}/application-source
          RELEASE_CONTROL_ROOT: ${{ github.workspace }}/release-control
          CANDIDATE_MANIFEST: ${{ github.workspace }}/scripts/ci/g06-preview-migration-candidates.json
          GITHUB_WORKSPACE: ${{ github.workspace }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
        run: node scripts/ci/apply-reconciled-preview-g06-migrations.js

      - name: Publish sanitized Preview migration result
        if: always()
        shell: bash
        env:
          PR: ${{ inputs.source_pr_number }}
          SHA: ${{ inputs.source_sha }}
          PLAN: ${{ steps.migration.outputs.migration_plan || 'UNKNOWN' }}
          MATCH: ${{ steps.migration.outputs.candidate_match || 'UNKNOWN' }}
          STATUS: ${{ steps.migration.outputs.migration_status || 'UNKNOWN' }}
          ATTEMPTED: ${{ steps.migration.outputs.migration_apply_attempted || 'UNKNOWN' }}
          APPLY: ${{ steps.migration.outputs.migration_apply_result || 'UNKNOWN' }}
          SCHEMA: ${{ steps.migration.outputs.post_schema || 'UNKNOWN' }}
          RUNTIME: ${{ steps.migration.outputs.preview_runtime || 'UNKNOWN' }}
          POLICY_GET: ${{ steps.migration.outputs.policy_get || 'UNKNOWN' }}
          IPHONE_GATE: ${{ steps.migration.outputs.iphone_ui_gate_ready || 'NO' }}
          FAILURE: ${{ steps.migration.outputs.failure_category || 'UNKNOWN' }}
        run: |
          {
            echo '### Governed G06 Preview migration reconciliation'
            echo "- Application PR: #$PR; exact SHA: $SHA"
            echo "- Historical checksum candidate reconciliation: $MATCH"
            echo "- Read-only Prisma pending state: $STATUS"
            echo "- Migration plan: $PLAN"
            echo "- Migration apply attempted: $ATTEMPTED; result: $APPLY"
            echo "- Post-migration schema: $SCHEMA"
            echo "- Preview health/readiness/CORS: $RUNTIME"
            echo "- Policy GET: $POLICY_GET"
            echo "- Authenticated iPhone UI gate ready: $IPHONE_GATE"
            echo "- Safe failure category: $FAILURE"
            echo '- No raw ledger checksums, database URLs, credentials, business rows, or Production target data emitted.'
            echo '- If preflight did not pass, the migration apply step was not reached.'
          } >> "$GITHUB_STEP_SUMMARY"
