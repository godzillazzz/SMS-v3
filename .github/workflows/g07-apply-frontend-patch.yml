name: G07 Apply Frontend Patch

on:
  push:
    branches:
      - feature/g07-shift-master-lifecycle-v1
    paths:
      - .github/workflows/g07-apply-frontend-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/g07-shift-master-lifecycle-v1
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact G07 frontend patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          api_path = Path('frontend/src/api.ts')
          api = api_path.read_text(encoding='utf-8')
          api_old = """  createShiftType: (token: string, data: unknown) => call('/shift-types', { method: 'POST', body: JSON.stringify(data), headers: { Authorization: `Bearer ${token}` } }),
  deleteShiftType: (token: string, id: string) => call(`/shift-types/${id}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } }),"""
          api_new = """  createShiftType: (token: string, data: unknown) => call('/shift-types', { method: 'POST', body: JSON.stringify(data), headers: { Authorization: `Bearer ${token}` } }),
  updateShiftType: (token: string, id: string, data: unknown) => call(`/shift-types/${encodeURIComponent(id)}`, { method: 'PUT', body: JSON.stringify(data), headers: { Authorization: `Bearer ${token}` } }),
  activateShiftType: (token: string, id: string) => call(`/shift-types/${encodeURIComponent(id)}/activate`, { method: 'POST', body: '{}', headers: { Authorization: `Bearer ${token}` } }),
  deactivateShiftType: (token: string, id: string) => call(`/shift-types/${encodeURIComponent(id)}/deactivate`, { method: 'POST', body: '{}', headers: { Authorization: `Bearer ${token}` } }),
  deleteShiftType: (token: string, id: string) => call(`/shift-types/${encodeURIComponent(id)}`, { method: 'DELETE', headers: { Authorization: `Bearer ${token}` } }),"""
          api = replace_once(api, api_old, api_new, 'api shift lifecycle methods')
          api_path.write_text(api, encoding='utf-8')

          main_path = Path('frontend/src/main.tsx')
          main = main_path.read_text(encoding='utf-8')

          creator_old = """  const openShiftTypeCreator = () => runEditor({
    title: 'เพิ่มรหัสกะ', submitLabel: 'บันทึกรหัสกะ',
    fields: [{ name: 'code', label: 'Shift Code', required: true }, { name: 'name', label: 'ชื่อกะ', required: true }, { name: 'startTime', label: 'เวลาเริ่ม' }, { name: 'endTime', label: 'เวลาเลิก' }, { name: 'hours', label: 'ชั่วโมง', type: 'number', required: true }, { name: 'color', label: 'สี HEX', required: true }],
    values: { color: '#2F80FF', hours: '8' }
  }, (form) => api.createShiftType(auth.token!, formPayload(form, ['startTime', 'endTime'])));
  };"""
          creator_new = """  const openShiftTypeCreator = () => runEditor({
    title: 'เพิ่มรหัสกะ', submitLabel: 'บันทึกรหัสกะ',
    fields: [{ name: 'code', label: 'Shift Code', required: true }, { name: 'name', label: 'ชื่อกะ', required: true }, { name: 'startTime', label: 'เวลาเริ่ม' }, { name: 'endTime', label: 'เวลาเลิก' }, { name: 'hours', label: 'ชั่วโมง', type: 'number', required: true }, { name: 'color', label: 'สี HEX', required: true }],
    values: { color: '#2F80FF', hours: '8' }
  }, (form) => api.createShiftType(auth.token!, formPayload(form, ['startTime', 'endTime'])));
  };

  const openShiftTypeEditor = (shiftType: DataRow) => runEditor({
    title: `แก้ไขรหัสกะ ${text(shiftType.code)}`,
    submitLabel: 'บันทึกการแก้ไข',
    fields: [{ name: 'name', label: 'ชื่อกะ', required: true }, { name: 'startTime', label: 'เวลาเริ่ม' }, { name: 'endTime', label: 'เวลาเลิก' }, { name: 'hours', label: 'ชั่วโมง', type: 'number', required: true }, { name: 'color', label: 'สี HEX', required: true }],
    values: {
      name: String(shiftType.name || ''),
      startTime: String(shiftType.startTime || ''),
      endTime: String(shiftType.endTime || ''),
      hours: String(shiftType.hours || '0'),
      color: String(shiftType.color || '#2F80FF')
    }
  }, (form) => api.updateShiftType(auth.token!, String(shiftType.id), formPayload(form, ['startTime', 'endTime'])));"""
          main = replace_once(main, creator_old, creator_new, 'shift editor functions')

          initial_old = """  const initialType = String(shift?.shiftTypeId || nested(shift?.shiftType).id || defaults?.shiftTypeId || shiftTypes[0]?.id || '');
  const initialRemark = String(shift?.remark || '');"""
          initial_new = """  const initialType = String(shift?.shiftTypeId || nested(shift?.shiftType).id || defaults?.shiftTypeId || shiftTypes.find((item) => item.isActive !== false)?.id || shiftTypes[0]?.id || '');
  const selectableShiftTypes = shiftTypes.filter((item) => item.isActive !== false || String(item.id || '') === initialType);
  const initialRemark = String(shift?.remark || '');"""
          main = replace_once(main, initial_old, initial_new, 'active shift selector default')
          main = replace_once(main, '{shiftTypes.map((t) => (', '{selectableShiftTypes.map((t) => (', 'active shift selector options')

          setup_old = """    if (activePage === 'shiftSetup') return (
      <section className=\"view-pane\">
        <div className=\"page-heading\"><div><p className=\"eyebrow\">ตารางและกฎการทำงาน</p><h1>Shift Setup</h1><p>กำหนดรหัสกะ และเวลาปฏิบัติงานที่ใช้ใน ตารางกะรายเดือน</p></div><div className=\"heading-actions\">{auth.user?.role === 'ADMIN' && <button className=\"btn-primary compact\" onClick={openShiftTypeCreator}>+ เพิ่มรหัสกะ</button>}<span className=\"record-chip\">ทั้งหมด {shiftTypes.length} รหัสกะ</span></div></div>
        <ErrorAlert message={operationError} />
        <div className=\"table-card\"><div className=\"table-scroll\"><table className=\"data-table\"><thead><tr><th>Shift Code</th><th>ชื่อกะ</th><th>เวลาเริ่ม</th><th>เวลาเลิก</th><th>ชั่วโมง</th><th>สี</th>{auth.user?.role === 'ADMIN' && <th>จัดการ</th>}</tr></thead><tbody>{shiftTypes.length ? shiftTypes.map((shiftType) => <tr key={text(shiftType.id)}><td><code>{text(shiftType.code)}</code></td><td className=\"employee-name\">{text(shiftType.name)}</td><td>{text(shiftType.startTime)}</td><td>{text(shiftType.endTime)}</td><td>{text(shiftType.hours)}</td><td><span className=\"shift-color\" style={{ backgroundColor: String(shiftType.color || '#2F80FF') }} /> {text(shiftType.color)}</td>{auth.user?.role === 'ADMIN' && <td className=\"row-actions data-row-actions\"><button className=\"danger-action\" disabled={['D', 'N', 'OFF', 'AL'].includes(String(shiftType.code))} onClick={async () => { if (!auth.token || !window.confirm(`ยืนยันการลบรหัสกะ ${text(shiftType.code)}?`)) return; try { await api.deleteShiftType(auth.token, String(shiftType.id)); setOperationRefresh((value) => value + 1); } catch (reason) { setOperationError(toRequestErrorState(reason, 'ลบรหัสกะไม่สำเร็จ')); } }}>ลบ</button></td>}</tr>) : <tr><td colSpan={auth.user?.role === 'ADMIN' ? 7 : 6} className=\"no-rows\">ยังไม่มีข้อมูลรหัสกะ</td></tr>}</tbody></table></div></div>
      </section>
    );"""
          setup_new = """    if (activePage === 'shiftSetup') {
      const activeShiftCount = shiftTypes.filter((shiftType) => shiftType.isActive !== false).length;
      return (
        <section className=\"view-pane\">
          <div className=\"page-heading\"><div><p className=\"eyebrow\">ตารางและกฎการทำงาน</p><h1>Shift Setup</h1><p>กำหนดรหัสกะ เวลา และสถานะใช้งาน โดยประวัติเดิมยังคงอ้างอิง Shift เดิมเสมอ</p></div><div className=\"heading-actions\">{auth.user?.role === 'ADMIN' && <button className=\"btn-primary compact\" onClick={openShiftTypeCreator}>+ เพิ่มรหัสกะ</button>}<span className=\"record-chip\">ใช้งาน {activeShiftCount} / ทั้งหมด {shiftTypes.length}</span></div></div>
          <ErrorAlert message={operationError} />
          <div className=\"table-card\"><div className=\"table-scroll\"><table className=\"data-table\"><thead><tr><th>Shift Code</th><th>ชื่อกะ</th><th>เวลาเริ่ม</th><th>เวลาเลิก</th><th>ชั่วโมง</th><th>ข้ามวัน</th><th>สถานะ</th><th>สี</th>{auth.user?.role === 'ADMIN' && <th>จัดการ</th>}</tr></thead><tbody>{shiftTypes.length ? shiftTypes.map((shiftType) => {
            const isActive = shiftType.isActive !== false;
            const shiftCode = String(shiftType.code || '').toUpperCase();
            const startTime = String(shiftType.startTime || '');
            const endTime = String(shiftType.endTime || '');
            const overnight = Number(shiftType.hours || 0) > 0 && Boolean(startTime && endTime) && endTime <= startTime;
            return <tr key={text(shiftType.id)}><td><code>{text(shiftType.code)}</code></td><td className=\"employee-name\">{text(shiftType.name)}</td><td>{text(shiftType.startTime)}</td><td>{text(shiftType.endTime)}</td><td>{text(shiftType.hours)}</td><td>{overnight ? 'ใช่' : 'ไม่'}</td><td><span className={`status-badge status-badge--${isActive ? 'positive' : 'neutral'}`}>{isActive ? 'ใช้งาน' : 'ปิดใช้งาน'}</span></td><td><span className=\"shift-color\" style={{ backgroundColor: String(shiftType.color || '#2F80FF') }} /> {text(shiftType.color)}</td>{auth.user?.role === 'ADMIN' && <td className=\"row-actions data-row-actions\"><button className=\"btn-neutral compact\" onClick={() => openShiftTypeEditor(shiftType)}>แก้ไข</button><button className={isActive ? 'danger-action' : 'btn-success'} disabled={isActive && ['OFF', 'AL'].includes(shiftCode)} onClick={async () => { if (!auth.token || !window.confirm(isActive ? `ยืนยันการปิดใช้งานรหัสกะ ${text(shiftType.code)}? ประวัติเดิมจะยังคงอยู่` : `ยืนยันการเปิดใช้งานรหัสกะ ${text(shiftType.code)}?`)) return; try { if (isActive) await api.deactivateShiftType(auth.token, String(shiftType.id)); else await api.activateShiftType(auth.token, String(shiftType.id)); setOperationRefresh((value) => value + 1); } catch (reason) { setOperationError(toRequestErrorState(reason, isActive ? 'ปิดใช้งานรหัสกะไม่สำเร็จ' : 'เปิดใช้งานรหัสกะไม่สำเร็จ')); } }}>{isActive ? 'ปิดใช้งาน' : 'เปิดใช้งาน'}</button></td>}</tr>;
          }) : <tr><td colSpan={auth.user?.role === 'ADMIN' ? 9 : 8} className=\"no-rows\">ยังไม่มีข้อมูลรหัสกะ</td></tr>}</tbody></table></div></div>
        </section>
      );
    }"""
          main = replace_once(main, setup_old, setup_new, 'shift setup lifecycle presentation')
          main_path.write_text(main, encoding='utf-8')
          PY
      - name: Verify frontend patch
        run: |
          npm --prefix frontend ci
          npx tsc --noEmit --project frontend/tsconfig.json
          npm --prefix frontend test
      - name: Commit patch to G07 branch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend/src/api.ts frontend/src/main.tsx
          git diff --cached --check
          git commit -m "feat(g07): add shift lifecycle admin UX"
          git push origin HEAD:feature/g07-shift-master-lifecycle-v1