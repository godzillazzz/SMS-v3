name: Deploy prebuilt operational email artifact

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Full source commit SHA
        required: true
        type: string
        default: e15d76ad1907a6fae0c28f1859f64e506ca2841a
      target_project:
        description: Type sms-v3-staging to confirm the target
        required: true
        type: string
        default: sms-v3-staging
      diagnostic_only:
        description: Run build diagnostics without deployment or alias changes
        required: true
        type: boolean
        default: true

concurrency:
  group: sms-v3-staging-prebuilt-operational-email
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging
  CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  CANONICAL_HOST: sms-v3-staging-ten.vercel.app

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    permissions:
      contents: read
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Checkout exact source at repository root
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1

      - name: Validate root and target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          TARGET_PROJECT: ${{ inputs.target_project }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == "refs/heads/main" ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$TARGET_SHA" ]]
          [[ "$TARGET_PROJECT" == "$EXPECTED_PROJECT_NAME" ]]
          [[ "$VERCEL_PROJECT_ID" == "$EXPECTED_PROJECT_ID" ]]
          [[ "$VERCEL_ORG_ID" == "$EXPECTED_ORG_ID" ]]
          [[ "$(pwd)" == "$GITHUB_WORKSPACE" ]]
          test -f package.json
          test -f vercel.json
          test -d frontend
          test -f frontend/package.json
          test -d src
          echo "TARGET_PROJECT=$EXPECTED_PROJECT_NAME"
          echo "TARGET_SHA_VALID=true"
          echo "PROJECT_ID_MATCH=true"
          echo "ORG_ID_MATCH=true"

      - name: Check Vercel credentials presence
        shell: bash
        run: |
          set -euo pipefail
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -n "${!name:-}" ]]; then echo "$name=PRESENT"; else echo "$name=MISSING"; fi
          done
          [[ -n "${VERCEL_TOKEN:-}" && -n "${VERCEL_ORG_ID:-}" && -n "${VERCEL_PROJECT_ID:-}" ]]

      - name: Install build dependencies from repository root
        run: |
          npm ci --ignore-scripts
          npm ci --prefix frontend --ignore-scripts

      - name: Link exact Vercel project at repository root
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          chmod 700 .vercel
          printf '%s\n' '{"projectId":"'"$EXPECTED_PROJECT_ID"'","orgId":"'"$EXPECTED_ORG_ID"'"}' > .vercel/project.json
          test "$(node -e "const p=require('./.vercel/project.json'); process.stdout.write(p.projectId)" )" = "$EXPECTED_PROJECT_ID"
          test "$(node -e "const p=require('./.vercel/project.json'); process.stdout.write(p.orgId)" )" = "$EXPECTED_ORG_ID"
          echo "PROJECT_JSON_VALID=true"

      - name: Pull Production configuration
        shell: bash
        run: |
          set -euo pipefail
          test "$(pwd)" = "$GITHUB_WORKSPACE"
          npx --yes vercel@56.4.1 pull --yes --environment=production --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" > /tmp/prebuilt-pull.log 2>&1

      - name: Report build context
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '### Build context'
            echo "pwd=$(pwd)"
            echo "git_head=$(git rev-parse HEAD)"
            echo "node=$(node --version)"
            echo "npm=$(npm --version)"
            echo "vercel=$(npx --yes vercel@56.4.1 --version)"
            node <<'NODE'
          const fs = require('fs');
          const project = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('vercel.json', 'utf8'));
          console.log(`projectId=${project.projectId}`);
          console.log(`orgId=${project.orgId}`);
          console.log('root=.');
          console.log(`buildCommand=${config.buildCommand || 'default'}`);
          console.log(`outputDirectory=${config.outputDirectory || 'default'}`);
          NODE
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run direct production build diagnostic
        id: direct_build
        shell: bash
        run: |
          set +e
          npm run vercel-build 2>&1 | tee "$RUNNER_TEMP/npm-vercel-build.log"
          direct_exit=${PIPESTATUS[0]}
          set -e
          echo "exit=$direct_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build fresh prebuilt output
        id: vercel_build
        shell: bash
        run: |
          set +e
          test "$(pwd)" = "$GITHUB_WORKSPACE"
          npx --yes vercel@56.4.1 build --prod --debug 2>&1 | tee "$RUNNER_TEMP/vercel-build.raw.log"
          build_exit=${PIPESTATUS[0]}
          set -e
          echo "exit=$build_exit" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Sanitize build diagnostics
        if: always()
        shell: bash
        env:
          DIRECT_EXIT: ${{ steps.direct_build.outputs.exit }}
          BUILD_EXIT: ${{ steps.vercel_build.outputs.exit }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/license-build-diagnostics"
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const temp = process.env.RUNNER_TEMP;
          const outDir = path.join(temp, 'license-build-diagnostics');
          fs.mkdirSync(outDir, { recursive: true });
          const read = (file) => {
            try { return fs.readFileSync(file, 'utf8'); } catch { return ''; }
          };
          const redact = (input) => input
            .replace(/(?:authorization\s*:\s*|bearer\s+)[^\s,;]+/gi, '<AUTH_REDACTED>')
            .replace(/\b[A-Z][A-Z0-9_]*(?:TOKEN|SECRET|PASSWORD)\s*[:=]\s*[^\s,;]+/gi, '<SECRET_REDACTED>')
            .replace(/\b(?:DATABASE_URL|DIRECT_URL)\s*[:=]\s*[^\s,;]+/gi, '<DATABASE_VALUE_REDACTED>')
            .replace(/(?:postgres|postgresql|smtp):\/\/[^\s"'`]+/gi, '<CONNECTION_REDACTED>')
            .replace(/https?:\/\/[^\s"'`]+/gi, '<URL_REDACTED>')
            .replace(/([?&][^=\s]+)=([^&\s]+)/g, '$1=<QUERY_REDACTED>');
          const sanitizeFile = (input, output) => {
            const safe = redact(read(input));
            fs.writeFileSync(output, safe, 'utf8');
            return safe;
          };
          const npmLog = sanitizeFile(
            path.join(temp, 'npm-vercel-build.log'),
            path.join(outDir, 'npm-vercel-build.sanitized.log'),
          );
          const vercelLog = sanitizeFile(
            path.join(temp, 'vercel-build.raw.log'),
            path.join(outDir, 'vercel-build.sanitized.log'),
          );
          const source = vercelLog || npmLog;
          const lines = source.split(/\r?\n/).filter(Boolean);
          const firstError = lines.find((line) => /\b(error|failed|fatal|cannot|unable|missing|not found|invalid)\b/i.test(line)) || 'not captured';
          const summary = [
            '### Build diagnostics',
            `direct_npm_build=${process.env.DIRECT_EXIT === '0' ? 'PASS' : 'FAIL'}`,
            `vercel_build=${process.env.BUILD_EXIT === '0' ? 'PASS' : 'FAIL'}`,
            `DIRECT_EXIT=${process.env.DIRECT_EXIT || 'unknown'}`,
            `BUILD_EXIT=${process.env.BUILD_EXIT || 'unknown'}`,
            `first_error=${firstError}`,
            '#### Last 100 sanitized build lines',
            ...lines.slice(-100),
            process.env.DIRECT_EXIT === '0' && process.env.BUILD_EXIT !== '0'
              ? 'ERROR_CATEGORY=VERCEL_CLI_OR_PROJECT_CONFIG'
              : process.env.DIRECT_EXIT !== '0' ? 'ERROR_CATEGORY=BUILD_COMMAND_FAILED' : 'ERROR_CATEGORY=UNKNOWN',
          ].join('\n') + '\n';
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          NODE

      - name: Upload sanitized build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-complete-build-diagnostics
          path: ${{ runner.temp }}/license-build-diagnostics/*.sanitized.log
          if-no-files-found: error
          retention-days: 7

      - name: Finish diagnostic-only run
        if: always()
        shell: bash
        env:
          DIRECT_EXIT: ${{ steps.direct_build.outputs.exit }}
          BUILD_EXIT: ${{ steps.vercel_build.outputs.exit }}
        run: |
          if [[ "${{ inputs.diagnostic_only }}" == 'true' ]]; then
            exit "${BUILD_EXIT:-1}"
          fi

      - name: Validate .vercel/output before deployment
        if: inputs.diagnostic_only != true
        shell: bash
        run: |
          set -euo pipefail
          test -f .vercel/output/static/index.html
          test -n "$(find .vercel/output/static/assets -maxdepth 1 -type f -name 'index-*.js' -print -quit)"
          test -z "$(find .vercel/output -type d -name '_next' -print -quit)"
          for marker in 'แนบใบอนุญาตใหม่' 'ขนาดไม่เกิน 2 MB' '/licenses/' '/documents' 'ลบถาวร'; do
            grep -R -F --quiet "$marker" .vercel/output/static
          done
          echo "PREBUILT_ARTIFACT=VITE"
          echo "PREBUILT_MARKERS=PASS"

      - name: Deploy prebuilt without changing canonical
        if: inputs.diagnostic_only != true
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 deploy --prebuilt --prod --skip-domain --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --format=json > /tmp/prebuilt-deploy.json 2>/tmp/prebuilt-deploy.err
          node <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('/tmp/prebuilt-deploy.json', 'utf8'));
          const id = value.id || value.deployment?.id;
          const rawUrl = String(value.url || value.deployment?.url || '').trim();
          const fullUrl = /^https?:\/\//i.test(rawUrl) ? rawUrl : `https://${rawUrl}`;
          const parsed = new URL(fullUrl);
          if (!id || !['http:', 'https:'].includes(parsed.protocol) || parsed.username || parsed.password || parsed.search || parsed.hash) process.exit(1);
          console.log(`DEPLOYMENT_ID=${id}`);
          console.log(`DEPLOYMENT_URL=${fullUrl}`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `deployment_id=${id}\ndeployment_url=${fullUrl}\n`);
          NODE

      - name: Verify deployment URL artifact and health
        if: inputs.diagnostic_only != true
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error "$DEPLOYMENT_URL/")"
          asset="$(grep -oE '/assets/index-[^" ]+\.js' <<<"$html" | head -n 1 || true)"
          [[ -n "$asset" && "$html" != *"/_next/"* ]]
          js="$(curl --fail --silent --show-error "${DEPLOYMENT_URL}${asset}")"
          for marker in 'แนบใบอนุญาตใหม่' 'ขนาดไม่เกิน 2 MB' '/licenses/' '/documents' 'ลบถาวร'; do grep -F --quiet "$marker" <<<"$js"; done
          for path in / /login /api/v1/health; do test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$DEPLOYMENT_URL$path")" = 200; done
          for attempt in 1 2 3; do
            body="$(curl --silent --show-error --fail "$DEPLOYMENT_URL/api/v1/ready")"
            node -e 'const v=JSON.parse(process.argv[1]); if(v.status!=="ready" || v.database!=="ok") process.exit(1)' "$body"
            echo "DEPLOYMENT_READINESS_$attempt=200,status=ready,database=ok"
          done

      - name: Alias verified deployment to canonical
        if: inputs.diagnostic_only != true
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          npx --yes vercel@56.4.1 alias set "$DEPLOYMENT_URL" "$CANONICAL_HOST" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          echo "CANONICAL_ALIAS_UPDATED=true"

      - name: Verify canonical and upload route
        if: inputs.diagnostic_only != true
        shell: bash
        run: |
          set -euo pipefail
          html="$(curl --fail --silent --show-error "$CANONICAL_URL/")"
          asset="$(grep -oE '/assets/index-[^" ]+\.js' <<<"$html" | head -n 1 || true)"
          [[ -n "$asset" && "$html" != *"/_next/"* ]]
          js="$(curl --fail --silent --show-error "$CANONICAL_URL$asset")"
          for marker in 'แนบใบอนุญาตใหม่' 'ขนาดไม่เกิน 2 MB' '/licenses/' '/documents'; do grep -F --quiet "$marker" <<<"$js"; done
          for path in / /login /api/v1/health; do test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$CANONICAL_URL$path")" = 200; done
          for attempt in 1 2 3; do
            body="$(curl --silent --show-error --fail "$CANONICAL_URL/api/v1/ready")"
            node -e 'const v=JSON.parse(process.argv[1]); if(v.status!=="ready" || v.database!=="ok") process.exit(1)' "$body"
            echo "CANONICAL_READINESS_$attempt=200,status=ready,database=ok"
          done
          echo "OWNER_EMAIL_UAT=PENDING"

      - name: Cleanup temporary files
        if: always()
        shell: bash
        run: rm -rf .vercel frontend/dist /tmp/prebuilt-pull.log /tmp/prebuilt-build.log /tmp/prebuilt-deploy.json /tmp/prebuilt-deploy.err
