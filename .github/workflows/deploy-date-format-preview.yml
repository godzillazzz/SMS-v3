name: WAVE 3 Preview Visual Witness (Stage Only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-v3-wave3-preview-visual-witness
  cancel-in-progress: false

env:
  TARGET_SHA: 258689837a0b9aea55161639aa0fab2d820e519c
  EXPECTED_TREE: 5f6d8168d9719c25b5436442be9a032f97c28f6f
  GOVERNANCE_SHA: a259c34aa026be86ad009a27d96439a8ac6c7a16
  GOVERNANCE_TREE: c1fc3eb180353557c1ef053353a6efc332b5b9b1
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_CANONICAL_DEPLOYMENT_ID: dpl_8AVBmyfVuNBQAAoTdfRtBUCccujS
  EXPECTED_CANONICAL_SHA: 70d1113233cea5ebc909eb6db656ec35cde49106
  EXPECTED_CANONICAL_TREE: 2991471ae280e00c0d247e3a243c7157416df15d
  ROLLBACK_DEPLOYMENT_ID: dpl_FBBYLL6oZ9AcwUDtX5eaLJ1stN2R
  ROLLBACK_SHA: 39035641c494005feba38b61aa4ffd761245cf6a
  ROLLBACK_TREE: f540a47c0db82b096027062e7d3cab5f4d6e03d1
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  stage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      NODE_ENV: production
      VERCEL_ENV: preview
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Verify Environment credentials are available
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          echo "ENVIRONMENT_CREDENTIAL_GATE=PASS"

      - name: Checkout approved governance tooling source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.GOVERNANCE_SHA }}
          fetch-depth: 0

      - name: Snapshot approved governance tooling and checkout exact Application SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GOVERNANCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$GOVERNANCE_TREE"
          governance_root="$RUNNER_TEMP/sms-v3-governance"
          mkdir -p "$governance_root/config" "$governance_root/scripts/ci"
          cp config/environment-contract.json "$governance_root/config/environment-contract.json"
          cp scripts/ci/verify-environment-contract.js "$governance_root/scripts/ci/verify-environment-contract.js"
          cp scripts/ci/verify-deployment-target.js "$governance_root/scripts/ci/verify-deployment-target.js"
          cp scripts/ci/verify-linux-artifact.js "$governance_root/scripts/ci/verify-linux-artifact.js"
          git checkout --detach "$TARGET_SHA"
          git clean -fd
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          echo "GOVERNANCE_TOOLING_SHA=$GOVERNANCE_SHA"
          echo "GOVERNANCE_TOOLING_TREE=$GOVERNANCE_TREE"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate exact source and target identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          git cat-file -e "$TARGET_SHA^{commit}"
          echo "STAGED_SOURCE_SHA=$TARGET_SHA"
          echo "STAGED_SOURCE_TREE=$EXPECTED_TREE"

      - name: Verify environment governance contract definition
        run: node "$RUNNER_TEMP/sms-v3-governance/scripts/ci/verify-environment-contract.js" --contract-only

      - name: Clean install dependencies and verify Linux sharp load
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npm --prefix frontend ci --include=dev
          echo "RUNNER_IMAGE=ubuntu-24.04"
          echo "NPM_VERSION=$(npm --version)"
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [name, version, label] of [
            ['node_modules/@img/sharp-linux-x64', '0.35.4', 'LINUX_SHARP_PACKAGE_PRESENT'],
            ['node_modules/@img/sharp-libvips-linux-x64', '1.3.3', 'LINUX_LIBVIPS_PACKAGE_PRESENT'],
          ]) {
            const lockEntry = lock.packages?.[name];
            if (!lockEntry || lockEntry.version !== version) throw new Error(`${label}: lockfile mismatch`);
            const dir = path.join(...name.split('/'));
            if (!fs.existsSync(dir)) throw new Error(`${label}: installed package missing`);
            const pkg = JSON.parse(fs.readFileSync(path.join(dir, 'package.json'), 'utf8'));
            if (pkg.version !== version) throw new Error(`${label}: installed version mismatch`);
            console.log(`${label}=PASS version=${version}`);
          }
          const sharp = require('sharp');
          if (sharp.versions?.sharp !== '0.35.4') throw new Error('sharp version mismatch');
          console.log(`SHARP_VERSION=${sharp.versions.sharp}`);
          console.log(`NODE_VERSION=${process.version}`);
          console.log(`PLATFORM=${process.platform}-${process.arch}`);
          console.log('LINUX_SHARP_LOAD=PASS');
          NODE

      - name: Pull approved Preview configuration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@"$VERCEL_CLI_VERSION" pull --yes --environment=preview --project "$EXPECTED_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >/tmp/vercel-pull.log 2>&1
          node - <<'NODE'
          const fs = require('fs');
          const project = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (project.projectId !== process.env.EXPECTED_PROJECT_ID || project.orgId !== process.env.EXPECTED_ORG_ID) {
            throw new Error('Vercel project linkage mismatch');
          }
          NODE

      - name: Verify Preview configuration shape without exposing values
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const candidates = ['.vercel/.env.preview.local', '.vercel/.env.preview'];
          const file = candidates.find((entry) => fs.existsSync(entry));
          if (!file) throw new Error('Preview env file missing after vercel pull');
          const text = fs.readFileSync(file, 'utf8');
          for (const key of ['DATABASE_URL', 'JWT_SECRET', 'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY']) {
            if (!new RegExp('^' + key + '=', 'm').test(text)) throw new Error('Preview configuration missing ' + key);
          }
          console.log('PREVIEW_CONFIG_SHAPE=PASS');
          NODE

      - name: Verify Preview environment contract before build
        shell: bash
        run: |
          set -euo pipefail
          env_file=.vercel/.env.preview.local
          test -f "$env_file"
          NODE_PATH="$PWD/node_modules" node "$RUNNER_TEMP/sms-v3-governance/scripts/ci/verify-environment-contract.js" \
            --environment=preview \
            --env-file="$env_file" \
            --require-preview-fingerprint \
            --run-migrations=false \
            --source-sha="$TARGET_SHA" \
            --source-tree="$EXPECTED_TREE" \
            --cwd="$PWD"

      - name: Build exact prebuilt Preview artifact
        shell: bash
        run: |
          set -euo pipefail
          build_log=$(mktemp)
          CI_MIGRATION_COMPLETED=true npx --yes vercel@"$VERCEL_CLI_VERSION" build --token "$VERCEL_TOKEN" >"$build_log" 2>&1
          grep -Eq 'Vercel build is build-only|Vercel preview build: production migration skipped|Non-Vercel build: production migration skipped' "$build_log"
          grep -Fq 'Prisma generate passed' "$build_log"
          grep -Fq 'Application build passed' "$build_log"
          if grep -Eiq 'prisma migrate deploy|Prisma migrate deploy started|Prisma migrate deploy passed' "$build_log"; then
            echo 'Unexpected migration during Vercel build'
            exit 1
          fi
          test -f frontend/dist/index.html
          test -f .vercel/output/config.json
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const root = path.resolve('.vercel/output/functions');
          if (!fs.existsSync(root)) throw new Error('Vercel function output missing');
          const found = new Set();
          const sharpRoots = [];
          function walk(dir) {
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              const full = path.join(dir, entry.name);
              if (!entry.isDirectory()) continue;
              if (path.basename(path.dirname(full)) === '@img' && ['sharp-linux-x64', 'sharp-libvips-linux-x64', 'sharp-win32-x64'].includes(entry.name)) found.add(`@img/${entry.name}`);
              if (entry.name === 'sharp' && fs.existsSync(path.join(full, 'package.json'))) sharpRoots.push(full);
              walk(full);
            }
          }
          walk(root);
          if (!found.has('@img/sharp-linux-x64')) throw new Error('Linux sharp package missing from .vercel/output');
          if (!found.has('@img/sharp-libvips-linux-x64')) throw new Error('Linux libvips package missing from .vercel/output');
          if (!sharpRoots.length) throw new Error('sharp package missing from function artifact');
          let loaded = false;
          for (const sharpRoot of sharpRoots) {
            const pkg = JSON.parse(fs.readFileSync(path.join(sharpRoot, 'package.json'), 'utf8'));
            if (pkg.version !== '0.35.4') throw new Error('artifact sharp version mismatch');
            try { if (require(sharpRoot).versions?.sharp === '0.35.4') loaded = true; } catch (error) { console.log(`ARTIFACT_SHARP_LOAD_ATTEMPT=FAIL ${error.message}`); }
          }
          if (!loaded) throw new Error('Linux sharp failed to load from function artifact');
          console.log('LINUX_SHARP_PACKAGE_IN_ARTIFACT=PASS');
          console.log('LINUX_LIBVIPS_PACKAGE_IN_ARTIFACT=PASS');
          console.log(`WIN32_SHARP_PACKAGE_IN_ARTIFACT=${found.has('@img/sharp-win32-x64') ? 'PRESENT' : 'ABSENT'}`);
          console.log('LINUX_ARTIFACT_VERIFY=PASS');
          NODE
          node scripts/ci/verify-release-artifact.js frontend/dist .vercel/output/static
          node "$RUNNER_TEMP/sms-v3-governance/scripts/ci/verify-linux-artifact.js" .vercel/output --require-sharp-load
          rm -f "$build_log"

      - name: Restore exact source identity before deploy
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree -- .
          git clean -fd
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test -z "$(git status --porcelain)"
          test -f frontend/dist/index.html
          test -f .vercel/output/config.json

      - name: Verify current Canonical and rollback checkpoints before staging
        shell: bash
        run: |
          set -euo pipefail
          canonical_alias=$(mktemp)
          canonical_deployment=$(mktemp)
          rollback_deployment=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >"$canonical_alias"
          curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$EXPECTED_CANONICAL_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" >"$canonical_deployment"
          curl --fail --silent --show-error -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$ROLLBACK_DEPLOYMENT_ID?teamId=$VERCEL_ORG_ID" >"$rollback_deployment"
          node - "$canonical_alias" "$canonical_deployment" "$rollback_deployment" <<'NODE'
          const fs = require('node:fs');
          const parse = (file) => { const raw = fs.readFileSync(file, 'utf8'); const match = raw.match(/\{[\s\S]*\}/); if (!match) throw new Error('inspect JSON missing'); return JSON.parse(match[0]); };
          const alias = parse(process.argv[2]);
          const canonical = JSON.parse(fs.readFileSync(process.argv[3], 'utf8'));
          const rollback = JSON.parse(fs.readFileSync(process.argv[4], 'utf8'));
          const canonicalSha = canonical.meta?.githubCommitSha || canonical.gitSource?.sha || '';
          const rollbackSha = rollback.meta?.githubCommitSha || rollback.gitSource?.sha || '';
          if (alias.id !== process.env.EXPECTED_CANONICAL_DEPLOYMENT_ID) throw new Error('canonical alias drift');
          if (canonical.id !== process.env.EXPECTED_CANONICAL_DEPLOYMENT_ID || canonical.target !== 'production' || (canonical.readyState || canonical.state) !== 'READY') throw new Error('canonical checkpoint invalid');
          if (canonicalSha !== process.env.EXPECTED_CANONICAL_SHA) throw new Error(`canonical SHA mismatch: ${canonicalSha}`);
          if (rollback.id !== process.env.ROLLBACK_DEPLOYMENT_ID || rollback.target !== 'production' || (rollback.readyState || rollback.state) !== 'READY') throw new Error('rollback checkpoint invalid');
          if (rollbackSha !== process.env.ROLLBACK_SHA) throw new Error(`rollback SHA mismatch: ${rollbackSha}`);
          console.log(`CURRENT_PRODUCTION_DEPLOYMENT=${canonical.id}`);
          console.log(`CURRENT_PRODUCTION_SHA=${canonicalSha}`);
          console.log(`ROLLBACK_DEPLOYMENT=${rollback.id}`);
          console.log(`ROLLBACK_SHA=${rollbackSha}`);
          console.log('PRE_STAGE_CANONICAL_GATE=PASS');
          console.log('ROLLBACK_POINTER_GATE=PASS');
          NODE
          rm -f "$canonical_alias" "$canonical_deployment" "$rollback_deployment"

      - name: Create Preview-target VISUAL WITNESS deployment without domain assignment
        id: staged
        shell: bash
        run: |
          set -euo pipefail
          deploy_json=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" deploy --prebuilt --yes --project "$EXPECTED_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" \
            --meta "githubCommitSha=$TARGET_SHA" \
            --meta "githubCommitTree=$EXPECTED_TREE" \
            --meta 'releaseMode=wave3-preview-visual-witness' \
            --format=json >"$deploy_json"
          node - "$deploy_json" <<'NODE' >> "$GITHUB_OUTPUT"
          const fs = require('fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          const match = raw.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('Deployment JSON missing');
          const data = JSON.parse(match[0]);
          const id = data.id || data.deploymentId;
          const url = data.url || data.deploymentUrl;
          if (!/^dpl_[A-Za-z0-9]+$/.test(id || '')) throw new Error('Deployment id invalid');
          if (!/^https:\/\/sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app\/?$/.test(url || '')) throw new Error('Deployment URL invalid');
          process.stdout.write(`deployment_id=${id}\ndeployment_url=${url}\n`);
          NODE
          rm -f "$deploy_json"

      - name: Inspect exact preview deployment and prove Canonical unchanged
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.staged.outputs.deployment_id }}
        run: |
          set -euo pipefail
          staged_json=$(mktemp)
          canonical_json=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_ID" --format=json --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >"$staged_json"
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >"$canonical_json"
          node - "$staged_json" "$canonical_json" <<'NODE'
          const fs = require('fs');
          const parse = (file) => {
            const raw = fs.readFileSync(file, 'utf8');
            const m = raw.match(/\{[\s\S]*\}/);
            if (!m) throw new Error('inspect JSON missing');
            return JSON.parse(m[0]);
          };
          const staged = parse(process.argv[2]);
          const canonical = parse(process.argv[3]);
          if (staged.name !== process.env.EXPECTED_PROJECT_NAME) throw new Error('staged project mismatch');
           if (staged.target !== 'preview') throw new Error('preview target is not preview');
          if (staged.readyState !== 'READY') throw new Error('staged deployment is not READY');
          const stagedSha = staged.meta?.githubCommitSha || staged.gitSource?.sha || null;
          if (stagedSha && stagedSha !== process.env.TARGET_SHA) throw new Error(`staged SHA mismatch: ${stagedSha}`);
          const stagedTree = staged.meta?.githubCommitTree || null;
          if (stagedTree && stagedTree !== process.env.EXPECTED_TREE) throw new Error(`staged tree mismatch: ${stagedTree}`);
          const aliases = [...(Array.isArray(staged.alias) ? staged.alias : []), ...(Array.isArray(staged.aliases) ? staged.aliases : [])];
          if (aliases.some((alias) => String(alias).includes(new URL(process.env.EXPECTED_CANONICAL_URL).hostname))) throw new Error('staged deployment has canonical alias');
          if (canonical.id !== process.env.EXPECTED_CANONICAL_DEPLOYMENT_ID) throw new Error('Canonical changed before promotion');
          console.log(`STAGED_DEPLOYMENT_ID=${staged.id}`);
          console.log(`STAGED_DEPLOYMENT_URL=https://${staged.url}`);
          console.log(`STAGED_SHA=${stagedSha}`);
          console.log(`STAGED_TREE=${stagedTree || 'NOT_EXPOSED_BY_METADATA'}`);
          console.log(`STAGED_ALIAS_COUNT=${aliases.length}`);
          console.log(`CANONICAL_UNCHANGED=${canonical.id}`);
          NODE
          rm -f "$staged_json" "$canonical_json"

      - name: Preview health and readiness
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.staged.outputs.deployment_url }}
        run: |
          set -euo pipefail
          for path in /api/v1/health /api/v1/ready; do
            out=$(mktemp)
            npx --yes vercel@"$VERCEL_CLI_VERSION" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" curl "$path" --deployment "$DEPLOYMENT_URL" >"$out"
            node -e 'const fs=require("fs"); const [file,path]=process.argv.slice(1); const raw=fs.readFileSync(file,"utf8"); let body; try { body=JSON.parse(raw); } catch { throw new Error(path+" response is not JSON"); } if (path.endsWith("/health") && body.status!=="ok") throw new Error("health failed"); if (path.endsWith("/ready") && (body.status!=="ready" || body.database!=="ok")) throw new Error("readiness failed"); console.log("STAGED_"+(path.endsWith("/ready")?"READY":"HEALTH")+"=PASS");' "$out" "$path"
            rm -f "$out"
          done
          root=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" curl / --deployment "$DEPLOYMENT_URL" >"$root"
          node - "$root" <<'NODE'
          const fs = require('node:fs');
          const html = fs.readFileSync(process.argv[2], 'utf8');
          if (!/<(?:!doctype\s+html|html)\b/i.test(html)) throw new Error('staged root is not HTML');
          console.log('STAGED_ROOT=PASS');
          NODE
          rm -f "$root"
          auth=$(mktemp)
          auth_err=$(mktemp)
          set +e
          npx --yes vercel@"$VERCEL_CLI_VERSION" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" curl /api/v1/auth/login --deployment "$DEPLOYMENT_URL" >"$auth" 2>"$auth_err"
          auth_exit=$?
          set -e
          if grep -Eiq 'FUNCTION_INVOCATION_FAILED|Could not load the "sharp" module|sharp.*linux-x64|process exited with status 1' "$auth" "$auth_err"; then
            echo 'Auth function still has a runtime/native-module failure'
            exit 1
          fi
          test -s "$auth" || test -s "$auth_err"
          echo "AUTH_FUNCTION_HTTP_EXIT=$auth_exit"
          echo 'AUTH_FUNCTION_RUNTIME=PASS'
          rm -f "$auth" "$auth_err"

      - name: Preview CORS origin gate
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.staged.outputs.deployment_url }}
        run: |
          set -euo pipefail
          origin=$(node -p "new URL(process.env.DEPLOYMENT_URL).origin")
          headers=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" curl /api/v1/auth/login --deployment "$DEPLOYMENT_URL" -- --request OPTIONS --header "Origin: $origin" --header "Access-Control-Request-Method: POST" --include >"$headers"
          grep -Eq '^HTTP/[^ ]+ 2[0-9][0-9]' "$headers"
          grep -Eiq "^access-control-allow-origin:[[:space:]]*$origin[[:space:]]*$" "$headers"
          echo "PREVIEW_CORS_ORIGIN_GATE=PASS"
          rm -f "$headers"

      - name: Prove frontend equivalence with Production-target candidate
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.staged.outputs.deployment_url }}
          PRODUCTION_TARGET_URL: https://sms-v3-staging-otzy9fbhr-godzillazz.vercel.app
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          npx --yes vercel@"$VERCEL_CLI_VERSION" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" curl / --deployment "$DEPLOYMENT_URL" >"$tmp/preview.html"
          npx --yes vercel@"$VERCEL_CLI_VERSION" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" curl / --deployment "$PRODUCTION_TARGET_URL" >"$tmp/production.html"
          node - "$tmp/preview.html" "$tmp/production.html" <<'NODE' >"$tmp/assets.txt"
          const fs = require('node:fs');
          const read = (file) => fs.readFileSync(file, 'utf8');
          const assets = (html) => [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)].map((match) => match[1]).sort();
          const preview = assets(read(process.argv[2]));
          const production = assets(read(process.argv[3]));
          if (!preview.length || preview.join('\n') !== production.join('\n')) throw new Error('frontend asset manifest mismatch');
          for (const asset of preview) console.log(asset);
          NODE
          index=0
          while IFS= read -r asset; do
            preview_file="$tmp/preview-$index"
            production_file="$tmp/production-$index"
            npx --yes vercel@"$VERCEL_CLI_VERSION" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" curl "$asset" --deployment "$DEPLOYMENT_URL" >"$preview_file"
            npx --yes vercel@"$VERCEL_CLI_VERSION" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" curl "$asset" --deployment "$PRODUCTION_TARGET_URL" >"$production_file"
            preview_hash=$(sha256sum "$preview_file" | awk '{print $1}')
            production_hash=$(sha256sum "$production_file" | awk '{print $1}')
            test "$preview_hash" = "$production_hash"
            echo "ASSET_EQUIVALENCE_PASS=$asset sha256=$preview_hash"
            index=$((index + 1))
          done <"$tmp/assets.txt"
          test "$index" -ge 2
          node - "$tmp/preview.html" "$tmp/production.html" <<'NODE'
          const fs = require('node:fs');
          const normalize = (value) => value.replace(/\s+/g, ' ').trim();
          const preview = normalize(fs.readFileSync(process.argv[2], 'utf8'));
          const production = normalize(fs.readFileSync(process.argv[3], 'utf8'));
          if (preview !== production) throw new Error('root application sentinel mismatch');
          console.log('ROOT_SENTINEL_EQUIVALENCE=PASS');
          console.log('FRONTEND_JS_EQUIVALENCE=PASS');
          console.log('FRONTEND_CSS_EQUIVALENCE=PASS');
          NODE
          echo 'ARTIFACT_EQUIVALENCE=PASS'
          rm -rf "$tmp"

      - name: Confirm candidate logs contain no sharp/runtime failure
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.staged.outputs.deployment_url }}
        run: |
          set -euo pipefail
          logs=$(mktemp)
          set +e
          npx --yes vercel@"$VERCEL_CLI_VERSION" logs "$DEPLOYMENT_URL" --since 10m --token "$VERCEL_TOKEN" >"$logs" 2>&1
          logs_exit=$?
          set -e
          if grep -Eiq 'FUNCTION_INVOCATION_FAILED|Could not load the "sharp" module|sharp.*linux-x64|process exited with status 1' "$logs"; then
            echo 'Candidate runtime logs contain sharp/function invocation failure'
            exit 1
          fi
          echo "RUNTIME_LOG_QUERY_EXIT=$logs_exit"
          echo 'SHARP_RUNTIME=PASS'
          rm -f "$logs"

      - name: Final Canonical unchanged check
        shell: bash
        run: |
          set -euo pipefail
          canonical_json=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >"$canonical_json"
          node - "$canonical_json" <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          const match = raw.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('final canonical inspect JSON missing');
          const canonical = JSON.parse(match[0]);
          if (canonical.id !== process.env.EXPECTED_CANONICAL_DEPLOYMENT_ID) throw new Error(`canonical changed unexpectedly: ${canonical.id}`);
          console.log(`CANONICAL_PROMOTION=NOT_STARTED`);
          console.log(`CURRENT_PRODUCTION_DEPLOYMENT=${canonical.id}`);
          console.log('CANONICAL_UNCHANGED_FINAL=PASS');
          NODE
          rm -f "$canonical_json"

      - name: Publish preview visual witness checkpoint
        env:
          DEPLOYMENT_ID: ${{ steps.staged.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.staged.outputs.deployment_url }}
        run: |
          {
            echo '### WAVE 3 Preview visual witness stage-only checkpoint'
            echo "APPLICATION_SHA=$TARGET_SHA"
            echo "APPLICATION_TREE=$EXPECTED_TREE"
            echo "PREVIEW_VISUAL_DEPLOYMENT=$DEPLOYMENT_ID"
            echo "PREVIEW_VISUAL_URL=$DEPLOYMENT_URL"
            echo 'PREVIEW_HEALTH=PASS'
            echo 'PREVIEW_READY=PASS'
            echo 'PREVIEW_AUTH_FUNCTION_RUNTIME=PASS'
            echo 'SHARP_RUNTIME=PASS'
            echo 'ROOT_VERIFY=PASS'
            echo 'LINUX_ARTIFACT_VERIFY=PASS'
            echo 'PREVIEW_VERCEL_ENV=preview'
            echo 'PREVIEW_CORS_ORIGIN_GATE=PASS'
            echo 'ARTIFACT_EQUIVALENCE=PASS'
            echo 'FRONTEND_JS_EQUIVALENCE=PASS'
            echo 'FRONTEND_CSS_EQUIVALENCE=PASS'
            echo 'CANONICAL_PROMOTION=NOT_STARTED'
            echo "CURRENT_PRODUCTION_SHA=$EXPECTED_CANONICAL_SHA"
            echo "CURRENT_PRODUCTION_DEPLOYMENT=$EXPECTED_CANONICAL_DEPLOYMENT_ID"
            echo "ROLLBACK_DEPLOYMENT=$ROLLBACK_DEPLOYMENT_ID"
            echo 'DB_CHANGE=NONE'
            echo 'API_CONTRACT_CHANGE=NONE'
            echo 'ATTENDANCE_SECURITY_CHANGE=NONE'
          } >> "$GITHUB_STEP_SUMMARY"
