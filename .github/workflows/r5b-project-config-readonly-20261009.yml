name: R5-B Owner Protected Project Configuration (GET Only)

# Trusted default-branch-only workflow. No PR checkout or Production mutation.
on:
  issue_comment:
    types: [created]

permissions: {}

concurrency:
  group: r5b-owner-project-config-readonly-20261009
  cancel-in-progress: false

jobs:
  owner-guard:
    if: >-
      github.repository == 'godzillazzz/SMS-v3' &&
      github.ref == 'refs/heads/main' &&
      github.event_name == 'issue_comment' &&
      github.event.action == 'created' &&
      github.event.issue.number == 551 &&
      github.event.issue.pull_request == null &&
      github.event.comment.user.login == 'godzillazzz' &&
      github.event.sender.login == 'godzillazzz' &&
      github.event.comment.author_association == 'OWNER' &&
      startsWith(github.event.comment.body, '/sms-v3-r5b-project-config-readonly-20261009 ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require exact authenticated Owner request
        shell: bash
        env:
          EXPECTED_COMMAND: '/sms-v3-r5b-project-config-readonly-20261009 77641a2657aa4fd05276afe645dd32648f5cc56b prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s team_nemCExHbZ8EAhSgsvefHPAEz'
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const fs = require('node:fs');
          const ev = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const expectedOwnerId = 279642101;
          const ok =
            process.env.GITHUB_REPOSITORY === 'godzillazzz/SMS-v3' &&
            process.env.GITHUB_REF === 'refs/heads/main' &&
            ev.action === 'created' &&
            ev.issue?.number === 551 &&
            ev.issue?.state === 'open' &&
            !ev.issue?.pull_request &&
            ev.sender?.id === expectedOwnerId &&
            ev.sender?.login === 'godzillazzz' &&
            ev.comment?.user?.id === expectedOwnerId &&
            ev.comment?.user?.login === 'godzillazzz' &&
            ev.comment?.author_association === 'OWNER' &&
            ev.comment?.body === process.env.EXPECTED_COMMAND;
          if (!ok) {
            console.error('R5B_OWNER_CONFIG_REQUEST=REJECTED');
            process.exit(1);
          }
          console.log('R5B_OWNER_CONFIG_REQUEST=PASS');
          console.log('R5B_PRODUCTION_DEPLOYMENT=NOT_AUTHORIZED');
          NODE

  protected-config-readonly:
    needs: owner-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production-sms-v3-staging
    steps:
      - name: Read exact Vercel project; require explicit current boolean false
        shell: bash
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const teamId = 'team_nemCExHbZ8EAhSgsvefHPAEz';
          const projectId = 'prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s';
          const fail = code => {
            console.error('R5B_CURRENT_PROJECT_CONFIG=' + code);
            process.exit(1);
          };
          (async () => {
            if (!process.env.VERCEL_TOKEN) fail('BLOCKED_TOKEN_NOT_AVAILABLE');
            const endpoint = 'https://api.vercel.com/v9/projects/' +
              encodeURIComponent(projectId) + '?teamId=' + encodeURIComponent(teamId);
            let response;
            try {
              response = await fetch(endpoint, {
                method: 'GET',
                headers: {
                  Authorization: 'Bearer ' + process.env.VERCEL_TOKEN,
                  Accept: 'application/json'
                },
                redirect: 'manual',
                signal: AbortSignal.timeout(15000)
              });
            } catch {
              fail('BLOCKED_API_READ_ERROR');
            }
            if (response.status !== 200) fail('BLOCKED_API_NOT_200');
            let project;
            try {
              project = await response.json();
            } catch {
              fail('BLOCKED_INVALID_RESPONSE');
            }
            if (project?.id !== projectId) fail('BLOCKED_PROJECT_ID_MISMATCH');
            if (project?.accountId && project.accountId !== teamId) {
              fail('BLOCKED_TEAM_ID_MISMATCH');
            }
            if (typeof project.autoAssignCustomDomains !== 'boolean') {
              fail('CONFIG_UNVERIFIED_STOP');
            }
            if (project.autoAssignCustomDomains !== false) {
              fail('CONFIG_UNVERIFIED_STOP');
            }
            console.log('R5B_PROJECT_ID_VERIFIED=PASS');
            console.log('R5B_CURRENT_PROJECT_CONFIG=CONFIG_VERIFIED_PASS');
            console.log('R5B_AUTO_ASSIGN_CUSTOM_DOMAINS=false');
            console.log('R5B_PRODUCTION_DEPLOYMENT=NOT_EXECUTED');
          })().catch(() => fail('BLOCKED_UNEXPECTED_ERROR'));
          NODE
