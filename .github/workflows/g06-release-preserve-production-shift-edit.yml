name: G06 Release Preserve Current Production Shift Edit

on:
  push:
    branches:
      - release/g06-production-candidate-20260826

permissions:
  contents: write

concurrency:
  group: g06-release-preserve-current-production
  cancel-in-progress: false

jobs:
  preserve-current-production:
    if: ${{ github.event.head_commit.message == 'chore(release): stage G06 production compatibility helper' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/g06-production-candidate-20260826
          fetch-depth: 0
      - name: Verify immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8588838099b17f122307708e323e358d4b981d94"
          git cat-file -e "1b25c9631526c44ad3f01b341f7b94f5f6941b12^{commit}"
          test -z "$(git status --porcelain)"
      - name: Cherry-pick current Production-only shift edit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "sms-g06-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git cherry-pick -X theirs 1b25c9631526c44ad3f01b341f7b94f5f6941b12
          git rm .github/workflows/g06-release-preserve-production-shift-edit.yml
      - name: Verify compatibility diff allowlist
        shell: bash
        run: |
          set -euo pipefail
          allowed=$(mktemp)
          actual=$(mktemp)
          trap 'rm -f "$allowed" "$actual"' EXIT
          cat >"$allowed" <<'EOF'
          frontend/src/api.test.ts
          frontend/src/api.ts
          frontend/src/main.tsx
          frontend/src/shift-type-edit.test.ts
          frontend/src/ux03-data-surfaces.test.ts
          frontend/src/ux04-auth-experience.test.ts
          frontend/src/ux05-registration-review-workbench.test.ts
          frontend/src/ux06-personnel-access-experience.test.ts
          frontend/src/vf02-visual-fidelity.test.ts
          frontend/src/vf03-pastel-visual-fidelity.test.ts
          frontend/src/vf04-mockup-lock.test.ts
          frontend/src/vf05-final-fidelity-closure.test.ts
          frontend/src/vf06-final-visual-fidelity.test.ts
          frontend/src/vf07-final-visual-lock.test.ts
          frontend/src/vf071-owner-brand-fix.test.ts
          src/routes/shifts.routes.js
          src/services/shift.service.js
          EOF
          git diff --name-only 8588838099b17f122307708e323e358d4b981d94 | sort -u >"$actual"
          unexpected=$(comm -13 <(sort -u "$allowed") "$actual" || true)
          if [ -n "$unexpected" ]; then
            echo "Unexpected compatibility files:" >&2
            echo "$unexpected" >&2
            exit 1
          fi
          for required in frontend/src/api.ts frontend/src/main.tsx src/routes/shifts.routes.js src/services/shift.service.js; do
            grep -Fxq "$required" "$actual"
          done
          git diff --check 8588838099b17f122307708e323e358d4b981d94
      - name: Finalize compatibility commit and push candidate
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit --amend --no-edit
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/release/g06-production-candidate-20260826
