name: ONE-TIME Approval Center V1 exact canonical promotion

on:
  push:
    branches:
      - fix/serverless-database-reliability
    paths:
      - .github/workflows/one-time-approval-center-v1-promote-exact-832a.yml

permissions:
  contents: read

concurrency:
  group: sms-v3-production-promote-approval-center-v1-832a
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_PRE_PROMOTION_CANONICAL_ID: dpl_2QU3VFRvem5KcpmMdaQhNYuNR6Ev
  EXPECTED_STAGED_DEPLOYMENT_ID: dpl_AQqnLHg7R97BAEsAzLjYVwRhZfo9
  EXPECTED_SHA: 832aafec960467e4c023e9f9f386a6e0e07cbf94
  EXPECTED_TREE: d77cdb5b47c66143cd0dbfc93c84e9bd14f1f401
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  promote-exact-approval-center:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Verify Environment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          echo 'ENVIRONMENT_CREDENTIAL_GATE=PASS'

      - name: Checkout exact approved Candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EXPECTED_SHA }}
          fetch-depth: 0

      - name: Validate exact approved Candidate source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          echo "APPROVED_SHA=$EXPECTED_SHA"
          echo "APPROVED_TREE=$EXPECTED_TREE"

      - name: Validate exact staged promotion target
        shell: bash
        run: |
          set -euo pipefail
          staged_json=$(mktemp)
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$EXPECTED_STAGED_DEPLOYMENT_ID?teamId=$EXPECTED_ORG_ID" > "$staged_json"
          node - "$staged_json" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const projectId = data.project?.id || data.projectId || null;
          const projectName = data.project?.name || data.name || null;
          const sha = data.meta?.githubCommitSha || data.gitSource?.sha || null;
          const state = data.readyState || data.state;
          const fail = (message) => { console.error(message); process.exit(1); };
          if (data.id !== process.env.EXPECTED_STAGED_DEPLOYMENT_ID) fail('deployment id mismatch');
          if (projectId !== process.env.EXPECTED_PROJECT_ID) fail('project id mismatch');
          if (projectName !== process.env.EXPECTED_PROJECT_NAME) fail('project name mismatch');
          if (data.target !== 'production') fail('target is not production');
          if (state !== 'READY') fail('deployment is not READY');
          if (sha !== process.env.EXPECTED_SHA) fail(`SHA mismatch: ${sha}`);
          if (Array.isArray(data.alias) && data.alias.length !== 0) fail('staged deployment unexpectedly has aliases before promotion');
          console.log(`PROMOTION_TARGET=${data.id}`);
          console.log(`PROMOTION_SHA=${sha}`);
          console.log('STAGED_PROMOTION_TARGET=PASS');
          NODE
          rm -f "$staged_json"

      - name: Prove Canonical unchanged immediately before promotion
        shell: bash
        run: |
          set -euo pipefail
          canonical_log=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" > "$canonical_log"
          node - "$canonical_log" <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          const match = raw.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('canonical inspect JSON missing');
          const data = JSON.parse(match[0]);
          if (data.id !== process.env.EXPECTED_PRE_PROMOTION_CANONICAL_ID) {
            throw new Error(`Canonical changed unexpectedly: ${data.id}`);
          }
          console.log(`PRE_PROMOTION_CANONICAL=${data.id}`);
          NODE
          rm -f "$canonical_log"

      - name: Verify current Canonical health before promotion
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl -fsS "$EXPECTED_CANONICAL_URL/api/v1/health")
          ready=$(curl -fsS "$EXPECTED_CANONICAL_URL/api/v1/ready")
          node - "$health" "$ready" <<'NODE'
          const [healthRaw, readyRaw] = process.argv.slice(2);
          const health = JSON.parse(healthRaw);
          const ready = JSON.parse(readyRaw);
          if (health.status !== 'ok') throw new Error('pre-promotion canonical health failed');
          if (ready.status !== 'ready' || ready.database !== 'ok') throw new Error('pre-promotion canonical readiness/database failed');
          console.log('PRE_PROMOTION_CANONICAL_HEALTH=PASS');
          console.log('PRE_PROMOTION_CANONICAL_READY_DATABASE=PASS');
          NODE

      - name: Promote exact existing staged deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@"$VERCEL_CLI_VERSION" promote "$EXPECTED_STAGED_DEPLOYMENT_ID" --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" --yes
          echo 'PROMOTE_EXISTING_STAGED=EXECUTED'

      - name: Verify Canonical exact deployment identity
        shell: bash
        run: |
          set -euo pipefail
          canonical_log=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" > "$canonical_log"
          node - "$canonical_log" <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          const match = raw.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('canonical inspect JSON missing');
          const data = JSON.parse(match[0]);
          const sha = data.meta?.githubCommitSha || data.gitSource?.sha || null;
          const projectId = data.project?.id || data.projectId || null;
          const state = data.readyState || data.state;
          if (data.id !== process.env.EXPECTED_STAGED_DEPLOYMENT_ID) throw new Error(`Canonical deployment mismatch: ${data.id}`);
          if (projectId !== process.env.EXPECTED_PROJECT_ID) throw new Error('Canonical project mismatch');
          if (data.target !== 'production') throw new Error('Canonical target mismatch');
          if (state !== 'READY') throw new Error('Canonical deployment not READY');
          if (sha !== process.env.EXPECTED_SHA) throw new Error(`Canonical SHA mismatch: ${sha}`);
          console.log(`CANONICAL_DEPLOYMENT=${data.id}`);
          console.log(`CANONICAL_SHA=${sha}`);
          console.log('CANONICAL_EXACT_IDENTITY=PASS');
          NODE
          rm -f "$canonical_log"

      - name: Verify Canonical health readiness and database
        shell: bash
        run: |
          set -euo pipefail
          health=$(curl -fsS "$EXPECTED_CANONICAL_URL/api/v1/health")
          ready=$(curl -fsS "$EXPECTED_CANONICAL_URL/api/v1/ready")
          node - "$health" "$ready" <<'NODE'
          const [healthRaw, readyRaw] = process.argv.slice(2);
          const health = JSON.parse(healthRaw);
          const ready = JSON.parse(readyRaw);
          if (health.status !== 'ok') throw new Error('canonical health failed');
          if (ready.status !== 'ready' || ready.database !== 'ok') throw new Error('canonical readiness/database failed');
          console.log('CANONICAL_HEALTH=PASS');
          console.log('CANONICAL_READY_DATABASE=PASS');
          NODE

      - name: Approval Center protected boundary on Canonical
        shell: bash
        run: |
          set -euo pipefail
          body=$(curl -fsS "$EXPECTED_CANONICAL_URL/api/v1/approval-center" || true)
          node - "$body" <<'NODE'
          const raw = process.argv[2] || '';
          let body;
          try { body = JSON.parse(raw); } catch { throw new Error('Approval Center unauth response is not JSON'); }
          if (body?.error !== 'Authentication required.') throw new Error(`unexpected Approval Center unauth response: ${raw.slice(0, 300)}`);
          if (body?.data || body?.summary) throw new Error('Approval Center leaked protected queue data');
          console.log('CANONICAL_APPROVAL_CENTER_UNAUTH_BOUNDARY=PASS');
          NODE

      - name: Non-destructive Canonical smoke
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          curl -fsS "$EXPECTED_CANONICAL_URL/" > "$body"
          test -s "$body"
          grep -Eiq '<!doctype html|<html' "$body"
          rm -f "$body"
          echo 'CANONICAL_NON_DESTRUCTIVE_SMOKE=PASS'

      - name: Publish promotion checkpoint
        run: |
          {
            echo '### Approval Center V1 exact canonical promotion'
            echo "Deployment: $EXPECTED_STAGED_DEPLOYMENT_ID"
            echo "Exact Application SHA: $EXPECTED_SHA"
            echo "Exact Application tree: $EXPECTED_TREE"
            echo "Canonical: $EXPECTED_CANONICAL_URL"
            echo 'Rebuild/redeploy during promotion: NONE'
            echo 'Database migration during promotion: NONE'
            echo 'Canonical health/readiness/database: PASS'
            echo 'Approval Center protected boundary: PASS'
            echo 'Non-destructive smoke: PASS'
            echo 'Rollback pointer: UNCHANGED'
            echo 'G07: UNTOUCHED'
          } >> "$GITHUB_STEP_SUMMARY"
