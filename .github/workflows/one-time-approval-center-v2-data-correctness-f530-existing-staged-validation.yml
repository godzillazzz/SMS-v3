name: ONE-TIME Approval Center V2 data correctness f530 existing staged validation

on:
  push:
    branches:
      - fix/serverless-database-reliability
    paths:
      - .github/workflows/one-time-approval-center-v2-data-correctness-f530-existing-staged-validation.yml

permissions:
  contents: read

concurrency:
  group: sms-v3-approval-center-v2-data-correctness-f530-existing-staged-validation
  cancel-in-progress: false

env:
  TARGET_SHA: f530efa7a913dea5fa47d95a3e148e78651912a8
  EXPECTED_TREE: 5d6bb625454d644e06345af771787a8418b9d0e9
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_CANONICAL_DEPLOYMENT_ID: dpl_3tx9ugTjFmAwvzW83drvGWVj2Laj
  EXPECTED_CANONICAL_SHA: 74d394ea125b322635f488d511609ebdf7b9b40d
  STAGED_DEPLOYMENT_ID: dpl_E7zAtUnE4fr2aCpgmAWFqzR8sTy5
  STAGED_DEPLOYMENT_URL: https://sms-v3-staging-2bkdam8ba-godzillazz.vercel.app
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  validate-existing-staged:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

    steps:
      - name: Verify Environment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          echo "ENVIRONMENT_CREDENTIAL_GATE=PASS"

      - name: Checkout exact V2 Candidate SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          fetch-depth: 0

      - name: Validate exact Candidate source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$EXPECTED_TREE"
          test -z "$(git status --porcelain)"
          echo "CANDIDATE_SHA=$TARGET_SHA"
          echo "CANDIDATE_TREE=$EXPECTED_TREE"

      - name: Inspect exact existing staged deployment
        shell: bash
        run: |
          set -euo pipefail
          staged_json=$(mktemp)
          curl -fsS -H "Authorization: Bearer $VERCEL_TOKEN" "https://api.vercel.com/v13/deployments/$STAGED_DEPLOYMENT_ID?teamId=$EXPECTED_ORG_ID" > "$staged_json"
          node - "$staged_json" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const projectId = data.project?.id || data.projectId || null;
          const projectName = data.project?.name || data.name || null;
          const sha = data.meta?.githubCommitSha || data.gitSource?.sha || null;
          const state = data.readyState || data.state;
          if (data.id !== process.env.STAGED_DEPLOYMENT_ID) throw new Error('deployment id mismatch');
          if (projectId !== process.env.EXPECTED_PROJECT_ID) throw new Error('project id mismatch');
          if (projectName !== process.env.EXPECTED_PROJECT_NAME) throw new Error('project name mismatch');
          if (data.target !== 'production') throw new Error('target is not production');
          if (state !== 'READY') throw new Error('deployment is not READY');
          if (sha !== process.env.TARGET_SHA) throw new Error(`staged SHA mismatch: ${sha}`);
          if (Array.isArray(data.alias) && data.alias.length !== 0) throw new Error('staged deployment unexpectedly has aliases');
          console.log(`STAGED_DEPLOYMENT_ID=${data.id}`);
          console.log(`STAGED_SHA=${sha}`);
          console.log('STAGED_IDENTITY=PASS');
          NODE
          rm -f "$staged_json"

      - name: Prove Canonical exact baseline unchanged
        shell: bash
        run: |
          set -euo pipefail
          canonical_json=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" > "$canonical_json"
          node - "$canonical_json" <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          const match = raw.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('canonical inspect JSON missing');
          const data = JSON.parse(match[0]);
          const sha = data.meta?.githubCommitSha || data.gitSource?.sha || null;
          if (data.id !== process.env.EXPECTED_CANONICAL_DEPLOYMENT_ID) throw new Error(`Canonical changed: ${data.id}`);
          if (sha && sha !== process.env.EXPECTED_CANONICAL_SHA) throw new Error(`Canonical SHA changed: ${sha}`);
          console.log(`CANONICAL_UNCHANGED=${data.id}`);
          NODE
          rm -f "$canonical_json"

      - name: Validate staged root health readiness and protected boundary
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          root=$(mktemp)
          health=$(mktemp)
          ready=$(mktemp)
          approval=$(mktemp)
          root_code=$(curl -sS -o "$root" -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$STAGED_DEPLOYMENT_URL/")
          health_code=$(curl -sS -o "$health" -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$STAGED_DEPLOYMENT_URL/api/v1/health")
          ready_code=$(curl -sS -o "$ready" -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$STAGED_DEPLOYMENT_URL/api/v1/ready")
          approval_code=$(curl -sS -o "$approval" -w "%{http_code}" -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$STAGED_DEPLOYMENT_URL/api/v1/approval-center")
          node - "$root" "$health" "$ready" "$approval" "$root_code" "$health_code" "$ready_code" "$approval_code" <<'NODE'
          const fs = require('node:fs');
          const [rootFile, healthFile, readyFile, approvalFile, rootCode, healthCode, readyCode, approvalCode] = process.argv.slice(2);
          const root = fs.readFileSync(rootFile, 'utf8');
          const health = JSON.parse(fs.readFileSync(healthFile, 'utf8'));
          const ready = JSON.parse(fs.readFileSync(readyFile, 'utf8'));
          const approval = JSON.parse(fs.readFileSync(approvalFile, 'utf8'));
          if (rootCode !== '200' || !/<html|<!doctype html/i.test(root)) throw new Error(`root smoke failed: ${rootCode}`);
          if (healthCode !== '200' || health.status !== 'ok') throw new Error(`health failed: ${healthCode}`);
          if (readyCode !== '200' || ready.status !== 'ready' || ready.database !== 'ok') throw new Error(`ready failed: ${readyCode}`);
          if (approvalCode !== '401' || approval?.error !== 'Authentication required.') throw new Error(`approval boundary failed: ${approvalCode}`);
          if (approval?.data || approval?.summary) throw new Error('Approval Center leaked protected queue data');
          console.log('STAGED_ROOT_SMOKE=PASS');
          console.log('STAGED_HEALTH=PASS');
          console.log('STAGED_READY_DATABASE=PASS');
          console.log('APPROVAL_CENTER_UNAUTH_401=PASS');
          NODE
          rm -f "$root" "$health" "$ready" "$approval"

      - name: Final Canonical unchanged check
        shell: bash
        run: |
          set -euo pipefail
          canonical_json=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" > "$canonical_json"
          node - "$canonical_json" <<'NODE'
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          const match = raw.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('canonical inspect JSON missing');
          const data = JSON.parse(match[0]);
          if (data.id !== process.env.EXPECTED_CANONICAL_DEPLOYMENT_ID) throw new Error(`Canonical changed: ${data.id}`);
          console.log(`FINAL_CANONICAL_UNCHANGED=${data.id}`);
          NODE
          rm -f "$canonical_json"

      - name: Publish validation checkpoint
        run: |
          {
            echo '### Approval Center V2 data correctness f530 existing staged Production validation'
            echo "Exact Candidate SHA: $TARGET_SHA"
            echo "Exact Candidate tree: $EXPECTED_TREE"
            echo "Staged deployment: $STAGED_DEPLOYMENT_ID"
            echo "Staged URL: $STAGED_DEPLOYMENT_URL"
            echo 'Target: production'
            echo 'Domain aliases: none'
            echo "Canonical remains: $EXPECTED_CANONICAL_DEPLOYMENT_ID"
            echo 'Health/readiness/database: PASS'
            echo 'Approval Center unauth boundary: PASS'
            echo 'Non-destructive smoke: PASS'
            echo 'Database migration in validation: NOT PERFORMED'
            echo 'Deployment creation in validation: NOT PERFORMED'
            echo 'Promotion: NOT PERFORMED'
          } >> "$GITHUB_STEP_SUMMARY"
