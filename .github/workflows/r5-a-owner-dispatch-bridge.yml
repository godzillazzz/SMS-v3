name: R5-A Owner-Only Dispatch Bridge

# The bridge lives on the default branch because GitHub issue_comment events
# use the default-branch workflow definition. It does NOT deploy applications.
# It only dispatches the existing protected workflow at the exact Control SHA.
on:
  issue_comment:
    types: [created]

permissions:
  actions: write
  contents: read

concurrency:
  group: sms-v3-r5a-dispatch-bridge
  cancel-in-progress: false

jobs:
  dispatch-exact-r5-a:
    if: >-
      github.repository == 'godzillazzz/SMS-v3' &&
      github.event.issue.number == 545 &&
      github.event.issue.pull_request != null &&
      github.event.comment.user.login == 'godzillazzz' &&
      github.event.comment.body == '/sms-v3-dispatch-r5-a 0296ed78cc47895e49d721557c95bb9f30c88ac4 51c5c828689ce543067c687e204eba7918577bb9'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate exact branch and approved manifest before dispatch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_CONTROL_SHA: 0296ed78cc47895e49d721557c95bb9f30c88ac4
          EXPECTED_APP_SHA: 51c5c828689ce543067c687e204eba7918577bb9
          EXPECTED_ROLLBACK: dpl_J8ss5NqiDZu33QpAc8Bfrt9DvX1x
          SOURCE_BRANCH: fix/serverless-database-reliability
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'godzillazzz/SMS-v3'
          actual_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$SOURCE_BRANCH" --jq '.object.sha')
          test "$actual_sha" = "$EXPECTED_CONTROL_SHA"

          gh api "repos/$GITHUB_REPOSITORY/contents/.github/releases/approved-production.json?ref=$SOURCE_BRANCH" \
            --jq '.content' | base64 --decode > /tmp/approved-production.json
          jq -e --arg sha "$EXPECTED_APP_SHA" --arg rollback "$EXPECTED_ROLLBACK" \
            --arg branch "$SOURCE_BRANCH" \
            '.release_batch_id == "R5-A" and .commit_sha == $sha and .rollback_deployment_id == $rollback and .source_branch == $branch and .run_migrations == false' \
            /tmp/approved-production.json >/dev/null

          # Fail closed on ANY prior manual-dispatch attempt for this exact
          # control SHA; never queue concurrent/repeated Production releases.
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-approved-production-v2.yml/runs?event=workflow_dispatch&per_page=100" > /tmp/release-runs.json
          if jq -e --arg sha "$EXPECTED_CONTROL_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha)] | length > 0' \
            /tmp/release-runs.json >/dev/null; then
            echo 'A Production workflow dispatch for this Control SHA already exists. Refusing duplicate.'
            exit 1
          fi

          echo 'R5-A owner comment, branch SHA, manifest, and duplicate gate all verified.'
          gh api -X POST "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-approved-production-v2.yml/dispatches" \
            -f ref="$SOURCE_BRANCH"
          echo "Dispatch accepted. Protected Production review remains mandatory."
          echo "Official workflow: https://github.com/$GITHUB_REPOSITORY/actions/workflows/deploy-approved-production-v2.yml" >> "$GITHUB_STEP_SUMMARY"
