name: ONE-TIME G06 Fresh Production Readiness 20260930

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact canonical Production application SHA
        required: true
        type: string
      employee_code:
        description: Exact controlled G06 UAT employee code
        required: true
        type: string
      target_date:
        description: Bangkok-local target work date YYYY-MM-DD
        required: true
        type: string
      confirm_environment:
        description: Type production
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  readiness:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      G06_EMPLOYEE_CODE: ${{ inputs.employee_code }}
      G06_TARGET_DATE: ${{ inputs.target_date }}
    steps:
      - name: Validate exact read-only target
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_environment }}" = production
          test "$G06_EMPLOYEE_CODE" = "UAT-ST-20260902"
          [[ "$G06_TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          echo "READ_ONLY_SCOPE=PASS"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact-source dependencies
        run: |
          npm ci
          npx prisma generate

      - name: Create ephemeral read-only G06 probe
        shell: bash
        run: |
          cat > /tmp/g06-fresh-readiness.js <<'NODE'
          'use strict';

          const fs = require('fs');
          const { PrismaClient } = require('@prisma/client');
          const { createOnboardingReadinessService } = require(process.cwd() + '/src/services/onboarding-readiness.service');
          const { createSecuritySiteAuthorityService } = require(process.cwd() + '/src/services/security-site-authority.service');

          const prisma = new PrismaClient();
          const code = String(process.env.G06_EMPLOYEE_CODE || '').trim();
          const target = String(process.env.G06_TARGET_DATE || '').trim();
          const day = new Date(target + 'T00:00:00.000Z');
          const nextDay = new Date(day.getTime() + 86400000);
          const iso = (v) => v ? new Date(v).toISOString() : null;
          const date = (v) => v ? new Date(v).toISOString().slice(0, 10) : null;
          const monthStart = (v) => {
            const d = new Date(v);
            return new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1));
          };

          (async () => {
            if (!process.env.DATABASE_URL) throw new Error('DATABASE_URL_MISSING');
            if (code !== 'UAT-ST-20260902') throw new Error('EMPLOYEE_CODE_SCOPE_MISMATCH');
            if (!/^\d{4}-\d{2}-\d{2}$/.test(target) || Number.isNaN(day.getTime())) throw new Error('TARGET_DATE_INVALID');

            const employee = await prisma.employee.findUnique({
              where: { employeeCode: code },
              select: {
                id: true,
                employeeCode: true,
                department: true,
                jobTitle: true,
                isActive: true,
                deletedAt: true,
                user: { select: { role: true, isActive: true, accountStatus: true, employeeId: true } },
                referencePhotos: { where: { status: 'ACTIVE' }, select: { id: true } },
                attendanceDevices: {
                  where: { status: 'ACTIVE' },
                  select: { proofVerifiedAt: true, displayName: true }
                }
              }
            });
            if (!employee) throw new Error('EMPLOYEE_NOT_FOUND');

            const [assignment, nextAssignment, leaves] = await Promise.all([
              prisma.shiftAssignment.findFirst({
                where: { employeeId: employee.id, workDate: { gte: day, lt: nextDay } },
                orderBy: [{ createdAt: 'asc' }],
                include: { shiftType: true, securitySite: true }
              }),
              prisma.shiftAssignment.findFirst({
                where: { employeeId: employee.id, workDate: { gte: day } },
                orderBy: [{ workDate: 'asc' }, { createdAt: 'asc' }],
                include: { shiftType: true, securitySite: true }
              }),
              prisma.leaveRequest.findMany({
                where: { employeeId: employee.id, startDate: { lte: day }, endDate: { gte: day } },
                select: { status: true, startDate: true, endDate: true }
              })
            ]);

            const chosen = assignment || nextAssignment;
            const approval = chosen ? await prisma.scheduleApproval.findFirst({
              where: { month: monthStart(chosen.workDate) },
              orderBy: [{ revision: 'desc' }, { updatedAt: 'desc' }],
              select: { status: true, revision: true, month: true }
            }) : null;

            let site = null;
            let siteError = null;
            if (chosen) {
              try {
                site = await createSecuritySiteAuthorityService({ prisma }).resolve({ assignment: chosen, employee });
              } catch (error) {
                siteError = { code: error?.details?.code || null, message: error?.message || 'SITE_RESOLUTION_FAILED' };
              }
            }

            const targetSession = assignment ? await prisma.attendanceSession.findUnique({
              where: { shiftAssignmentId: assignment.id },
              select: {
                state: true,
                events: {
                  select: { eventType: true, provenance: true, effectiveEventAt: true },
                  orderBy: { effectiveEventAt: 'asc' }
                }
              }
            }) : null;

            const onboarding = await createOnboardingReadinessService({ prisma }).getEmployeeReadiness({ employeeId: employee.id });

            const source = [
              fs.readFileSync(process.cwd() + '/src/routes/attendance.routes.js', 'utf8'),
              fs.readFileSync(process.cwd() + '/src/services/attendance-event.service.js', 'utf8'),
              fs.readFileSync(process.cwd() + '/frontend/src/pages/attendance/AttendancePage.tsx', 'utf8')
            ].join('\n');

            const attendanceApiEnabled = process.env.ATTENDANCE_API_PRODUCTION_ENABLED === 'true';
            const faceInProcessEnabled = process.env.FACE_VERIFICATION_IN_PROCESS_ENABLED === 'true';
            const faceSelfHostedConfigured =
              process.env.FACE_VERIFICATION_SELF_HOSTED_API_ENABLED === 'true' &&
              Boolean(String(process.env.FACE_VERIFIER_URL || '').trim()) &&
              String(process.env.FACE_VERIFIER_SHARED_TOKEN || '').trim().length >= 16;
            const biometricRuntimeEnabled = attendanceApiEnabled && (faceInProcessEnabled || faceSelfHostedConfigured);
            const gpsOnlyCommitPathPresent = /GPS_ONLY_UAT|gps-only/i.test(source);

            const activeLeaveOverlap = leaves.some((row) =>
              !['REJECTED', 'CANCELLED'].includes(String(row.status || '').toUpperCase())
            );
            const accountReady = Boolean(
              employee.user &&
              employee.user.employeeId === employee.id &&
              employee.user.isActive === true &&
              employee.user.accountStatus === 'ACTIVE'
            );
            const deviceReady =
              employee.attendanceDevices.length === 1 &&
              Boolean(employee.attendanceDevices[0]?.proofVerifiedAt);
            const scheduleReady = Boolean(
              assignment &&
              assignment.shiftType?.isActive === true &&
              approval?.status === 'APPROVED'
            );
            const siteReady = Boolean(site?.site?.isActive === true);
            const targetClean = !targetSession?.events?.length && !activeLeaveOverlap;

            console.log('G06_FRESH_READINESS_BEGIN');
            console.log(JSON.stringify({
              mode: 'READ_ONLY_G06_FRESH_PRODUCTION_READINESS',
              databaseMutationPerformed: false,
              checkedAt: new Date().toISOString(),
              targetDate: target,
              employee: {
                code: employee.employeeCode,
                active: employee.isActive === true && employee.deletedAt == null,
                department: employee.department,
                position: employee.jobTitle
              },
              account: {
                linked: Boolean(employee.user),
                linkedToSameEmployee: Boolean(employee.user && employee.user.employeeId === employee.id),
                role: employee.user?.role || null,
                active: employee.user?.isActive === true,
                status: employee.user?.accountStatus || null
              },
              faceReference: {
                activeCount: employee.referencePhotos.length,
                treatedAsInformationalForOwnerGeofenceOnlyExperiment: true
              },
              attendanceDevice: {
                activeCount: employee.attendanceDevices.length,
                proofVerifiedCount: employee.attendanceDevices.filter((row) => Boolean(row.proofVerifiedAt)).length
              },
              targetAssignment: assignment ? {
                workDate: date(assignment.workDate),
                shiftCode: assignment.shiftType?.code || null,
                shiftName: assignment.shiftType?.name || null,
                startTime: assignment.startTime || assignment.shiftType?.startTime || null,
                endTime: assignment.endTime || assignment.shiftType?.endTime || null,
                shiftActive: assignment.shiftType?.isActive ?? null,
                licenseStatus: assignment.licenseStatus || null,
                licenseOverride: assignment.licenseOverride === true
              } : null,
              nextAssignment: nextAssignment ? {
                workDate: date(nextAssignment.workDate),
                shiftCode: nextAssignment.shiftType?.code || null,
                shiftName: nextAssignment.shiftType?.name || null,
                startTime: nextAssignment.startTime || nextAssignment.shiftType?.startTime || null,
                endTime: nextAssignment.endTime || nextAssignment.shiftType?.endTime || null
              } : null,
              effectiveSite: site ? {
                code: site.site?.code || null,
                name: site.site?.name || null,
                active: site.site?.isActive === true,
                geofenceRadiusMeters: site.site?.geofenceRadiusMeters ?? null,
                authoritySource: site.source || null
              } : null,
              siteError,
              scheduleApproval: approval ? {
                month: date(approval.month),
                status: approval.status,
                revision: approval.revision
              } : null,
              targetDateLeaveOverlaps: leaves.map((row) => ({
                status: row.status,
                startDate: date(row.startDate),
                endDate: date(row.endDate)
              })),
              targetAttendance: targetSession ? {
                state: targetSession.state,
                eventCount: targetSession.events.length,
                events: targetSession.events.map((row) => ({
                  eventType: row.eventType,
                  provenance: row.provenance,
                  effectiveEventAt: iso(row.effectiveEventAt)
                }))
              } : { state: null, eventCount: 0, events: [] },
              onboardingReadiness: {
                status: onboarding.status,
                blockers: onboarding.blockers.map((row) => row.code)
              },
              runtime: {
                attendanceApiProductionEnabled: attendanceApiEnabled,
                faceInProcessEnabled,
                faceSelfHostedConfigured,
                biometricRuntimeEnabled,
                gpsOnlyCommitPathPresentInExactProductionSource: gpsOnlyCommitPathPresent
              },
              experimentReadiness: {
                accountReady,
                deviceReady,
                scheduleReady,
                siteReady,
                targetClean,
                geofenceOnlyCommitSupportedByExactProductionSource: gpsOnlyCommitPathPresent,
                readyToPhysicallyTestCurrentStandardFlow: accountReady && deviceReady && scheduleReady && siteReady && targetClean,
                expectedResultIfFaceRuntimeDisabledAndNoGpsOnlyCommitPath:
                  !biometricRuntimeEnabled && !gpsOnlyCommitPathPresent ? 'BLOCK_BEFORE_ATTENDANCE_EVENT' : 'NOT_DETERMINED_BY_THIS_PROBE'
              }
            }, null, 2));
            console.log('G06_FRESH_READINESS_END');
          })()
            .catch((error) => {
              console.error('G06_FRESH_READINESS_FAILED ' + (error?.message || String(error)));
              process.exitCode = 1;
            })
            .finally(async () => prisma.$disconnect());
          NODE

      - name: Run protected Production read-only readiness
        shell: bash
        run: |
          set -euo pipefail
          npx --yes "vercel@$VERCEL_CLI_VERSION" env run             -e production             --project "$VERCEL_PROJECT_ID"             --scope "$VERCEL_ORG_ID"             --token "$VERCEL_TOKEN"             --non-interactive             -- node /tmp/g06-fresh-readiness.js

      - name: Cleanup
        if: ${{ always() }}
        run: rm -f -- /tmp/g06-fresh-readiness.js
