name: Deploy Approved Production Manifest V2

on:
  push:
    branches:
      - fix/serverless-database-reliability
    paths:
      - .github/releases/approved-production.json
      - .github/workflows/deploy-approved-production-v2.yml
      - scripts/ci/verify-release-manifest.js
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: sms-v3-staging-production-v2
  cancel-in-progress: false

env:
  RELEASE_MANIFEST_PATH: .github/releases/approved-production.json
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_SOURCE_BRANCH: fix/serverless-database-reliability
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  prepare:
    name: Prepare exact approved release manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.manifest.outputs.release_id }}
      commit_sha: ${{ steps.manifest.outputs.commit_sha }}
      tree_sha: ${{ steps.manifest.outputs.tree_sha }}
      current_production_source_sha: ${{ steps.manifest.outputs.current_production_source_sha }}
      rollback_deployment_id: ${{ steps.manifest.outputs.rollback_deployment_id }}
      target_project_name: ${{ steps.manifest.outputs.target_project_name }}
      target_project_id: ${{ steps.manifest.outputs.target_project_id }}
      target_org_id: ${{ steps.manifest.outputs.target_org_id }}
      target_environment: ${{ steps.manifest.outputs.target_environment }}
      canonical_url: ${{ steps.manifest.outputs.canonical_url }}
      source_branch: ${{ steps.manifest.outputs.source_branch }}
      run_migrations: ${{ steps.manifest.outputs.run_migrations }}
      database_change_policy: ${{ steps.manifest.outputs.database_change_policy }}
      pre_applied_migration_manifest_path: ${{ steps.manifest.outputs.pre_applied_migration_manifest_path }}
      pre_applied_migration_evidence_run_id: ${{ steps.manifest.outputs.pre_applied_migration_evidence_run_id }}
      manifest_sha256: ${{ steps.hash.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate approved release manifest schema and fixed target identity
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest_output=$(mktemp)
          trap 'rm -f "$manifest_output"' EXIT
          node scripts/ci/verify-release-manifest.js "$RELEASE_MANIFEST_PATH" >"$manifest_output"
          grep -Fxq 'RELEASE_MANIFEST_GUARD=PASS' "$manifest_output"
          while IFS='=' read -r key value; do
            case "$key" in
              release_id|commit_sha|tree_sha|current_production_source_sha|rollback_deployment_id|target_project_name|target_project_id|target_org_id|target_environment|canonical_url|source_branch|run_migrations|database_change_policy|pre_applied_migration_manifest_path|pre_applied_migration_evidence_run_id)
                echo "$key=$value" >> "$GITHUB_OUTPUT"
                ;;
            esac
          done <"$manifest_output"

      - name: Validate exact source identity, branch ancestry, migration policy, and clean tree
        shell: bash
        env:
          TARGET_SHA: ${{ steps.manifest.outputs.commit_sha }}
          TARGET_TREE: ${{ steps.manifest.outputs.tree_sha }}
          CURRENT_PRODUCTION_SOURCE_SHA: ${{ steps.manifest.outputs.current_production_source_sha }}
          SOURCE_BRANCH: ${{ steps.manifest.outputs.source_branch }}
          RUN_MIGRATIONS: ${{ steps.manifest.outputs.run_migrations }}
          DATABASE_CHANGE_POLICY: ${{ steps.manifest.outputs.database_change_policy }}
          PRE_APPLIED_MIGRATION_MANIFEST_PATH: ${{ steps.manifest.outputs.pre_applied_migration_manifest_path }}
          PRE_APPLIED_MIGRATION_EVIDENCE_RUN_ID: ${{ steps.manifest.outputs.pre_applied_migration_evidence_run_id }}
          ROLLBACK_DEPLOYMENT_ID: ${{ steps.manifest.outputs.rollback_deployment_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_TREE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$CURRENT_PRODUCTION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$SOURCE_BRANCH" = "$EXPECTED_SOURCE_BRANCH"
          git fetch --no-tags origin "$SOURCE_BRANCH"
          git cat-file -e "${TARGET_SHA}^{commit}"
          git cat-file -e "${CURRENT_PRODUCTION_SOURCE_SHA}^{commit}"
          git merge-base --is-ancestor "$TARGET_SHA" "origin/$SOURCE_BRANCH"
          test "$(git rev-parse "${TARGET_SHA}^{tree}")" = "$TARGET_TREE"
          if [[ "$RUN_MIGRATIONS" != "false" ]]; then
            echo 'Production release workflow never executes migrations.'
            exit 1
          fi

          case "$DATABASE_CHANGE_POLICY" in
            NO_DATABASE_CHANGES)
              test -z "$PRE_APPLIED_MIGRATION_MANIFEST_PATH"
              test -z "$PRE_APPLIED_MIGRATION_EVIDENCE_RUN_ID"
              git diff --quiet "$CURRENT_PRODUCTION_SOURCE_SHA" "$TARGET_SHA" -- prisma/schema.prisma prisma/migrations
              ;;
            PRE_APPLIED_APPROVED_MIGRATION)
              test -n "$PRE_APPLIED_MIGRATION_MANIFEST_PATH"
              [[ "$PRE_APPLIED_MIGRATION_EVIDENCE_RUN_ID" =~ ^[0-9]+$ ]]
              test -f "$PRE_APPLIED_MIGRATION_MANIFEST_PATH"
              test -f scripts/ci/verify-approved-production-migration.js

              migration_guard=$(mktemp)
              node scripts/ci/verify-approved-production-migration.js "$PRE_APPLIED_MIGRATION_MANIFEST_PATH" >"$migration_guard"
              grep -Fxq 'PRODUCTION_MIGRATION_MANIFEST_GUARD=PASS' "$migration_guard"
              MIGRATION_ID=$(sed -n 's/^migration_id=//p' "$migration_guard")
              MIGRATION_SOURCE_SHA=$(sed -n 's/^source_commit_sha=//p' "$migration_guard")
              MIGRATION_SOURCE_TREE=$(sed -n 's/^source_tree_sha=//p' "$migration_guard")
              MIGRATION_PATH=$(sed -n 's/^migration_path=//p' "$migration_guard")
              POST_VERIFY_SCRIPT=$(sed -n 's/^post_verify_script=//p' "$migration_guard")
              MIGRATION_CURRENT_PRODUCTION_DEPLOYMENT_ID=$(sed -n 's/^current_production_deployment_id=//p' "$migration_guard")
              MIGRATION_CURRENT_PRODUCTION_APPLICATION_SHA=$(sed -n 's/^current_production_application_sha=//p' "$migration_guard")
              PRISMA_SCHEMA_CHANGED=$(sed -n 's/^prisma_schema_changed=//p' "$migration_guard")
              test -n "$MIGRATION_ID"
              case "$PRISMA_SCHEMA_CHANGED" in
                true|false) ;;
                *) echo 'Invalid prisma_schema_changed migration metadata.'; exit 1 ;;
              esac
              test "$MIGRATION_CURRENT_PRODUCTION_DEPLOYMENT_ID" = "$ROLLBACK_DEPLOYMENT_ID"
              test "$MIGRATION_CURRENT_PRODUCTION_APPLICATION_SHA" = "$CURRENT_PRODUCTION_SOURCE_SHA"
              [[ "$MIGRATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              [[ "$MIGRATION_SOURCE_TREE" =~ ^[0-9a-f]{40}$ ]]
              test -n "$MIGRATION_PATH"
              test -n "$POST_VERIFY_SCRIPT"

              git cat-file -e "${MIGRATION_SOURCE_SHA}^{commit}"
              test "$(git rev-parse "${MIGRATION_SOURCE_SHA}^{tree}")" = "$MIGRATION_SOURCE_TREE"
              git merge-base --is-ancestor "$CURRENT_PRODUCTION_SOURCE_SHA" "$MIGRATION_SOURCE_SHA"
              git merge-base --is-ancestor "$MIGRATION_SOURCE_SHA" "$TARGET_SHA"
              git diff --quiet "$MIGRATION_SOURCE_SHA" "$TARGET_SHA" -- prisma/schema.prisma prisma/migrations
              git diff --quiet "$MIGRATION_SOURCE_SHA" "$GITHUB_SHA" -- prisma/schema.prisma "$MIGRATION_PATH"

              changed_prisma=$(git diff --name-only "$CURRENT_PRODUCTION_SOURCE_SHA" "$MIGRATION_SOURCE_SHA" -- prisma/schema.prisma prisma/migrations | sort)
              if [[ "$PRISMA_SCHEMA_CHANGED" = "true" ]]; then
                expected_prisma=$(printf '%s\n%s\n' "$MIGRATION_PATH" 'prisma/schema.prisma' | sort)
              else
                expected_prisma=$(printf '%s\n' "$MIGRATION_PATH" | sort)
              fi
              test "$changed_prisma" = "$expected_prisma"

              case "$PRE_APPLIED_MIGRATION_MANIFEST_PATH" in
                .github/releases/approved-emp-ux-production-migration.json)
                  EVIDENCE_WORKFLOW_NAME='Apply Approved EMP-UX Production Migration'
                  EVIDENCE_WORKFLOW_PATH='.github/workflows/apply-approved-emp-ux-production-migration.yml'
                  EVIDENCE_WORKFLOW_EVENT='push'
                  ;;
                .github/releases/approved-perf05-production-migration.json)
                  EVIDENCE_WORKFLOW_NAME='Apply Approved PERF-05 Production Migration'
                  EVIDENCE_WORKFLOW_PATH='.github/workflows/apply-approved-perf05-production-migration.yml'
                  EVIDENCE_WORKFLOW_EVENT='push'
                  ;;
                .github/releases/approved-cfg07-production-migration.json)
                  EVIDENCE_WORKFLOW_NAME='Apply Approved Production Migration V2'
                  EVIDENCE_WORKFLOW_PATH='.github/workflows/apply-approved-production-migration-v2.yml'
                  EVIDENCE_WORKFLOW_EVENT='push'
                  ;;
                .github/releases/approved-mdg-01b-production-migration.json)
                  EVIDENCE_WORKFLOW_NAME='Apply Approved MDG-01B Production Migration'
                  EVIDENCE_WORKFLOW_PATH='.github/workflows/one-time-vercel-production-sync.yml'
                  EVIDENCE_WORKFLOW_EVENT='workflow_dispatch'
                  ;;
                *)
                  echo 'Unsupported pre-applied migration evidence manifest.'
                  exit 1
                  ;;
              esac
              export EVIDENCE_WORKFLOW_NAME EVIDENCE_WORKFLOW_EVENT
              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRE_APPLIED_MIGRATION_EVIDENCE_RUN_ID" >/tmp/pre-applied-run.json
              EVIDENCE_HEAD=$(node - /tmp/pre-applied-run.json <<'NODE'
          const fs = require('node:fs');
          const run = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (run.name !== process.env.EVIDENCE_WORKFLOW_NAME) throw new Error('unexpected migration evidence workflow');
          if (run.status !== 'completed' || run.conclusion !== 'success') throw new Error('migration evidence workflow did not succeed');
          if (run.event !== process.env.EVIDENCE_WORKFLOW_EVENT) throw new Error('migration evidence workflow event mismatch');
          if (run.head_branch !== 'fix/serverless-database-reliability') throw new Error('migration evidence branch mismatch');
          if (!/^[0-9a-f]{40}$/.test(run.head_sha || '')) throw new Error('migration evidence head SHA missing');
          process.stdout.write(run.head_sha);
          NODE
              )
              git cat-file -e "${EVIDENCE_HEAD}^{commit}"
              git merge-base --is-ancestor "$MIGRATION_SOURCE_SHA" "$EVIDENCE_HEAD"
              git merge-base --is-ancestor "$EVIDENCE_HEAD" "$GITHUB_SHA"
              git diff --quiet "$EVIDENCE_HEAD" "$GITHUB_SHA" -- \
                "$PRE_APPLIED_MIGRATION_MANIFEST_PATH" \
                "$EVIDENCE_WORKFLOW_PATH" \
                scripts/ci/verify-approved-production-migration.js \
                "$POST_VERIFY_SCRIPT"

              gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRE_APPLIED_MIGRATION_EVIDENCE_RUN_ID/jobs?per_page=100" >/tmp/pre-applied-jobs.json
              node - /tmp/pre-applied-jobs.json <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const approval = (data.jobs || []).find((job) => job.name === 'Approve Production Migration');
          if (!approval || approval.status !== 'completed' || approval.conclusion !== 'success') {
            throw new Error('approved Production migration job evidence not found');
          }
          process.stdout.write('PRE_APPLIED_PRODUCTION_MIGRATION_EVIDENCE=PASS\n');
          NODE
              ;;
            *)
              echo 'Unsupported database change policy.'
              exit 1
              ;;
          esac
          test -z "$(git status --porcelain)"

      - name: Require successful exact-SHA CI evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.manifest.outputs.commit_sha }}
        run: |
          set -euo pipefail
          ci_json=$(mktemp)
          trap 'rm -f "$ci_json"' EXIT
          gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$TARGET_SHA&status=success&per_page=100" >"$ci_json"
          node - "$ci_json" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const pass = (data.workflow_runs || []).some((run) => run.name === 'CI' && run.head_sha === process.env.TARGET_SHA && run.conclusion === 'success');
          if (!pass) throw new Error('exact-SHA successful CI evidence not found');
          process.stdout.write('EXACT_SHA_CI=PASS\n');
          NODE

      - name: Hash immutable release manifest evidence
        id: hash
        shell: bash
        run: |
          set -euo pipefail
          manifest_sha256=$(sha256sum "$RELEASE_MANIFEST_PATH" | awk '{print $1}')
          [[ "$manifest_sha256" =~ ^[0-9a-f]{64}$ ]]
          echo "manifest_sha256=$manifest_sha256" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: approved-production-release-manifest
          path: .github/releases/approved-production.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish Owner decision summary
        shell: bash
        run: |
          {
            echo '### Approved Production Release Manifest'
            echo "- Release: ${{ steps.manifest.outputs.release_id }}"
            echo "- Exact commit: ${{ steps.manifest.outputs.commit_sha }}"
            echo "- Exact tree: ${{ steps.manifest.outputs.tree_sha }}"
            echo "- Rollback deployment: ${{ steps.manifest.outputs.rollback_deployment_id }}"
            echo "- Project: ${{ steps.manifest.outputs.target_project_name }}"
            echo "- Environment: ${{ steps.manifest.outputs.target_environment }}"
            echo "- Run migrations: ${{ steps.manifest.outputs.run_migrations }}"
            echo "- Database change policy: ${{ steps.manifest.outputs.database_change_policy }}"
            echo "- Manifest SHA-256: ${{ steps.hash.outputs.manifest_sha256 }}"
            echo '- Owner action: Approve Production only'
          } >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Approve Production
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      TARGET_SHA: ${{ needs.prepare.outputs.commit_sha }}
      TARGET_TREE: ${{ needs.prepare.outputs.tree_sha }}
      CURRENT_PRODUCTION_SOURCE_SHA: ${{ needs.prepare.outputs.current_production_source_sha }}
      ROLLBACK_DEPLOYMENT_ID: ${{ needs.prepare.outputs.rollback_deployment_id }}
      MANIFEST_SHA256: ${{ needs.prepare.outputs.manifest_sha256 }}
      DATABASE_CHANGE_POLICY: ${{ needs.prepare.outputs.database_change_policy }}
      PRE_APPLIED_MIGRATION_MANIFEST_PATH: ${{ needs.prepare.outputs.pre_applied_migration_manifest_path }}
      PRE_APPLIED_MIGRATION_EVIDENCE_RUN_ID: ${{ needs.prepare.outputs.pre_applied_migration_evidence_run_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.commit_sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Revalidate exact source after Owner approval
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          git cat-file -e "${CURRENT_PRODUCTION_SOURCE_SHA}^{commit}"
          case "$DATABASE_CHANGE_POLICY" in
            NO_DATABASE_CHANGES)
              git diff --quiet "$CURRENT_PRODUCTION_SOURCE_SHA" "$TARGET_SHA" -- prisma/schema.prisma prisma/migrations
              ;;
            PRE_APPLIED_APPROVED_MIGRATION)
              git fetch --no-tags origin "$GITHUB_SHA"
              git show "$GITHUB_SHA:$PRE_APPLIED_MIGRATION_MANIFEST_PATH" >/tmp/pre-applied-production-migration.json
              git show "$GITHUB_SHA:scripts/ci/verify-approved-production-migration.js" >/tmp/verify-approved-production-migration.js

              migration_meta=$(node - /tmp/pre-applied-production-migration.json <<'NODE'
          const fs = require('node:fs');
          const verifier = require('/tmp/verify-approved-production-migration.js');
          const manifest = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const result = verifier.validateMigrationManifest(manifest, { root: process.cwd(), verifySql: false });
          const sql = fs.readFileSync(result.migrationPath, 'utf8');
          verifier.validateSqlForMigration(result.migrationId, sql);
          process.stdout.write([
            `source_sha=${result.sourceCommitSha}`,
            `source_tree=${result.sourceTreeSha}`,
            `post_verify_script=${result.postVerifyScript}`,
            `current_production_deployment_id=${result.currentProductionDeploymentId}`,
            `current_production_application_sha=${result.currentProductionApplicationSha}`
          ].join('\n'));
          NODE
              )
              MIGRATION_SOURCE_SHA=$(printf '%s\n' "$migration_meta" | sed -n 's/^source_sha=//p')
              MIGRATION_SOURCE_TREE=$(printf '%s\n' "$migration_meta" | sed -n 's/^source_tree=//p')
              POST_VERIFY_SCRIPT=$(printf '%s\n' "$migration_meta" | sed -n 's/^post_verify_script=//p')
              MIGRATION_CURRENT_PRODUCTION_DEPLOYMENT_ID=$(printf '%s\n' "$migration_meta" | sed -n 's/^current_production_deployment_id=//p')
              MIGRATION_CURRENT_PRODUCTION_APPLICATION_SHA=$(printf '%s\n' "$migration_meta" | sed -n 's/^current_production_application_sha=//p')
              test "$MIGRATION_CURRENT_PRODUCTION_DEPLOYMENT_ID" = "$ROLLBACK_DEPLOYMENT_ID"
              test "$MIGRATION_CURRENT_PRODUCTION_APPLICATION_SHA" = "$CURRENT_PRODUCTION_SOURCE_SHA"
              [[ "$MIGRATION_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
              test "$(git rev-parse "${MIGRATION_SOURCE_SHA}^{tree}")" = "$MIGRATION_SOURCE_TREE"
              git cat-file -e "${MIGRATION_SOURCE_SHA}^{commit}"
              git merge-base --is-ancestor "$CURRENT_PRODUCTION_SOURCE_SHA" "$MIGRATION_SOURCE_SHA"
              git merge-base --is-ancestor "$MIGRATION_SOURCE_SHA" "$TARGET_SHA"
              git diff --quiet "$MIGRATION_SOURCE_SHA" "$TARGET_SHA" -- prisma/schema.prisma prisma/migrations
              git show "$GITHUB_SHA:$POST_VERIFY_SCRIPT" >/tmp/pre-applied-post-verify.js
              ;;
            *)
              exit 1
              ;;
          esac
          test -z "$(git status --porcelain)"
          test -n "$VERCEL_TOKEN"
          [[ "$ROLLBACK_DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]

      - run: npm ci

      - name: Revalidate pre-applied Production database state
        if: ${{ needs.prepare.outputs.database_change_policy == 'PRE_APPLIED_APPROVED_MIGRATION' }}
        env:
          NODE_ENV: production
          VERCEL_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
        shell: bash
        run: |
          set -euo pipefail
          npx prisma generate
          node scripts/ci/verify-deployment-target.js --verify
          node scripts/ci/prisma-migration.js status
          test -f /tmp/pre-applied-post-verify.js
          NODE_PATH="$PWD/node_modules" node /tmp/pre-applied-post-verify.js
          echo 'PRE_APPLIED_PRODUCTION_DATABASE_STATE=PASS'

      - name: Verify Vercel project linkage
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@"$VERCEL_CLI_VERSION" pull --yes --environment=production --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >/tmp/vercel-pull.log 2>&1
          node - <<'NODE'
          const fs = require('node:fs');
          const project = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (project.projectId !== process.env.EXPECTED_PROJECT_ID || project.orgId !== process.env.EXPECTED_ORG_ID) throw new Error('Vercel project linkage mismatch');
          process.stdout.write('VERCEL_LINKAGE=PASS\n');
          NODE

      - name: Verify rollback checkpoint is still current Production
        shell: bash
        run: |
          set -euo pipefail
          rollback_current_json=$(mktemp)
          trap 'rm -f "$rollback_current_json"' EXIT
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --token "$VERCEL_TOKEN" >"$rollback_current_json"
          node - "$rollback_current_json" "$ROLLBACK_DEPLOYMENT_ID" "$EXPECTED_PROJECT_ID" <<'NODE'
          const fs = require('node:fs');
          const { inspectDeploymentRecord } = require('./scripts/ci/vercel-deployment');
          const [file, expectedId, expectedProjectId] = process.argv.slice(2);
          const record = inspectDeploymentRecord(fs.readFileSync(file, 'utf8'), { expectedId, expectedProjectId });
          if (record.target !== 'production') throw new Error('Rollback checkpoint is not a Production deployment');
          process.stdout.write('ROLLBACK_CHECKPOINT_CURRENT=PASS\n');
          NODE

      - name: Build exact prebuilt Production artifact and enforce feature sentinels
        shell: bash
        run: |
          set -euo pipefail
          build_log=$(mktemp)
          trap 'rm -f "$build_log"' EXIT
          CI_MIGRATION_COMPLETED=true npx --yes vercel@"$VERCEL_CLI_VERSION" build --prod --token "$VERCEL_TOKEN" >"$build_log" 2>&1
          grep -Fq 'Vercel build is build-only' "$build_log"
          grep -Fq 'Prisma generate passed' "$build_log"
          grep -Fq 'Application build passed' "$build_log"
          if grep -Eiq 'prisma migrate deploy|Prisma migrate deploy started|Prisma migrate deploy passed' "$build_log"; then
            echo 'Vercel build unexpectedly invoked Prisma migration'
            exit 1
          fi
          test -f frontend/dist/index.html
          compgen -G 'frontend/dist/assets/index-*.js' >/dev/null
          test -f .vercel/output/config.json
          node scripts/ci/verify-release-artifact.js frontend/dist .vercel/output/static

      - name: Restore exact source identity before prebuilt deploy
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree -- .
          git clean -fd
          test -f frontend/dist/index.html
          test -f .vercel/output/config.json
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          test "$(git rev-parse HEAD^{tree})" = "$TARGET_TREE"
          test -z "$(git status --porcelain)"

      - name: Deploy exact prebuilt artifact
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_json=$(mktemp)
          deployment_output=$(mktemp)
          inspect_json=$(mktemp)
          trap 'rm -f "$deploy_json" "$deployment_output" "$inspect_json"' EXIT
          npx --yes vercel@"$VERCEL_CLI_VERSION" deploy --prebuilt --prod --yes --project "$EXPECTED_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --format=json >"$deploy_json"
          node scripts/ci/vercel-deployment.js "$deploy_json" "$EXPECTED_PROJECT_ID" "$ROLLBACK_DEPLOYMENT_ID" >"$deployment_output"
          while IFS='=' read -r key value; do
            case "$key" in
              deployment_id) deployment_id="$value" ;;
              deployment_url) deployment_url="$value" ;;
            esac
          done <"$deployment_output"
          test -n "${deployment_id:-}"
          test -n "${deployment_url:-}"
          [[ "$deployment_id" =~ ^dpl_[A-Za-z0-9]+$ ]]
          [[ "$deployment_url" =~ ^https://sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app/?$ ]]
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$deployment_id" --format=json --token "$VERCEL_TOKEN" >"$inspect_json"
          node - "$inspect_json" "$deployment_id" "$EXPECTED_PROJECT_ID" "$TARGET_SHA" <<'NODE'
          const fs = require('node:fs');
          const { inspectDeploymentRecord } = require('./scripts/ci/vercel-deployment');
          const [file, expectedId, expectedProjectId, expectedCommit] = process.argv.slice(2);
          const record = inspectDeploymentRecord(fs.readFileSync(file, 'utf8'), { expectedId, expectedProjectId });
          if (record.target !== 'production') throw new Error('Vercel deployment target is not production');
          if (record.commitSha && record.commitSha !== expectedCommit) throw new Error('Vercel deployment commit mismatch');
          process.stdout.write('DEPLOYMENT_INSPECT=PASS\n');
          NODE
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify immutable candidate, explicitly promote, then verify canonical Production
        id: verify
        continue-on-error: true
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail

          verify_public_runtime() {
            local base_url="$1"
            local label="$2"
            node - "$base_url" "$label" <<'NODE'
          const base = process.argv[2].replace(/\/$/, '');
          const label = process.argv[3];
          const sentinels = ['เข้าสู่ระบบด้วย Passkey', 'ลงเวลา', 'อุปกรณ์ลงเวลา', 'Security Site', 'ลงเวลาแทนพนักงาน', 'Approval Authority Matrix / SLA', 'การเปลี่ยนแปลงสำคัญ', 'เปลี่ยนชื่อ', 'ย้ายหน่วยงาน / แผนก', 'เปลี่ยนตำแหน่ง', 'Data Retention Center / การเก็บรักษาข้อมูล', 'รัน Cleanup รอบถัดไป'];
          async function request(path) { return fetch(`${base}${path}`, { redirect: 'follow' }); }
          async function main() {
            const health = await request('/api/v1/health');
            if (health.status !== 200) throw new Error(`${label} health status ${health.status}`);
            const healthJson = await health.json();
            if (healthJson.status !== 'ok') throw new Error(`${label} health payload mismatch`);
            const ready = await request('/api/v1/ready');
            if (ready.status !== 200) throw new Error(`${label} ready status ${ready.status}`);
            const readyJson = await ready.json();
            if (readyJson.status !== 'ready' || readyJson.database !== 'ok') throw new Error(`${label} ready payload mismatch`);
            const approval = await request('/api/v1/approval-center');
            if (approval.status !== 401) throw new Error(`${label} approval-center unauth status ${approval.status}`);
            const root = await request('/');
            if (root.status !== 200) throw new Error(`${label} root status ${root.status}`);
            const html = await root.text();
            const match = html.match(/<script[^>]+src=["']([^"']*\/assets\/index-[^"']+\.js)["']/i);
            if (!match) throw new Error(`${label} main frontend bundle not found`);
            const bundleUrl = new URL(match[1], `${base}/`).toString();
            const bundle = await fetch(bundleUrl, { redirect: 'follow' });
            if (bundle.status !== 200) throw new Error(`${label} bundle status ${bundle.status}`);
            const js = await bundle.text();
            const missing = sentinels.filter((value) => !js.includes(value));
            if (missing.length) throw new Error(`${label} missing runtime sentinels: ${missing.join(', ')}`);
            process.stdout.write(`${label}_RUNTIME_VERIFY=PASS\nBUNDLE_BYTES=${Buffer.byteLength(js)}\nSENTINELS=${sentinels.length}\n`);
          }
          main().catch((error) => { console.error(error); process.exit(1); });
          NODE
          }

          # Vercel `curl` is a beta CLI surface and has repeatedly returned exit code 2
          # inside the protected GitHub runner despite a healthy READY deployment. Do not
          # make Production cutover correctness depend on that beta command. The exact
          # prebuilt artifact has already passed the release-artifact sentinel guard, and
          # the deployment step has already validated project/target/source identity.
          # Re-inspect the immutable candidate with the stable inspect command immediately
          # before promotion, then perform the authoritative runtime checks on the public
          # canonical URL. Any canonical verification failure auto-rolls back below.
          candidate_json=$(mktemp)
          trap 'rm -f "$candidate_json"' EXIT
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_ID" --format=json --token "$VERCEL_TOKEN" >"$candidate_json"
          node - "$candidate_json" "$DEPLOYMENT_ID" "$EXPECTED_PROJECT_ID" "$TARGET_SHA" <<'NODE'
          const fs = require('node:fs');
          const { inspectDeploymentRecord } = require('./scripts/ci/vercel-deployment');
          const [file, expectedId, expectedProjectId, expectedCommit] = process.argv.slice(2);
          const record = inspectDeploymentRecord(fs.readFileSync(file, 'utf8'), { expectedId, expectedProjectId });
          if (record.target !== 'production') throw new Error('Immutable candidate target is not production');
          if (record.commitSha && record.commitSha !== expectedCommit) throw new Error('Immutable candidate commit mismatch');
          process.stdout.write('IMMUTABLE_CANDIDATE_INSPECT=PASS\n');
          NODE

          npx --yes vercel@"$VERCEL_CLI_VERSION" promote "$DEPLOYMENT_ID" --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"

          canonical_json=$(mktemp)
          trap 'rm -f "$canonical_json"' EXIT
          matched=false
          for attempt in $(seq 1 18); do
            if npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --token "$VERCEL_TOKEN" >"$canonical_json" 2>/dev/null; then
              if node - "$canonical_json" "$DEPLOYMENT_ID" "$EXPECTED_PROJECT_ID" <<'NODE'
          const fs = require('node:fs');
          const { inspectDeploymentRecord } = require('./scripts/ci/vercel-deployment');
          const [file, expectedId, expectedProjectId] = process.argv.slice(2);
          inspectDeploymentRecord(fs.readFileSync(file, 'utf8'), { expectedId, expectedProjectId });
          NODE
              then
                matched=true
                break
              fi
            fi
            sleep 5
          done
          test "$matched" = true
          verify_public_runtime "$EXPECTED_CANONICAL_URL" CANONICAL_PRODUCTION

      - name: Auto-rollback to manifest checkpoint if post-deploy verification fails
        id: rollback
        if: ${{ steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          set -euo pipefail
          rollback_json=$(mktemp)
          trap 'rm -f "$rollback_json"' EXIT

          canonical_is_rollback=false
          if npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --token "$VERCEL_TOKEN" >"$rollback_json" 2>/dev/null; then
            if node - "$rollback_json" "$ROLLBACK_DEPLOYMENT_ID" "$EXPECTED_PROJECT_ID" <<'NODE'
          const fs = require('node:fs');
          const { inspectDeploymentRecord } = require('./scripts/ci/vercel-deployment');
          const [file, expectedId, expectedProjectId] = process.argv.slice(2);
          inspectDeploymentRecord(fs.readFileSync(file, 'utf8'), { expectedId, expectedProjectId });
          NODE
            then
              canonical_is_rollback=true
            fi
          fi

          if [[ "$canonical_is_rollback" != true ]]; then
            npx --yes vercel@"$VERCEL_CLI_VERSION" rollback "$ROLLBACK_DEPLOYMENT_ID" --yes --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN"
          else
            echo 'Rollback checkpoint is already current Production; treating rollback as an idempotent no-op.'
          fi

          restored=false
          for attempt in $(seq 1 18); do
            if npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --token "$VERCEL_TOKEN" >"$rollback_json" 2>/dev/null; then
              if node - "$rollback_json" "$ROLLBACK_DEPLOYMENT_ID" "$EXPECTED_PROJECT_ID" <<'NODE'
          const fs = require('node:fs');
          const { inspectDeploymentRecord } = require('./scripts/ci/vercel-deployment');
          const [file, expectedId, expectedProjectId] = process.argv.slice(2);
          inspectDeploymentRecord(fs.readFileSync(file, 'utf8'), { expectedId, expectedProjectId });
          NODE
              then
                restored=true
                break
              fi
            fi
            sleep 5
          done
          test "$restored" = true
          node scripts/ci/verify-health.js
          echo 'AUTO_ROLLBACK=PASS'

      - name: Fail closed after verified automatic rollback
        if: ${{ steps.verify.outcome == 'failure' }}
        shell: bash
        run: |
          echo 'Production verification failed; rollback checkpoint was restored.'
          exit 1

      - name: Publish verified Production release summary
        if: ${{ steps.verify.outcome == 'success' }}
        shell: bash
        run: |
          {
            echo '### Production Release Verified'
            echo "- Release: ${{ needs.prepare.outputs.release_id }}"
            echo "- Exact commit: $TARGET_SHA"
            echo "- Exact tree: $TARGET_TREE"
            echo "- Deployment ID: ${{ steps.deploy.outputs.deployment_id }}"
            echo "- Deployment URL: ${{ steps.deploy.outputs.deployment_url }}"
            echo "- Canonical URL: $EXPECTED_CANONICAL_URL"
            echo "- Rollback checkpoint: $ROLLBACK_DEPLOYMENT_ID"
            echo "- Manifest SHA-256: $MANIFEST_SHA256"
            echo '- Post-deploy verification: PASS'
            echo '- Critical UI sentinels: PASS (12/12)'
          } >> "$GITHUB_STEP_SUMMARY"
