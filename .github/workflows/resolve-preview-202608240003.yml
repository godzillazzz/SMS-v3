name: Resolve Preview Migration 202608240003

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact source commit SHA on the authoritative release branch
        required: true
        type: string
      source_tree:
        description: Exact source tree SHA for source_sha
        required: true
        type: string
      expected_migration_head:
        description: Expected repository migration head after reconciliation
        required: true
        default: 202609010002_mdg_master_codes_department_site_authority
        type: string

permissions:
  contents: read

concurrency:
  group: sms-v3-preview-resolve-202608240003
  cancel-in-progress: false

env:
  EXPECTED_SOURCE_BRANCH: fix/serverless-database-reliability
  RESOLVE_TARGET: 202608240003_g06_security_site_qr_gps_v1
  EXPECTED_MIGRATION_HEAD: 202609010002_mdg_master_codes_department_site_authority

jobs:
  source-preflight:
    name: Resolve source preflight (no database access)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact supplied source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact release-source identity and target source
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_TREE: ${{ inputs.source_tree }}
          INPUT_MIGRATION_HEAD: ${{ inputs.expected_migration_head }}
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = "workflow_dispatch"
          test "$GITHUB_REF_NAME" = "$EXPECTED_SOURCE_BRANCH"
          printf '%s\n' "$SOURCE_SHA" | grep -Eq '^[0-9a-fA-F]{40}$'
          printf '%s\n' "$SOURCE_TREE" | grep -Eq '^[0-9a-fA-F]{40}$'
          test "$INPUT_MIGRATION_HEAD" = "$EXPECTED_MIGRATION_HEAD"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          git fetch --no-tags origin "$EXPECTED_SOURCE_BRANCH"
          test "$(git rev-parse "origin/$EXPECTED_SOURCE_BRANCH")" = "$SOURCE_SHA"
          test -z "$(git status --porcelain)"
          echo 'SOURCE_IDENTITY=PASS'

      - name: Verify hardcoded resolve target and checksum
        shell: bash
        run: node scripts/ci/verify-preview-resolve-source.js

  protected-preview-resolve:
    name: Protected Preview one-shot resolve
    needs: source-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: 'Preview – sms-v3-staging'
    env:
      NODE_ENV: production
      VERCEL_ENV: preview
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT }}
      APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      SOURCE_TREE: ${{ inputs.source_tree }}
      INPUT_MIGRATION_HEAD: ${{ inputs.expected_migration_head }}
    steps:
      - name: Checkout exact approved source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Verify exact source identity again
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_SOURCE_BRANCH"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$SOURCE_TREE"
          test "$INPUT_MIGRATION_HEAD" = "$EXPECTED_MIGRATION_HEAD"
          echo 'SOURCE_IDENTITY=PASS'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install repository tooling and generate Prisma client
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev
          npx --no-install prisma generate
          echo 'PRISMA_TOOLING=PASS'

      - name: Verify protected Preview target guards
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DATABASE_URL:-}"
          test -n "${DIRECT_URL:-}"
          test -n "${APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT:-}"
          test -n "${APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT:-}"
          node scripts/ci/verify-preview-migration-target.js
          echo 'PRODUCTION_TARGET_REJECT_GUARD=PASS'

      - name: Verify exact failed ledger and schema equivalence before resolve
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/verify-preview-resolve-state.js --mode=pre --snapshot "$RUNNER_TEMP/preview-resolve-ledger.json"

      - name: Resolve exactly the proven failed migration
        shell: bash
        run: |
          set -euo pipefail
          npx --no-install prisma migrate resolve --applied 202608240003_g06_security_site_qr_gps_v1
          echo 'RESOLVE_RESULT=SUCCESS'

      - name: Verify resolve result and schema without further mutation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/verify-preview-resolve-state.js --mode=post --snapshot "$RUNNER_TEMP/preview-resolve-ledger.json"

      - name: Read migration status and report next pending migration
        shell: bash
        run: |
          set -euo pipefail
          status_output=$(mktemp)
          trap 'rm -f "$status_output"' EXIT
          node scripts/ci/prisma-migration.js status --allow-pending >"$status_output"
          grep -Fxq 'MIGRATION_STATUS_CLASS=PENDING_MIGRATIONS_ONLY' "$status_output"
          next_pending=$(grep '^MIGRATION_NAME=' "$status_output" | cut -d= -f2 | cut -d, -f1)
          test -n "$next_pending"
          echo 'PRISMA_MIGRATION_STATE=BEHIND'
          echo "NEXT_PENDING_MIGRATION=$next_pending"
          echo 'MIGRATION_DEPLOY_EXECUTED=NO'

      - name: Publish safe Preview resolve summary
        shell: bash
        run: |
          {
            echo '### One-shot Preview migration ledger reconciliation'
            echo '- Target: sms-v3-preview (fingerprint-guarded)'
            echo '- Resolve target: 202608240003_g06_security_site_qr_gps_v1'
            echo '- Source identity: PASS'
            echo '- Resolve result: SUCCESS'
            echo '- Schema objects: 36/36 unchanged'
            echo '- Migration deploy executed: NO'
            echo '- Production database accessed: NO'
            echo '- Business data mutation: NO'
            echo '- Raw secrets emitted: NO'
          } >> "$GITHUB_STEP_SUMMARY"
