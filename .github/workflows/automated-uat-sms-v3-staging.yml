name: Automated Technical Smoke sms-v3-staging

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Candidate deployment or approved canonical URL to test
        required: true
        type: string
      source_sha:
        description: Exact approved source HEAD containing the smoke implementation and regression guards
        required: true
        type: string
      expected_deployment_id:
        description: Optional expected Vercel deployment ID for report context
        required: false
        type: string
      uat_mode:
        description: Technical/public smoke or authenticated ADMIN/MANAGER/VIEWER smoke
        required: false
        default: technical
        type: choice
        options:
          - technical
          - authenticated

permissions:
  contents: read

jobs:
  technical-smoke:
    if: ${{ inputs.uat_mode == 'technical' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: technical
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Validate target and exact smoke source
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [[ ! "$TARGET_URL" =~ ^https://sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app/?$ && "$TARGET_URL" != "https://sms-v3-staging-ten.vercel.app" ]]; then
            echo 'TECHNICAL_SMOKE_TARGET_INVALID'
            exit 1
          fi
          git fetch --no-tags origin fix/serverless-database-reliability test/automated-uat-v2-regression-guards test/automated-uat-v3-authenticated
          git cat-file -e "${SOURCE_SHA}^{commit}"
          approved_source=false
          for approved_ref in \
            origin/fix/serverless-database-reliability \
            origin/test/automated-uat-v2-regression-guards \
            origin/test/automated-uat-v3-authenticated; do
            if [[ "$(git rev-parse "$approved_ref")" == "$SOURCE_SHA" ]]; then
              approved_source=true
              break
            fi
          done
          if [[ "$approved_source" != true ]]; then
            echo 'TECHNICAL_SMOKE_SOURCE_NOT_APPROVED_HEAD'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run technical UAT V3 without credentials
        id: uat
        uses: actions/github-script@v7
        env:
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_MODE: technical
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { isProtectedCandidateUrl } = require('./e2e/helpers/technical-smoke');
            const { artifactLeakReasons } = require('./e2e/helpers/uat-v3-security');

            const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
            if (isProtectedCandidateUrl(process.env.UAT_BASE_URL) && !bypassSecret) {
              core.setFailed('VERCEL_AUTOMATION_BYPASS_SECRET_MISSING');
              core.setOutput('artifact_leak', 'not-scanned');
              return;
            }
            if (bypassSecret) core.setSecret(bypassSecret);
            const result = spawnSync('npm', ['run', 'test:uat'], { env: { ...process.env }, stdio: 'inherit' });

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) {
                  stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                } else {
                  const content = fs.readFileSync(current);
                  const reasons = artifactLeakReasons(current, content, { bypassSecret });
                  if (reasons.length) flaggedArtifacts.push({ path: path.relative(process.cwd(), current).replace(/\\/g, '/'), reasons });
                }
              }
            }

            core.setOutput('artifact_leak', String(flaggedArtifacts.length));
            for (const artifact of flaggedArtifacts) core.warning(`ARTIFACT_SCAN path=${artifact.path} category=${artifact.reasons.join(',')}`);
            if (flaggedArtifacts.length > 0) core.setFailed('VERCEL_BYPASS_ARTIFACT_LEAK');
            else if (result.error || result.status !== 0) core.setFailed('UAT_EXECUTION_FAILED');
            else core.info('VERCEL_BYPASS_ARTIFACT_LEAK=0');
      - name: Publish technical UAT summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Automated UAT V3'
            echo "- Mode: $UAT_MODE"
            echo "- Target: $UAT_BASE_URL"
            echo "- Result: ${{ steps.uat.outcome }}"
            echo "- VERCEL_BYPASS_ARTIFACT_LEAK: ${{ steps.uat.outputs.artifact_leak || 'not-scanned' }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload technical UAT artifacts
        if: always() && steps.uat.outputs.artifact_leak == '0'
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-technical-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            !playwright-report/**/.auth/**
            !playwright-report/**/auth-state/**
            !playwright-report/**/storageState*
            !test-results/**/.auth/**
            !test-results/**/auth-state/**
            !test-results/**/storageState*
            !test-results/**/storage-state*
          if-no-files-found: warn
          retention-days: 7

  authenticated-uat:
    if: ${{ inputs.uat_mode == 'authenticated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-sms-v3-staging
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: authenticated
      UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
      UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
      UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
      UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
      UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
      UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Validate target and exact smoke source
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          if [[ ! "$TARGET_URL" =~ ^https://sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app/?$ && "$TARGET_URL" != "https://sms-v3-staging-ten.vercel.app" ]]; then
            echo 'TECHNICAL_SMOKE_TARGET_INVALID'
            exit 1
          fi
          git fetch --no-tags origin fix/serverless-database-reliability test/automated-uat-v2-regression-guards test/automated-uat-v3-authenticated
          git cat-file -e "${SOURCE_SHA}^{commit}"
          approved_source=false
          for approved_ref in \
            origin/fix/serverless-database-reliability \
            origin/test/automated-uat-v2-regression-guards \
            origin/test/automated-uat-v3-authenticated; do
            if [[ "$(git rev-parse "$approved_ref")" == "$SOURCE_SHA" ]]; then
              approved_source=true
              break
            fi
          done
          if [[ "$approved_source" != true ]]; then
            echo 'TECHNICAL_SMOKE_SOURCE_NOT_APPROVED_HEAD'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
      - name: Require all authenticated UAT credentials
        shell: bash
        env:
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
          UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
        run: |
          set -euo pipefail
          for role in ADMIN MANAGER VIEWER; do
            email_key="UAT_${role}_EMAIL"
            password_key="UAT_${role}_PASSWORD"
            email_value="${!email_key-}"
            password_value="${!password_key-}"
            if [[ -z "$email_value" || -z "$password_value" ]]; then
              echo 'UAT_CREDENTIALS_REQUIRED'
              exit 1
            fi
          done
          echo 'UAT_CREDENTIAL_CONTRACT=VALID'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated UAT V3
        id: uat
        uses: actions/github-script@v7
        env:
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_MODE: authenticated
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
          UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { isProtectedCandidateUrl } = require('./e2e/helpers/technical-smoke');
            const { artifactLeakReasons } = require('./e2e/helpers/uat-v3-security');

            const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
            if (isProtectedCandidateUrl(process.env.UAT_BASE_URL) && !bypassSecret) {
              core.setFailed('VERCEL_AUTOMATION_BYPASS_SECRET_MISSING');
              core.setOutput('artifact_leak', 'not-scanned');
              return;
            }
            const artifactSecrets = [
              bypassSecret,
              process.env.UAT_ADMIN_PASSWORD,
              process.env.UAT_MANAGER_PASSWORD,
              process.env.UAT_VIEWER_PASSWORD
            ].filter(Boolean);
            for (const secret of artifactSecrets) core.setSecret(secret);
            const result = spawnSync('npm', ['run', 'test:uat'], { env: { ...process.env }, stdio: 'inherit' });

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) {
                  stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                } else {
                  const content = fs.readFileSync(current);
                  const reasons = artifactLeakReasons(current, content, { bypassSecret, secretValues: artifactSecrets });
                  if (reasons.length) flaggedArtifacts.push({ path: path.relative(process.cwd(), current).replace(/\\/g, '/'), reasons });
                }
              }
            }

            core.setOutput('artifact_leak', String(flaggedArtifacts.length));
            for (const artifact of flaggedArtifacts) core.warning(`ARTIFACT_SCAN path=${artifact.path} category=${artifact.reasons.join(',')}`);
            if (flaggedArtifacts.length > 0) core.setFailed('VERCEL_BYPASS_ARTIFACT_LEAK');
            else if (result.error || result.status !== 0) core.setFailed('UAT_EXECUTION_FAILED');
            else core.info('VERCEL_BYPASS_ARTIFACT_LEAK=0');
      - name: Publish authenticated UAT summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Automated UAT V3'
            echo "- Mode: $UAT_MODE"
            echo "- Target: $UAT_BASE_URL"
            echo "- Result: ${{ steps.uat.outcome }}"
            echo "- VERCEL_BYPASS_ARTIFACT_LEAK: ${{ steps.uat.outputs.artifact_leak || 'not-scanned' }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload authenticated UAT artifacts
        if: always() && steps.uat.outputs.artifact_leak == '0'
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-authenticated-${{ github.run_id }}
          path: |
            playwright-report
            test-results
            !playwright-report/**/.auth/**
            !playwright-report/**/auth-state/**
            !playwright-report/**/storageState*
            !test-results/**/.auth/**
            !test-results/**/auth-state/**
            !test-results/**/storageState*
            !test-results/**/storage-state*
          if-no-files-found: warn
          retention-days: 7
