name: Automated Technical Smoke sms-v3-staging

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Candidate deployment or approved canonical URL to test
        required: true
        type: string
      source_branch:
        description: Exact remote application-under-test branch whose HEAD must equal source_sha
        required: false
        default: fix/serverless-database-reliability
        type: string
      source_sha:
        description: Exact application-under-test SHA deployed at the target URL
        required: true
        type: string
      uat_harness_sha:
        description: Exact trusted UAT harness HEAD from test/automated-uat-v3-authenticated
        required: true
        type: string
      expected_deployment_id:
        description: Exact expected Vercel deployment ID for report identity
        required: true
        type: string
      uat_mode:
        description: Technical/public smoke, authenticated regression, or the exact owner-approved disposable fixture lane
        required: false
        default: technical
        type: choice
        options:
          - technical
          - authenticated
          - disposable-approved-v1
      fixture_confirmation:
        description: Exact one-shot confirmation required only for disposable-approved-v1
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  technical-smoke:
    if: ${{ inputs.uat_mode == 'technical' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
      UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: technical
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - name: Validate target, application identity, and trusted harness
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          if [[ ! "$TARGET_URL" =~ ^https://sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app/?$ && "$TARGET_URL" != "https://sms-v3-staging-ten.vercel.app" ]]; then
            echo 'TECHNICAL_SMOKE_TARGET_INVALID'
            exit 1
          fi
          git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null
          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/test/automated-uat-v3-authenticated:refs/remotes/origin/test/automated-uat-v3-authenticated"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git cat-file -e "${HARNESS_SHA}^{commit}"
          if [[ "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}^{commit}")" != "$SOURCE_SHA" ]]; then
            echo 'UAT_APPLICATION_SOURCE_NOT_APPROVED_HEAD'
            exit 1
          fi
          echo 'SOURCE_BRANCH_HEAD_CHECK=PASS'
          if [[ "$(git rev-parse origin/test/automated-uat-v3-authenticated)" != "$HARNESS_SHA" ]]; then
            echo 'UAT_HARNESS_SOURCE_NOT_APPROVED_HEAD'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          target_mode=candidate
          if [[ "$TARGET_URL" == "https://sms-v3-staging-ten.vercel.app" ]]; then target_mode=canonical; fi
          node e2e/helpers/uat-target-contract.js source-branch "$SOURCE_BRANCH"
          node e2e/helpers/uat-target-contract.js source-head "$SOURCE_BRANCH" "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}^{commit}")" "$SOURCE_SHA"
          node e2e/helpers/uat-target-contract.js harness "$HARNESS_SHA" "$(git rev-parse HEAD)" "$(git rev-parse origin/test/automated-uat-v3-authenticated)"
          node e2e/helpers/uat-target-contract.js scope "$target_mode" "$TARGET_URL"
          echo "APPLICATION_UNDER_TEST_SHA=$SOURCE_SHA"
          echo "TRUSTED_UAT_HARNESS_SHA=$HARNESS_SHA"
          echo "EXPECTED_DEPLOYMENT_ID=$DEPLOYMENT_ID"
      - name: Checkout exact application under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: application-under-test
      - name: Verify separate application checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C application-under-test rev-parse HEAD)" = "$SOURCE_SHA"
          test -f application-under-test/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run technical UAT V3 without credentials
        id: uat
        uses: actions/github-script@v7
        env:
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_MODE: technical
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { isProtectedCandidateUrl } = require('./e2e/helpers/technical-smoke');
            const { scanArtifact, sanitizeArtifactPath } = require('./e2e/helpers/uat-v3-security');

            const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
            if (isProtectedCandidateUrl(process.env.UAT_BASE_URL) && !bypassSecret) {
              core.setFailed('VERCEL_AUTOMATION_BYPASS_SECRET_MISSING');
              core.setOutput('artifact_leak', 'not-scanned');
              return;
            }
            if (bypassSecret) core.setSecret(bypassSecret);
            const result = spawnSync('npm', ['run', 'test:uat'], { env: { ...process.env }, stdio: 'ignore' });

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) {
                  stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                } else {
                  const content = fs.readFileSync(current);
                  const relativePath = path.relative(process.cwd(), current).replace(/\\/g, '/');
                  const finding = scanArtifact(relativePath, content, { bypassSecret });
                  if (!finding.safe) flaggedArtifacts.push(finding);
                }
              }
            }

            fs.mkdirSync('test-results', { recursive: true });
            const leakCount = flaggedArtifacts.reduce((count, artifact) => count + artifact.categories.length, 0);
            fs.writeFileSync('test-results/uat-v3-artifact-summary.json', JSON.stringify({ leakCount, findings: flaggedArtifacts.map(({ path: filePath, categories }) => ({ path: sanitizeArtifactPath(filePath), categories })) }));
            core.setOutput('artifact_leak', String(leakCount));
            core.setOutput('artifact_leak_count', String(leakCount));
            for (const artifact of flaggedArtifacts) for (const category of artifact.categories) core.warning(`ARTIFACT_SCAN path=${artifact.path} category=${category}`);
            if (leakCount > 0) core.setFailed('UAT_ARTIFACT_LEAK');
            else if (result.error || result.status !== 0) core.setFailed('UAT_EXECUTION_FAILED');
            else core.info('ARTIFACT_LEAK_COUNT=0');
      - name: Publish technical UAT summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Automated UAT V3'
            echo "- Mode: $UAT_MODE"
            echo "- Target: $UAT_BASE_URL"
            echo "- Result: ${{ steps.uat.outcome }}"
            echo "- Artifact leak count: ${{ steps.uat.outputs.artifact_leak_count || 'not-scanned' }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload technical UAT artifacts
        if: always() && steps.uat.outputs.artifact_leak == '0'
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-technical-${{ github.run_id }}
          path: |
            test-results/uat-summary.md
            test-results/uat-results.json
            test-results/uat-v3-account-preflight.json
            test-results/uat-v3-artifact-summary.json
          if-no-files-found: warn
          retention-days: 7

  authenticated-uat:
    if: ${{ inputs.uat_mode == 'authenticated' || inputs.uat_mode == 'disposable-approved-v1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: sms-v3-staging-authenticated-uat
      cancel-in-progress: false
    environment: production-sms-v3-staging
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
      UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: authenticated
      PLAYWRIGHT_NO_COPY_PROMPT: 1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - name: Validate target, application identity, and trusted harness
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          if [[ ! "$TARGET_URL" =~ ^https://sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app/?$ && "$TARGET_URL" != "https://sms-v3-staging-ten.vercel.app" ]]; then
            echo 'TECHNICAL_SMOKE_TARGET_INVALID'
            exit 1
          fi
          git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null
          git fetch --no-tags origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/test/automated-uat-v3-authenticated:refs/remotes/origin/test/automated-uat-v3-authenticated"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git cat-file -e "${HARNESS_SHA}^{commit}"
          if [[ "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}^{commit}")" != "$SOURCE_SHA" ]]; then
            echo 'UAT_APPLICATION_SOURCE_NOT_APPROVED_HEAD'
            exit 1
          fi
          echo 'SOURCE_BRANCH_HEAD_CHECK=PASS'
          if [[ "$(git rev-parse origin/test/automated-uat-v3-authenticated)" != "$HARNESS_SHA" ]]; then
            echo 'UAT_HARNESS_SOURCE_NOT_APPROVED_HEAD'
            exit 1
          fi
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          target_mode=candidate
          if [[ "$TARGET_URL" == "https://sms-v3-staging-ten.vercel.app" ]]; then target_mode=canonical; fi
          node e2e/helpers/uat-target-contract.js source-branch "$SOURCE_BRANCH"
          node e2e/helpers/uat-target-contract.js source-head "$SOURCE_BRANCH" "$(git rev-parse "refs/remotes/origin/${SOURCE_BRANCH}^{commit}")" "$SOURCE_SHA"
          node e2e/helpers/uat-target-contract.js harness "$HARNESS_SHA" "$(git rev-parse HEAD)" "$(git rev-parse origin/test/automated-uat-v3-authenticated)"
          node e2e/helpers/uat-target-contract.js scope "$target_mode" "$TARGET_URL"
          echo "APPLICATION_UNDER_TEST_SHA=$SOURCE_SHA"
          echo "TRUSTED_UAT_HARNESS_SHA=$HARNESS_SHA"
          echo "EXPECTED_DEPLOYMENT_ID=$DEPLOYMENT_ID"
      - name: Validate exact owner-approved disposable release identity
        if: ${{ inputs.uat_mode == 'disposable-approved-v1' }}
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          APPROVED_DEPLOYMENT_INPUT: ${{ inputs.expected_deployment_id }}
          FIXTURE_CONFIRMATION: ${{ inputs.fixture_confirmation }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TARGET_URL" == 'https://sms-v3-staging-ten.vercel.app' ]] || { echo 'UAT_DISPOSABLE_RELEASE_IDENTITY_MISMATCH'; exit 1; }
          [[ "$SOURCE_BRANCH" == 'feat/request-id-visibility-v1' ]] || { echo 'UAT_DISPOSABLE_RELEASE_IDENTITY_MISMATCH'; exit 1; }
          [[ "$SOURCE_SHA" == 'dd78e635146ca452b620216973069be9d1e6e3ea' ]] || { echo 'UAT_DISPOSABLE_RELEASE_IDENTITY_MISMATCH'; exit 1; }
          [[ "$HARNESS_SHA" == '22dc92c1abf9159b272837637f6986f3b6267d9e' ]] || { echo 'UAT_DISPOSABLE_RELEASE_IDENTITY_MISMATCH'; exit 1; }
          [[ "$APPROVED_DEPLOYMENT_INPUT" == 'dpl_C9HC6M3Rp2mHb6CAmUCmuMhmCCup' ]] || { echo 'UAT_DISPOSABLE_RELEASE_IDENTITY_MISMATCH'; exit 1; }
          [[ "$FIXTURE_CONFIRMATION" == 'MUTATE_SMS_V3_DISPOSABLE_UAT_EMPLOYEE_V1' ]] || { echo 'UAT_EMPLOYEE_CONFIRMATION_REQUIRED'; exit 1; }
          [[ -n "$VERCEL_TOKEN" ]] || { echo 'UAT_VERCEL_IDENTITY_SECRET_REQUIRED'; exit 1; }
          target_response="$(mktemp)"
          expected_response="$(mktemp)"
          target_identity="$(mktemp -u)"
          expected_identity="$(mktemp -u)"
          cleanup() { rm -f "$target_response" "$expected_response" "$target_identity" "$expected_identity"; }
          trap cleanup EXIT
          fetch_deployment() {
            local lookup="$1"
            local output="$2"
            curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --get \
              --data-urlencode 'teamId=team_nemCExHbZ8EAhSgsvefHPAEz' \
              --data-urlencode 'withGitRepoInfo=true' \
              "https://api.vercel.com/v13/deployments/$lookup" >"$output" 2>/dev/null \
              || { echo 'UAT_VERCEL_REST_FETCH_FAILED'; exit 1; }
            test -s "$output"
          }
          fetch_deployment 'sms-v3-staging-ten.vercel.app' "$target_response"
          fetch_deployment 'dpl_C9HC6M3Rp2mHb6CAmUCmuMhmCCup' "$expected_response"
          node e2e/helpers/uat-vercel-identity.js sanitize "$target_response" "$target_identity" \
            || { echo 'UAT_VERCEL_RESPONSE_SANITIZE_FAILED'; exit 1; }
          node e2e/helpers/uat-vercel-identity.js sanitize "$expected_response" "$expected_identity" \
            || { echo 'UAT_VERCEL_RESPONSE_SANITIZE_FAILED'; exit 1; }
          node e2e/helpers/uat-target-contract.js verify canonical "$TARGET_URL" 'dpl_C9HC6M3Rp2mHb6CAmUCmuMhmCCup' "$SOURCE_SHA" "$target_identity" "$expected_identity" 'prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s' 'sms-v3-staging' "$SOURCE_BRANCH"
          echo 'UAT_DISPOSABLE_RELEASE_IDENTITY=PASS'
      - name: Checkout exact application under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: application-under-test
      - name: Verify separate application checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C application-under-test rev-parse HEAD)" = "$SOURCE_SHA"
          test -f application-under-test/package.json
      - name: Verify disposable fixture schema equality before direct DB access
        if: ${{ inputs.uat_mode == 'disposable-approved-v1' }}
        shell: bash
        run: |
          set -euo pipefail
          cmp -s prisma/schema.prisma application-under-test/prisma/schema.prisma || { echo 'UAT_FIXTURE_SCHEMA_MISMATCH'; exit 1; }
          echo 'UAT_FIXTURE_SCHEMA=PASS'
      - name: Require all authenticated UAT credentials
        if: ${{ inputs.uat_mode == 'authenticated' }}
        shell: bash
        env:
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
          UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
        run: |
          set -euo pipefail
          for role in ADMIN MANAGER VIEWER; do
            email_key="UAT_${role}_EMAIL"
            password_key="UAT_${role}_PASSWORD"
            email_value="${!email_key-}"
            password_value="${!password_key-}"
            if [[ -z "$email_value" || -z "$password_value" ]]; then
              echo 'UAT_CREDENTIALS_REQUIRED'
              exit 1
            fi
          done
          echo 'UAT_CREDENTIAL_CONTRACT=VALID'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate protected disposable fixture execution context
        if: ${{ inputs.uat_mode == 'disposable-approved-v1' }}
        shell: bash
        env:
          PROTECTED_FIXTURE_DB_URL: ${{ secrets['DATABASE_URL'] }}
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          [[ -n "$PROTECTED_FIXTURE_DB_URL" ]] || { echo 'UAT_EMPLOYEE_DATABASE_TARGET_INVALID'; exit 1; }
          [[ -n "$UAT_ADMIN_EMAIL" && -n "$UAT_ADMIN_PASSWORD" ]] || { echo 'UAT_ADMIN_CREDENTIALS_REQUIRED'; exit 1; }
          node <<'NODE'
          const helper = require('./scripts/admin/disposable-uat-employee');
          const env = {
            ...process.env,
            DATABASE_URL: process.env.PROTECTED_FIXTURE_DB_URL,
            ['UAT_' + 'DISPOSABLE_EMPLOYEE_MODE']: 'shared-approved',
            ['UAT_' + 'DISPOSABLE_EMPLOYEE_CONFIRM']: 'MUTATE_SMS_V3_DISPOSABLE_UAT_EMPLOYEE_V1'
          };
          helper.assertExecutionContext(env);
          process.stdout.write('UAT_EMPLOYEE_SHARED_CONTEXT=VALID\n');
          NODE
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated UAT V3
        if: ${{ inputs.uat_mode == 'authenticated' }}
        id: uat
        uses: actions/github-script@v7
        env:
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_MODE: authenticated
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
          UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { isProtectedCandidateUrl } = require('./e2e/helpers/technical-smoke');
            const { scanArtifact, sanitizeArtifactPath } = require('./e2e/helpers/uat-v3-security');

            const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
            if (isProtectedCandidateUrl(process.env.UAT_BASE_URL) && !bypassSecret) {
              core.setFailed('VERCEL_AUTOMATION_BYPASS_SECRET_MISSING');
              core.setOutput('artifact_leak', 'not-scanned');
              return;
            }
            const passwordValues = [
              process.env.UAT_ADMIN_PASSWORD,
              process.env.UAT_MANAGER_PASSWORD,
              process.env.UAT_VIEWER_PASSWORD
            ].filter(Boolean);
            const emailValues = [
              process.env.UAT_ADMIN_EMAIL,
              process.env.UAT_MANAGER_EMAIL,
              process.env.UAT_VIEWER_EMAIL
            ].filter(Boolean);
            for (const secret of [bypassSecret, ...passwordValues, ...emailValues].filter(Boolean)) core.setSecret(secret);
            const result = spawnSync('npm', ['run', 'test:uat'], { env: { ...process.env }, stdio: 'ignore' });

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) {
                  stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                } else {
                  const content = fs.readFileSync(current);
                  const relativePath = path.relative(process.cwd(), current).replace(/\\/g, '/');
                  const finding = scanArtifact(relativePath, content, { bypassSecret, passwordValues, emailValues });
                  if (!finding.safe) flaggedArtifacts.push(finding);
                }
              }
            }

            fs.mkdirSync('test-results', { recursive: true });
            const leakCount = flaggedArtifacts.reduce((count, artifact) => count + artifact.categories.length, 0);
            fs.writeFileSync('test-results/uat-v3-artifact-summary.json', JSON.stringify({ leakCount, findings: flaggedArtifacts.map(({ path: filePath, categories }) => ({ path: sanitizeArtifactPath(filePath), categories })) }));
            core.setOutput('artifact_leak', String(leakCount));
            core.setOutput('artifact_leak_count', String(leakCount));
            for (const artifact of flaggedArtifacts) for (const category of artifact.categories) core.warning(`ARTIFACT_SCAN path=${artifact.path} category=${category}`);
            if (leakCount > 0) core.setFailed('UAT_ARTIFACT_LEAK');
            else if (result.error || result.status !== 0) core.setFailed('UAT_EXECUTION_FAILED');
            else core.info('ARTIFACT_LEAK_COUNT=0');
      - name: Run exact disposable employee lifecycle once
        if: ${{ inputs.uat_mode == 'disposable-approved-v1' }}
        id: disposable
        uses: actions/github-script@v7
        env:
          PROTECTED_FIXTURE_DB_URL: ${{ secrets['DATABASE_URL'] }}
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { scanArtifact, sanitizeArtifactPath } = require('./e2e/helpers/uat-v3-security');

            for (const secret of [process.env.PROTECTED_FIXTURE_DB_URL, process.env.UAT_ADMIN_EMAIL, process.env.UAT_ADMIN_PASSWORD].filter(Boolean)) core.setSecret(secret);
            const fixtureEnv = {
              ...process.env,
              DATABASE_URL: process.env.PROTECTED_FIXTURE_DB_URL,
              ['UAT_' + 'DISPOSABLE_EMPLOYEE_ENABLED']: 'true',
              ['UAT_' + 'DISPOSABLE_EMPLOYEE_MODE']: 'shared-approved',
              ['UAT_' + 'DISPOSABLE_EMPLOYEE_CONFIRM']: 'MUTATE_SMS_V3_DISPOSABLE_UAT_EMPLOYEE_V1',
              UAT_MANAGER_EMAIL: 'unused-manager-disposable-v1@example.invalid',
              UAT_MANAGER_PASSWORD: 'UNUSED_DISPOSABLE_V1_MANAGER',
              UAT_VIEWER_EMAIL: 'unused-viewer-disposable-v1@example.invalid',
              UAT_VIEWER_PASSWORD: 'UNUSED_DISPOSABLE_V1_VIEWER'
            };
            const tempConfig = '.uat-disposable-playwright.config.cjs';
            fs.writeFileSync(tempConfig, [
              "const base = require('./playwright.config');",
              'module.exports = { ...base, globalSetup: undefined, globalTeardown: undefined, fullyParallel: false, workers: 1, retries: 0 };'
            ].join('\n'));
            let testResult;
            try {
              testResult = spawnSync('npx', [
                'playwright', 'test', 'e2e/smoke/disposable-employee.spec.js',
                `--config=${tempConfig}`, '--workers=1', '--retries=0'
              ], { env: fixtureEnv, stdio: 'ignore' });
            } finally {
              fs.rmSync(tempConfig, { force: true });
            }

            const runHelper = (command) => spawnSync('node', ['scripts/admin/disposable-uat-employee.js', command], {
              env: fixtureEnv, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe']
            });
            const safeCode = (result) => {
              const code = String(result?.stderr || '').trim().split(/\r?\n/)[0] || '';
              return /^UAT_[A-Z0-9_]+$/.test(code) ? code : '';
            };
            let baselineCheck = runHelper('assert');
            let recoveryAttempted = false;
            let recoverySucceeded = false;
            let recoveryCode = '';
            if (baselineCheck.status !== 0) {
              recoveryAttempted = true;
              const recovery = runHelper('reset');
              recoveryCode = safeCode(recovery);
              recoverySucceeded = recovery.status === 0;
              baselineCheck = runHelper('assert');
            }
            let baseline = null;
            if (baselineCheck.status === 0) {
              try { baseline = JSON.parse(String(baselineCheck.stdout || '{}')); } catch {}
            }
            const baselineRestored = baseline?.state === 'ACTIVE_BASELINE'
              && baseline?.employeeCode === 'ZZZ-UAT-DISPOSABLE-V1'
              && baseline?.linkedUser === true
              && baseline?.lifecycleEvents === 0
              && Object.values(baseline?.dependencies || {}).every((value) => value === 0);

            let counts = null;
            if (baselineRestored) {
              const countScript = String.raw`
                const { PrismaClient } = require('@prisma/client');
                const { FIXTURE_EMPLOYEE_CODE, FIXTURE_LEGACY_EMPLOYEE_ID, FIXTURE_SKILL_MARKER, FIXTURE_USER_EMAIL, FIXTURE_LEGACY_USER_ID } = require('./scripts/admin/disposable-uat-employee');
                (async () => {
                  const prisma = new PrismaClient({ datasources: { db: { url: process.env.DATABASE_URL } } });
                  try {
                    const employee = await prisma.employee.findUnique({ where: { employeeCode: FIXTURE_EMPLOYEE_CODE } });
                    if (!employee || employee.legacyEmployeeId !== FIXTURE_LEGACY_EMPLOYEE_ID || employee.skill !== FIXTURE_SKILL_MARKER) throw new Error('UAT_EMPLOYEE_IDENTITY_MISMATCH');
                    const user = await prisma.user.findUnique({ where: { email: FIXTURE_USER_EMAIL } });
                    if (!user || user.legacyUserId !== FIXTURE_LEGACY_USER_ID || user.employeeId !== employee.id || user.role !== 'VIEWER') throw new Error('UAT_EMPLOYEE_IDENTITY_MISMATCH');
                    const [employeeCount, userCount, marker, lifecycle, employeeAudit, refreshSessions, otp, leave, quota, shift, license, licenseDocuments, lifecycleAuditRows] = await Promise.all([
                      prisma.employee.count({ where: { employeeCode: FIXTURE_EMPLOYEE_CODE, legacyEmployeeId: FIXTURE_LEGACY_EMPLOYEE_ID, skill: FIXTURE_SKILL_MARKER } }),
                      prisma.user.count({ where: { email: FIXTURE_USER_EMAIL, legacyUserId: FIXTURE_LEGACY_USER_ID, employeeId: employee.id, role: 'VIEWER' } }),
                      prisma.auditLog.count({ where: { entityType: 'DisposableUatEmployeeFixture', entityId: employee.id } }),
                      prisma.employeeLifecycleEvent.count({ where: { employeeId: employee.id } }),
                      prisma.auditLog.count({ where: { entityType: 'Employee', entityId: employee.id } }),
                      prisma.refreshSession.count({ where: { userId: user.id } }),
                      prisma.authOtpChallenge.count({ where: { userId: user.id } }),
                      prisma.leaveRequest.count({ where: { employeeId: employee.id } }),
                      prisma.leaveQuota.count({ where: { employeeId: employee.id } }),
                      prisma.shiftAssignment.count({ where: { employeeId: employee.id } }),
                      prisma.employeeLicense.count({ where: { employeeId: employee.id } }),
                      prisma.employeeLicenseDocument.count({ where: { employeeId: employee.id } }),
                      prisma.auditLog.count({ where: { entityType: 'EmployeeLifecycleEvent', metadata: { path: ['employeeId'], equals: employee.id } } })
                    ]);
                    const lifecycleEventAudit = Number(lifecycleAuditRows || 0);
                    process.stdout.write(JSON.stringify({ employee: employeeCount, user: userCount, marker, lifecycleEvents: lifecycle, lifecycleAudit: employeeAudit + lifecycleEventAudit, refreshSessions, otp, leave, quota, shift, license, licenseDocuments }));
                  } finally { await prisma.$disconnect(); }
                })().catch((error) => { process.stderr.write(String(error?.message || 'UAT_FIXTURE_COUNT_FAILED')); process.exit(1); });
              `;
              const countResult = spawnSync('node', ['-e', countScript], { env: fixtureEnv, encoding: 'utf8', stdio: ['ignore', 'pipe', 'pipe'] });
              if (countResult.status === 0) {
                try { counts = JSON.parse(String(countResult.stdout || '{}')); } catch {}
              }
            }

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                else {
                  const content = fs.readFileSync(current);
                  const relativePath = path.relative(process.cwd(), current).replace(/\\/g, '/');
                  const finding = scanArtifact(relativePath, content, {
                    passwordValues: [process.env.UAT_ADMIN_PASSWORD].filter(Boolean),
                    emailValues: [process.env.UAT_ADMIN_EMAIL].filter(Boolean)
                  });
                  if (!finding.safe) flaggedArtifacts.push(finding);
                }
              }
            }
            const leakCount = flaggedArtifacts.reduce((sum, item) => sum + item.categories.length, 0);
            fs.mkdirSync('test-results', { recursive: true });
            const summary = {
              scenario: 'DISPOSABLE_UAT_EMPLOYEE_V1',
              testPassed: !testResult.error && testResult.status === 0,
              baselineRestored,
              recoveryAttempted,
              recoverySucceeded,
              safeFailureCode: recoveryCode,
              counts,
              artifactLeakCount: leakCount
            };
            fs.writeFileSync('test-results/disposable-uat-summary.json', JSON.stringify(summary));
            fs.writeFileSync('test-results/uat-v3-artifact-summary.json', JSON.stringify({
              leakCount,
              findings: flaggedArtifacts.map(({ path: filePath, categories }) => ({ path: sanitizeArtifactPath(filePath), categories }))
            }));
            core.setOutput('baseline_restored', String(baselineRestored));
            core.setOutput('test_passed', String(summary.testPassed));
            core.setOutput('artifact_leak_count', String(leakCount));
            if (!baselineRestored && recoveryCode === 'UAT_EMPLOYEE_IDENTITY_MISMATCH') core.setFailed('FIXTURE_IDENTITY_COLLISION_BLOCKED');
            else if (!baselineRestored) core.setFailed('FIXTURE_RECOVERY_REQUIRED');
            else if (!counts || counts.employee !== 1 || counts.user !== 1 || counts.marker !== 1 || counts.lifecycleEvents !== 0 || counts.lifecycleAudit !== 0 || counts.refreshSessions !== 0 || counts.otp !== 0 || counts.leave !== 0 || counts.quota !== 0 || counts.shift !== 0 || counts.license !== 0 || counts.licenseDocuments !== 0) core.setFailed('UAT_FIXTURE_POST_RESET_COUNT_MISMATCH');
            else if (leakCount !== 0) core.setFailed('UAT_ARTIFACT_LEAK');
            else if (!summary.testPassed) core.setFailed('DISPOSABLE_UAT_APPLICATION_FAILURE_BASELINE_RESTORED');
            else core.info('DISPOSABLE_UAT_EMPLOYEE_V1=PASS');
      - name: Publish authenticated UAT summary
        if: always() && inputs.uat_mode == 'authenticated'
        shell: bash
        run: |
          {
            echo '### Automated UAT V3'
            echo "- Mode: $UAT_MODE"
            echo "- Target: $UAT_BASE_URL"
            echo "- Result: ${{ steps.uat.outcome }}"
            echo "- Artifact leak count: ${{ steps.uat.outputs.artifact_leak_count || 'not-scanned' }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload authenticated UAT artifacts
        if: always() && inputs.uat_mode == 'authenticated' && steps.uat.outputs.artifact_leak == '0'
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-authenticated-${{ github.run_id }}
          path: |
            test-results/uat-summary.md
            test-results/uat-results.json
            test-results/uat-v3-account-preflight.json
            test-results/uat-v3-artifact-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Publish disposable UAT summary
        if: always() && inputs.uat_mode == 'disposable-approved-v1'
        shell: bash
        run: |
          {
            echo '### Disposable UAT Employee V1'
            echo '- Target: exact canonical production deployment'
            echo '- Scenario: one controlled lifecycle, workers=1, retries=0'
            echo "- Result: ${{ steps.disposable.outcome }}"
            echo "- Baseline restored: ${{ steps.disposable.outputs.baseline_restored || 'unknown' }}"
            echo "- Artifact leak count: ${{ steps.disposable.outputs.artifact_leak_count || 'not-scanned' }}"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload sanitized disposable UAT artifacts
        if: always() && inputs.uat_mode == 'disposable-approved-v1' && steps.disposable.outputs.artifact_leak_count == '0'
        uses: actions/upload-artifact@v4
        with:
          name: disposable-uat-employee-${{ github.run_id }}
          path: |
            test-results/disposable-uat-summary.json
            test-results/uat-results.json
            test-results/uat-summary.md
            test-results/uat-v3-artifact-summary.json
          if-no-files-found: warn
          retention-days: 7
