name: Automated Technical Smoke sms-v3-staging

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Candidate deployment or approved canonical URL to test
        required: true
        type: string
      source_sha:
        description: Exact full Git SHA containing the technical smoke implementation
        required: true
        type: string

permissions:
  contents: read

jobs:
  technical-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate dispatch inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$UAT_BASE_URL" =~ ^https://sms-v3-staging-[A-Za-z0-9-]+\.vercel\.app/?$ ]]; then
            echo "TARGET_URL_INVALID"
            exit 1
          fi
          if [[ ! "$UAT_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "SOURCE_SHA_INVALID"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0
      - name: Verify exact approved smoke source
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(git rev-parse HEAD)" != "$UAT_SOURCE_SHA" ]]; then
            echo "SOURCE_CHECKOUT_MISMATCH"
            exit 1
          fi

          source_branch_ok=false
          if git fetch --no-tags origin test/automated-uat-smoke:refs/remotes/origin/test/automated-uat-smoke 2>/dev/null \
            && git merge-base --is-ancestor "$UAT_SOURCE_SHA" origin/test/automated-uat-smoke; then
            source_branch_ok=true
          fi
          if [[ "$source_branch_ok" != true ]] \
            && git fetch --no-tags origin fix/serverless-database-reliability:refs/remotes/origin/fix/serverless-database-reliability 2>/dev/null \
            && git merge-base --is-ancestor "$UAT_SOURCE_SHA" origin/fix/serverless-database-reliability; then
            source_branch_ok=true
          fi
          if [[ "$source_branch_ok" != true ]]; then
            echo "SOURCE_PROVENANCE_INVALID"
            exit 1
          fi
          test -f package.json
          test -f playwright.config.js
          test -f e2e/smoke/technical.spec.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run credential-optional technical smoke
        id: uat
        run: npm run test:uat
      - name: Publish UAT summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Automated Technical Smoke'
            echo "- Target: $UAT_BASE_URL"
            echo "- Source SHA: $UAT_SOURCE_SHA"
            echo "- Result: ${{ steps.uat.outcome }}"
            if [[ -f test-results/uat-summary.md ]]; then
              cat test-results/uat-summary.md
            else
              echo '- Summary: unavailable before test execution'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload UAT artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 7
