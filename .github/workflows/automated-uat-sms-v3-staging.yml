name: Automated Technical Smoke sms-v3-staging

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Candidate deployment or approved canonical URL to test
        required: true
        type: string
      target_mode:
        description: Explicit target identity mode
        required: true
        type: choice
        options:
          - candidate
          - canonical
      source_sha:
        description: Exact application-under-test SHA deployed at the target URL
        required: true
        type: string
      uat_harness_sha:
        description: Exact trusted UAT harness SHA pinned by immutable uat-harness-v3-<sha> tag
        required: true
        type: string
      expected_deployment_id:
        description: Exact expected Vercel deployment ID for report identity
        required: true
        type: string
      uat_mode:
        description: Technical/public smoke or authenticated ADMIN/MANAGER/VIEWER smoke
        required: false
        default: technical
        type: choice
        options:
          - technical
          - diagnostic
          - authenticated

permissions:
  contents: read

jobs:
  candidate-access-diagnostic:
    if: ${{ inputs.uat_mode == 'diagnostic' }}
    runs-on: ubuntu-latest
    environment: production-sms-v3-staging
    timeout-minutes: 10
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - name: Validate diagnostic source and harness
        shell: bash
        env:
          TARGET_MODE: ${{ inputs.target_mode }}
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test "$TARGET_MODE" = 'candidate'
          node e2e/helpers/uat-target-contract.js scope "$TARGET_MODE" "$TARGET_URL"
          git fetch --no-tags origin fix/employee-lifecycle-transaction-reliability
          test "$(git rev-parse origin/fix/employee-lifecycle-transaction-reliability)" = "$SOURCE_SHA"
          node e2e/helpers/uat-target-contract.js harness "$HARNESS_SHA" "$(git rev-parse HEAD)" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"
      - name: Probe Candidate HTTP access safely
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          while IFS='|' read -r label path; do
            status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$TARGET_URL$path")
            echo "CANDIDATE_ACCESS label=$label status=$status bypass_attached=YES"
          done <<'PROBES'
          root|/
          login|/login
          health|/api/v1/health
          ready|/api/v1/ready
          audit|/api/v1/audit-events?page=1&pageSize=1
          PROBES

      - name: Collect sanitized Candidate runtime 500 diagnostics
        shell: bash
        env:
          DIAGNOSTIC_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
          VERCEL_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
        run: |
          set -euo pipefail
          test -n "$DIAGNOSTIC_TOKEN"
          raw=$(mktemp)
          trap 'rm -f "$raw"' EXIT
          set +e
          npx --yes vercel@56.4.1 logs \
            --project "$VERCEL_PROJECT_ID" \
            --scope "$VERCEL_ORG_ID" \
            --environment preview \
            --branch fix/employee-lifecycle-transaction-reliability \
            --status-code 500 \
            --since 2026-08-13T12:31:50Z \
            --until 2026-08-13T12:33:00Z \
            --json \
            --token "$DIAGNOSTIC_TOKEN" >"$raw" 2>/dev/null
          cli_exit=$?
          set -e
          node - "$raw" "$cli_exit" <<'NODE'
          const fs = require('node:fs');
          const [file, cliExit] = process.argv.slice(2);
          const lines = fs.readFileSync(file, 'utf8').split(/\r?\n/).filter(Boolean);
          const events = [];
          for (const line of lines) {
            try {
              const value = JSON.parse(line);
              if (Array.isArray(value)) events.push(...value);
              else if (value && typeof value === 'object') events.push(value);
            } catch {}
          }
          const targetPath = (value) => {
            const path = String(value || '').split('?')[0];
            return ['/api/v1/health', '/api/v1/ready', '/api/v1/audit-events'].some((prefix) => path.startsWith(prefix));
          };
          const rows = [];
          for (const event of events) {
            const path = event.requestPath || event.path || event.proxy?.path || '';
            if (!targetPath(path)) continue;
            const messages = [];
            if (typeof event.message === 'string') messages.push(event.message);
            if (Array.isArray(event.logs)) for (const log of event.logs) if (typeof log?.message === 'string') messages.push(log.message);
            const text = messages.join(' ');
            const code = text.match(/\bP\d{4}\b/)?.[0] || 'unknown';
            const category = /PrismaClientInitializationError/i.test(text) ? 'prisma_initialization'
              : code === 'P1000' ? 'database_authentication'
              : code === 'P1001' ? 'database_unreachable'
              : code === 'P1002' ? 'database_connection_timeout'
              : code === 'P2024' ? 'database_pool_timeout'
              : code === 'P2028' ? 'database_transaction_error'
              : /environment variable|missing.{0,30}environment|env validation|invalid environment/i.test(text) ? 'environment_configuration'
              : /database|connection|pool|timeout/i.test(text) ? 'database_runtime'
              : 'application_runtime';
            const requestId = event.requestId || event.traceId || event.id || 'unknown';
            const status = event.responseStatusCode ?? event.statusCode ?? event.status_code ?? 500;
            const duration = event.durationMs ?? event.duration ?? event.proxy?.duration ?? 'unknown';
            const deployment = event.deploymentId || JSON.stringify(event).match(/\bdpl_[A-Za-z0-9]+\b/)?.[0] || 'unknown';
            rows.push({ path: String(path).split('?')[0], status, requestId, code, category, deployment, duration });
          }
          if (!rows.length) {
            console.log(`CANDIDATE_RUNTIME_EVIDENCE=NOT_FOUND cli_exit=${cliExit}`);
            process.exit(0);
          }
          const seen = new Set();
          for (const row of rows) {
            const key = `${row.path}|${row.requestId}|${row.code}|${row.category}`;
            if (seen.has(key)) continue;
            seen.add(key);
            console.log(`CANDIDATE_RUNTIME_EVIDENCE path=${row.path} status=${row.status} request_id=${row.requestId} prisma_code=${row.code} category=${row.category} deployment=${row.deployment} duration_ms=${row.duration}`);
          }
          NODE

  technical-smoke:
    if: ${{ inputs.uat_mode == 'technical' }}
    runs-on: ubuntu-latest
    environment: production-sms-v3-staging
    timeout-minutes: 25
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_TARGET_MODE: ${{ inputs.target_mode }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
      UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: technical
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - name: Validate target, application identity, and trusted harness
        shell: bash
        env:
          TARGET_MODE: ${{ inputs.target_mode }}
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
          EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
          EXPECTED_PROJECT_NAME: sms-v3-staging
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          node e2e/helpers/uat-target-contract.js scope "$TARGET_MODE" "$TARGET_URL"
          git fetch --no-tags origin fix/employee-lifecycle-transaction-reliability
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git cat-file -e "${HARNESS_SHA}^{commit}"
          if [[ "$(git rev-parse origin/fix/employee-lifecycle-transaction-reliability)" != "$SOURCE_SHA" ]]; then
            echo 'TECHNICAL_SMOKE_SOURCE_NOT_APPROVED_HEAD'
            exit 1
          fi
          node e2e/helpers/uat-target-contract.js harness "$HARNESS_SHA" "$(git rev-parse HEAD)" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"

          target_inspect="$(mktemp)"
          expected_inspect="$(mktemp)"
          cleanup() { rm -f "$target_inspect" "$expected_inspect"; }
          trap cleanup EXIT
          node e2e/helpers/uat-target-contract.js fetch "$TARGET_URL" "$target_inspect" "$EXPECTED_ORG_ID"
          node e2e/helpers/uat-target-contract.js fetch "$DEPLOYMENT_ID" "$expected_inspect" "$EXPECTED_ORG_ID"
          node - "$target_inspect" "$expected_inspect" <<'NODE'
          const fs = require('node:fs');
          const [targetFile, expectedFile] = process.argv.slice(2);
          const safe = (value) => value === null ? 'null' : value === undefined ? 'missing' : String(value);
          console.log(`UAT_TARGET_RECORD_TARGET=${safe(JSON.parse(fs.readFileSync(targetFile, 'utf8')).target)}`);
          console.log(`UAT_EXPECTED_RECORD_TARGET=${safe(JSON.parse(fs.readFileSync(expectedFile, 'utf8')).target)}`);
          NODE
          node e2e/helpers/uat-target-contract.js verify \
            "$TARGET_MODE" "$TARGET_URL" "$DEPLOYMENT_ID" "$SOURCE_SHA" \
            "$target_inspect" "$expected_inspect" "$EXPECTED_PROJECT_ID" "$EXPECTED_PROJECT_NAME"
          echo "TARGET_MODE=$TARGET_MODE"
          echo "APPLICATION_UNDER_TEST_SHA=$SOURCE_SHA"
          echo "TRUSTED_UAT_HARNESS_SHA=$HARNESS_SHA"
          echo "EXPECTED_DEPLOYMENT_ID=$DEPLOYMENT_ID"
      - name: Verify Candidate automation bypass before browser UAT
        if: ${{ inputs.target_mode == 'candidate' }}
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          body=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$body" "$headers"' EXIT
          status=$(curl --silent --show-error --location --max-time 20 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$TARGET_URL/")
          protected=$(node - "$body" <<'NODE'
          const fs = require('node:fs');
          const body = fs.readFileSync(process.argv[2], 'utf8');
          process.stdout.write(/<title[^>]*>\s*Login\s*[��-]\s*Vercel\s*<\/title>/i.test(body) ? 'true' : 'false');
          NODE
          )
          echo "VERCEL_AUTOMATION_BYPASS_HTTP_STATUS=$status"
          echo "VERCEL_PROTECTION_PAGE=$protected"
          if [[ "$status" != '200' || "$protected" != 'false' ]]; then
            echo 'VERCEL_AUTOMATION_BYPASS_REJECTED'
            exit 1
          fi
          echo 'VERCEL_AUTOMATION_BYPASS=PASS'
      - name: Checkout exact application under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: application-under-test
      - name: Verify separate application checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C application-under-test rev-parse HEAD)" = "$SOURCE_SHA"
          test -f application-under-test/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run technical UAT V3 without credentials
        id: uat
        uses: actions/github-script@v7
        env:
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_MODE: technical
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { isProtectedCandidateUrl } = require('./e2e/helpers/technical-smoke');
            const { scanArtifact, sanitizeArtifactPath } = require('./e2e/helpers/uat-v3-security');

            const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
            if (isProtectedCandidateUrl(process.env.UAT_BASE_URL) && !bypassSecret) {
              core.setFailed('VERCEL_AUTOMATION_BYPASS_SECRET_MISSING');
              core.setOutput('artifact_leak', 'not-scanned');
              return;
            }
            if (bypassSecret) core.setSecret(bypassSecret);
            const result = spawnSync('npm', ['run', 'test:uat'], { env: { ...process.env }, stdio: 'ignore' });

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) {
                  stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                } else {
                  const content = fs.readFileSync(current);
                  const relativePath = path.relative(process.cwd(), current).replace(/\\/g, '/');
                  const finding = scanArtifact(relativePath, content, { bypassSecret });
                  if (!finding.safe) flaggedArtifacts.push(finding);
                }
              }
            }

            fs.mkdirSync('test-results', { recursive: true });
            const leakCount = flaggedArtifacts.reduce((count, artifact) => count + artifact.categories.length, 0);
            fs.writeFileSync('test-results/uat-v3-artifact-summary.json', JSON.stringify({ leakCount, findings: flaggedArtifacts.map(({ path: filePath, categories }) => ({ path: sanitizeArtifactPath(filePath), categories })) }));
            core.setOutput('artifact_leak', String(leakCount));
            core.setOutput('artifact_leak_count', String(leakCount));
            for (const artifact of flaggedArtifacts) for (const category of artifact.categories) core.warning(`ARTIFACT_SCAN path=${artifact.path} category=${category}`);
            if (leakCount > 0) core.setFailed('UAT_ARTIFACT_LEAK');
            else if (result.error || result.status !== 0) core.setFailed('UAT_EXECUTION_FAILED');
            else core.info('ARTIFACT_LEAK_COUNT=0');
      - name: Publish technical UAT summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Automated UAT V3'
            echo "- Mode: $UAT_MODE"
            echo "- Target: $UAT_BASE_URL"
            echo "- Result: ${{ steps.uat.outcome }}"
            echo "- Artifact leak count: ${{ steps.uat.outputs.artifact_leak_count || 'not-scanned' }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload technical UAT artifacts
        if: always() && steps.uat.outputs.artifact_leak == '0'
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-technical-${{ github.run_id }}
          path: |
            test-results/uat-summary.md
            test-results/uat-results.json
            test-results/uat-v3-account-preflight.json
            test-results/uat-v3-artifact-summary.json
          if-no-files-found: warn
          retention-days: 7

  authenticated-uat:
    if: ${{ inputs.uat_mode == 'authenticated' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-sms-v3-staging
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_TARGET_MODE: ${{ inputs.target_mode }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
      UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: authenticated
      PLAYWRIGHT_NO_COPY_PROMPT: 1
      UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
      UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
      UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
      UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
      UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
      UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - name: Validate target, application identity, and trusted harness
        shell: bash
        env:
          TARGET_MODE: ${{ inputs.target_mode }}
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
          EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
          EXPECTED_PROJECT_NAME: sms-v3-staging
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          node e2e/helpers/uat-target-contract.js scope "$TARGET_MODE" "$TARGET_URL"
          git fetch --no-tags origin fix/employee-lifecycle-transaction-reliability
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git cat-file -e "${HARNESS_SHA}^{commit}"
          if [[ "$(git rev-parse origin/fix/employee-lifecycle-transaction-reliability)" != "$SOURCE_SHA" ]]; then
            echo 'TECHNICAL_SMOKE_SOURCE_NOT_APPROVED_HEAD'
            exit 1
          fi
          node e2e/helpers/uat-target-contract.js harness "$HARNESS_SHA" "$(git rev-parse HEAD)" "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"

          target_inspect="$(mktemp)"
          expected_inspect="$(mktemp)"
          cleanup() { rm -f "$target_inspect" "$expected_inspect"; }
          trap cleanup EXIT
          node e2e/helpers/uat-target-contract.js fetch "$TARGET_URL" "$target_inspect" "$EXPECTED_ORG_ID"
          node e2e/helpers/uat-target-contract.js fetch "$DEPLOYMENT_ID" "$expected_inspect" "$EXPECTED_ORG_ID"
          node - "$target_inspect" "$expected_inspect" <<'NODE'
          const fs = require('node:fs');
          const [targetFile, expectedFile] = process.argv.slice(2);
          const safe = (value) => value === null ? 'null' : value === undefined ? 'missing' : String(value);
          console.log(`UAT_TARGET_RECORD_TARGET=${safe(JSON.parse(fs.readFileSync(targetFile, 'utf8')).target)}`);
          console.log(`UAT_EXPECTED_RECORD_TARGET=${safe(JSON.parse(fs.readFileSync(expectedFile, 'utf8')).target)}`);
          NODE
          node e2e/helpers/uat-target-contract.js verify \
            "$TARGET_MODE" "$TARGET_URL" "$DEPLOYMENT_ID" "$SOURCE_SHA" \
            "$target_inspect" "$expected_inspect" "$EXPECTED_PROJECT_ID" "$EXPECTED_PROJECT_NAME"
          echo "TARGET_MODE=$TARGET_MODE"
          echo "APPLICATION_UNDER_TEST_SHA=$SOURCE_SHA"
          echo "TRUSTED_UAT_HARNESS_SHA=$HARNESS_SHA"
          echo "EXPECTED_DEPLOYMENT_ID=$DEPLOYMENT_ID"
      - name: Verify Candidate automation bypass before browser UAT
        if: ${{ inputs.target_mode == 'candidate' }}
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          body=$(mktemp)
          headers=$(mktemp)
          trap 'rm -f "$body" "$headers"' EXIT
          status=$(curl --silent --show-error --location --max-time 20 \
            --dump-header "$headers" --output "$body" --write-out '%{http_code}' \
            -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
            "$TARGET_URL/")
          protected=$(node - "$body" <<'NODE'
          const fs = require('node:fs');
          const body = fs.readFileSync(process.argv[2], 'utf8');
          process.stdout.write(/<title[^>]*>\s*Login\s*[��-]\s*Vercel\s*<\/title>/i.test(body) ? 'true' : 'false');
          NODE
          )
          echo "VERCEL_AUTOMATION_BYPASS_HTTP_STATUS=$status"
          echo "VERCEL_PROTECTION_PAGE=$protected"
          if [[ "$status" != '200' || "$protected" != 'false' ]]; then
            echo 'VERCEL_AUTOMATION_BYPASS_REJECTED'
            exit 1
          fi
          echo 'VERCEL_AUTOMATION_BYPASS=PASS'
      - name: Checkout exact application under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: application-under-test
      - name: Verify separate application checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C application-under-test rev-parse HEAD)" = "$SOURCE_SHA"
          test -f application-under-test/package.json
      - name: Require all authenticated UAT credentials
        shell: bash
        env:
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
          UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
        run: |
          set -euo pipefail
          for role in ADMIN MANAGER VIEWER; do
            email_key="UAT_${role}_EMAIL"
            password_key="UAT_${role}_PASSWORD"
            email_value="${!email_key-}"
            password_value="${!password_key-}"
            if [[ -z "$email_value" || -z "$password_value" ]]; then
              echo 'UAT_CREDENTIALS_REQUIRED'
              exit 1
            fi
          done
          echo 'UAT_CREDENTIAL_CONTRACT=VALID'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated UAT V3
        id: uat
        uses: actions/github-script@v7
        env:
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_MODE: authenticated
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
          UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { isProtectedCandidateUrl } = require('./e2e/helpers/technical-smoke');
            const { scanArtifact, sanitizeArtifactPath } = require('./e2e/helpers/uat-v3-security');

            const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
            if (isProtectedCandidateUrl(process.env.UAT_BASE_URL) && !bypassSecret) {
              core.setFailed('VERCEL_AUTOMATION_BYPASS_SECRET_MISSING');
              core.setOutput('artifact_leak', 'not-scanned');
              return;
            }
            const passwordValues = [
              process.env.UAT_ADMIN_PASSWORD,
              process.env.UAT_MANAGER_PASSWORD,
              process.env.UAT_VIEWER_PASSWORD
            ].filter(Boolean);
            const emailValues = [
              process.env.UAT_ADMIN_EMAIL,
              process.env.UAT_MANAGER_EMAIL,
              process.env.UAT_VIEWER_EMAIL
            ].filter(Boolean);
            for (const secret of [bypassSecret, ...passwordValues, ...emailValues].filter(Boolean)) core.setSecret(secret);
            const result = spawnSync('npm', ['run', 'test:uat'], { env: { ...process.env }, stdio: 'ignore' });

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) {
                  stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                } else {
                  const content = fs.readFileSync(current);
                  const relativePath = path.relative(process.cwd(), current).replace(/\\/g, '/');
                  const finding = scanArtifact(relativePath, content, { bypassSecret, passwordValues, emailValues });
                  if (!finding.safe) flaggedArtifacts.push(finding);
                }
              }
            }

            fs.mkdirSync('test-results', { recursive: true });
            const leakCount = flaggedArtifacts.reduce((count, artifact) => count + artifact.categories.length, 0);
            fs.writeFileSync('test-results/uat-v3-artifact-summary.json', JSON.stringify({ leakCount, findings: flaggedArtifacts.map(({ path: filePath, categories }) => ({ path: sanitizeArtifactPath(filePath), categories })) }));
            core.setOutput('artifact_leak', String(leakCount));
            core.setOutput('artifact_leak_count', String(leakCount));
            for (const artifact of flaggedArtifacts) for (const category of artifact.categories) core.warning(`ARTIFACT_SCAN path=${artifact.path} category=${category}`);
            if (leakCount > 0) core.setFailed('UAT_ARTIFACT_LEAK');
            else if (result.error || result.status !== 0) core.setFailed('UAT_EXECUTION_FAILED');
            else core.info('ARTIFACT_LEAK_COUNT=0');
      - name: Publish authenticated UAT summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Automated UAT V3'
            echo "- Mode: $UAT_MODE"
            echo "- Target: $UAT_BASE_URL"
            echo "- Result: ${{ steps.uat.outcome }}"
            echo "- Artifact leak count: ${{ steps.uat.outputs.artifact_leak_count || 'not-scanned' }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload authenticated UAT artifacts
        if: always() && steps.uat.outputs.artifact_leak == '0'
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-authenticated-${{ github.run_id }}
          path: |
            test-results/uat-summary.md
            test-results/uat-results.json
            test-results/uat-v3-account-preflight.json
            test-results/uat-v3-artifact-summary.json
          if-no-files-found: warn
          retention-days: 7
