name: Automated Technical Smoke sms-v3-staging

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Preview, Candidate deployment, or approved canonical URL to test
        required: true
        type: string
      target_mode:
        description: Explicit target identity mode
        required: true
        type: choice
        options:
          - preview
          - candidate
          - canonical
      source_sha:
        description: Exact application-under-test SHA deployed at the target URL
        required: true
        type: string
      source_branch:
        description: Exact remote application source branch whose HEAD must equal source_sha
        required: true
        type: string
      uat_harness_sha:
        description: Exact trusted UAT harness HEAD from test/automated-uat-v3-authenticated
        required: true
        type: string
      expected_deployment_id:
        description: Exact expected Vercel deployment ID for report identity
        required: true
        type: string
      uat_mode:
        description: Technical/public smoke or authenticated ADMIN/MANAGER/VIEWER smoke
        required: false
        default: technical
        type: choice
        options:
          - technical
          - authenticated
      uat_scope:
        description: Approved fixed UAT scope
        required: false
        default: full
        type: choice
        options:
          - full
          - report-center-diagnostic
          - responsive-network-targeted
          - admin-rbac-targeted-retry
          - g03-readonly-targeted
          - q13b-specialist-write-targeted
          - q13c-business-workflow-targeted
      q13b_write_confirmation:
        description: Exact Q13-B Preview mutation confirmation; required only for q13b-specialist-write-targeted
        required: false
        default: ''
        type: string
      q13c_write_confirmation:
        description: Exact Q13-C Preview mutation confirmation; required only for q13c-business-workflow-targeted
        required: false
        default: ''
        type: string
permissions:
  contents: read

jobs:
  technical-smoke:
    if: ${{ inputs.uat_mode == 'technical' && inputs.uat_scope != 'q13b-specialist-write-targeted' && inputs.uat_scope != 'q13c-business-workflow-targeted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-sms-v3-staging
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_TARGET_MODE: ${{ inputs.target_mode }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_SOURCE_BRANCH: ${{ inputs.source_branch }}
      UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
      UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: technical
      UAT_SCOPE: ${{ inputs.uat_scope }}
      UAT_STAGE_DIAGNOSTIC_FILE: ${{ github.workspace }}/test-results/uat-v3-stage-diagnostics.jsonl
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - name: Validate target, application identity, and trusted harness
        shell: bash
        env:
          TARGET_MODE: ${{ inputs.target_mode }}
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_TEAM_ID: team_nemCExHbZ8EAhSgsvefHPAEz
          EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
          EXPECTED_PROJECT_NAME: sms-v3-staging
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          node e2e/helpers/uat-target-contract.js scope "$TARGET_MODE" "$TARGET_URL"
          node e2e/helpers/uat-target-contract.js source-branch "$SOURCE_BRANCH"
          if [[ "$SOURCE_BRANCH" == refs/* || "$SOURCE_BRANCH" == -* ]] || ! git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null; then
            echo 'UAT_SOURCE_BRANCH_INVALID'
            exit 1
          fi
          if ! git fetch --no-tags origin \
            "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH" \
            refs/heads/test/automated-uat-v2-regression-guards:refs/remotes/origin/test/automated-uat-v2-regression-guards \
            refs/heads/test/automated-uat-v3-authenticated:refs/remotes/origin/test/automated-uat-v3-authenticated; then
            echo 'UAT_SOURCE_BRANCH_FETCH_FAILED'
            exit 1
          fi
          REMOTE_SOURCE_SHA="$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")"
          node e2e/helpers/uat-target-contract.js source-head "$SOURCE_BRANCH" "$REMOTE_SOURCE_SHA" "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git cat-file -e "${HARNESS_SHA}^{commit}"
          APPROVED_HARNESS_SHA="$(git rev-parse origin/test/automated-uat-v3-authenticated)"
          node e2e/helpers/uat-target-contract.js harness "$HARNESS_SHA" "$(git rev-parse HEAD)" "$APPROVED_HARNESS_SHA"

          identity_tmp_dir="$(mktemp -d)"
          test -n "$identity_tmp_dir"
          test -d "$identity_tmp_dir"
          target_response="$identity_tmp_dir/target-response.json"
          expected_response="$identity_tmp_dir/expected-response.json"
          target_identity="$identity_tmp_dir/target-identity.json"
          expected_identity="$identity_tmp_dir/expected-identity.json"
          cleanup() {
            if [[ -n "${identity_tmp_dir:-}" && "$identity_tmp_dir" != / && -d "$identity_tmp_dir" ]]; then
              rm -rf -- "$identity_tmp_dir"
            fi
          }
          trap cleanup EXIT
          test ! -e "$target_response"
          test ! -e "$expected_response"
          test ! -e "$target_identity"
          test ! -e "$expected_identity"
          TARGET_HOST="${TARGET_URL#https://}"
          EXPECTED_GIT_REF=''
          if [[ "$TARGET_MODE" == candidate || "$TARGET_MODE" == preview ]]; then EXPECTED_GIT_REF="$SOURCE_BRANCH"; fi
          fetch_deployment() {
            local lookup="$1"
            local output="$2"
            if ! curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --get \
              --data-urlencode "teamId=$EXPECTED_TEAM_ID" \
              --data-urlencode 'withGitRepoInfo=true' \
              "https://api.vercel.com/v13/deployments/$lookup" >"$output" 2>/dev/null; then
              echo 'UAT_VERCEL_REST_FETCH_FAILED'
              exit 1
            fi
            test -s "$output"
          }
          fetch_deployment "$TARGET_HOST" "$target_response"
          test -s "$target_response"
          fetch_deployment "$DEPLOYMENT_ID" "$expected_response"
          test -s "$expected_response"
          test ! -e "$target_identity"
          if ! node e2e/helpers/uat-vercel-identity.js sanitize "$target_response" "$target_identity"; then
            echo 'UAT_VERCEL_RESPONSE_SANITIZE_FAILED'
            exit 1
          fi
          test -s "$target_identity"
          test ! -e "$expected_identity"
          if ! node e2e/helpers/uat-vercel-identity.js sanitize "$expected_response" "$expected_identity"; then
            echo 'UAT_VERCEL_RESPONSE_SANITIZE_FAILED'
            exit 1
          fi
          test -s "$expected_identity"
          node e2e/helpers/uat-target-contract.js verify \
            "$TARGET_MODE" "$TARGET_URL" "$DEPLOYMENT_ID" "$SOURCE_SHA" \
            "$target_identity" "$expected_identity" "$EXPECTED_PROJECT_ID" "$EXPECTED_PROJECT_NAME" "$EXPECTED_GIT_REF"
          echo "TARGET_MODE=$TARGET_MODE"
          echo "APPLICATION_SOURCE_BRANCH=$SOURCE_BRANCH"
          echo "APPLICATION_SOURCE_HEAD=$REMOTE_SOURCE_SHA"
          echo "APPLICATION_UNDER_TEST_SHA=$SOURCE_SHA"
          echo "TRUSTED_UAT_HARNESS_SHA=$HARNESS_SHA"
          echo "EXPECTED_DEPLOYMENT_ID=$DEPLOYMENT_ID"
          echo "DEPLOYMENT_IDENTITY_SOURCE=VERCEL_REST_V13"
      - name: Checkout exact application under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: application-under-test
      - name: Verify separate application checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C application-under-test rev-parse HEAD)" = "$SOURCE_SHA"
          test -f application-under-test/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run technical UAT V3 without credentials
        id: uat
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_MODE: technical
          UAT_SCOPE: ${{ inputs.uat_scope }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { isProtectedCandidateUrl } = require('./e2e/helpers/technical-smoke');
            const { sanitizeArtifactContent, scanArtifact, sanitizeArtifactPath } = require('./e2e/helpers/uat-v3-security');

            const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
            if (isProtectedCandidateUrl(process.env.UAT_BASE_URL) && !bypassSecret) {
              core.setFailed('VERCEL_AUTOMATION_BYPASS_SECRET_MISSING');
              core.setOutput('artifact_leak', 'not-scanned');
              return;
            }
            if (bypassSecret) core.setSecret(bypassSecret);
            const result = spawnSync('npm', ['run', 'test:uat'], { env: { ...process.env }, stdio: 'ignore' });

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) {
                  stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                } else {
                  const content = fs.readFileSync(current);
                  const relativePath = path.relative(process.cwd(), current).replace(/\\/g, '/');
                  const sanitizedContent = sanitizeArtifactContent(relativePath, content, { bypassSecret });
                  if (!sanitizedContent.equals(content)) fs.writeFileSync(current, sanitizedContent);
                  const finding = scanArtifact(relativePath, sanitizedContent, { bypassSecret });
                  if (!finding.safe) flaggedArtifacts.push(finding);
                }
              }
            }

            fs.mkdirSync('test-results', { recursive: true });
            const leakCount = flaggedArtifacts.reduce((count, artifact) => count + artifact.categories.length, 0);
            fs.writeFileSync('test-results/uat-v3-artifact-summary.json', JSON.stringify({ leakCount, findings: flaggedArtifacts.map(({ path: filePath, categories }) => ({ path: sanitizeArtifactPath(filePath), categories })) }));
            core.setOutput('artifact_leak', String(leakCount));
            core.setOutput('artifact_leak_count', String(leakCount));
            for (const artifact of flaggedArtifacts) for (const category of artifact.categories) core.warning(`ARTIFACT_SCAN path=${artifact.path} category=${category}`);
            if (leakCount > 0) core.setFailed('UAT_ARTIFACT_LEAK');
            else if (result.error || result.status !== 0) core.setFailed('UAT_EXECUTION_FAILED');
            else core.info('ARTIFACT_LEAK_COUNT=0');
      - name: Publish technical UAT summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Automated UAT V3'
            echo "- Mode: $UAT_MODE"
            echo "- Target: $UAT_BASE_URL"
            echo "- Result: ${{ steps.uat.outcome }}"
            echo "- Artifact leak count: ${{ steps.uat.outputs.artifact_leak_count || 'not-scanned' }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload technical UAT artifacts
        if: always() && steps.uat.outputs.artifact_leak == '0'
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-technical-${{ github.run_id }}
          path: |
            test-results/uat-summary.md
            test-results/uat-results.json
            test-results/uat-v3-account-preflight.json
            test-results/uat-v3-artifact-summary.json
            test-results/uat-v3-stage-diagnostics.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Upload technical UAT safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-technical-diagnostics-${{ github.run_id }}
          path: |
            test-results/uat-v3-artifact-summary.json
            test-results/uat-v3-stage-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce technical UAT result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.uat.outputs.artifact_leak }}" != "0" ]]; then
            echo 'UAT_ARTIFACT_LEAK'
            exit 1
          fi
          if [[ "${{ steps.uat.outcome }}" != success ]]; then
            echo 'UAT_EXECUTION_FAILED'
            exit 1
          fi

  authenticated-uat:
    if: ${{ inputs.uat_mode == 'authenticated' && inputs.uat_scope != 'q13b-specialist-write-targeted' && inputs.uat_scope != 'q13c-business-workflow-targeted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production-sms-v3-staging
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_TARGET_MODE: ${{ inputs.target_mode }}
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_SOURCE_BRANCH: ${{ inputs.source_branch }}
      UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
      UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: authenticated
      UAT_SCOPE: ${{ inputs.uat_scope }}
      UAT_STAGE_DIAGNOSTIC_FILE: ${{ github.workspace }}/test-results/uat-v3-stage-diagnostics.jsonl
      PLAYWRIGHT_NO_COPY_PROMPT: 1
      UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
      UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
      UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
      UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
      UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
      UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - name: Validate target, application identity, and trusted harness
        shell: bash
        env:
          TARGET_MODE: ${{ inputs.target_mode }}
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          EXPECTED_TEAM_ID: team_nemCExHbZ8EAhSgsvefHPAEz
          EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
          EXPECTED_PROJECT_NAME: sms-v3-staging
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN"
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$HARNESS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]]
          node e2e/helpers/uat-target-contract.js scope "$TARGET_MODE" "$TARGET_URL"
          node e2e/helpers/uat-target-contract.js source-branch "$SOURCE_BRANCH"
          if [[ "$SOURCE_BRANCH" == refs/* || "$SOURCE_BRANCH" == -* ]] || ! git check-ref-format --branch "$SOURCE_BRANCH" >/dev/null; then
            echo 'UAT_SOURCE_BRANCH_INVALID'
            exit 1
          fi
          if ! git fetch --no-tags origin \
            "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH" \
            refs/heads/test/automated-uat-v2-regression-guards:refs/remotes/origin/test/automated-uat-v2-regression-guards \
            refs/heads/test/automated-uat-v3-authenticated:refs/remotes/origin/test/automated-uat-v3-authenticated; then
            echo 'UAT_SOURCE_BRANCH_FETCH_FAILED'
            exit 1
          fi
          REMOTE_SOURCE_SHA="$(git rev-parse "refs/remotes/origin/$SOURCE_BRANCH")"
          node e2e/helpers/uat-target-contract.js source-head "$SOURCE_BRANCH" "$REMOTE_SOURCE_SHA" "$SOURCE_SHA"
          git cat-file -e "${SOURCE_SHA}^{commit}"
          git cat-file -e "${HARNESS_SHA}^{commit}"
          APPROVED_HARNESS_SHA="$(git rev-parse origin/test/automated-uat-v3-authenticated)"
          node e2e/helpers/uat-target-contract.js harness "$HARNESS_SHA" "$(git rev-parse HEAD)" "$APPROVED_HARNESS_SHA"

          identity_tmp_dir="$(mktemp -d)"
          test -n "$identity_tmp_dir"
          test -d "$identity_tmp_dir"
          target_response="$identity_tmp_dir/target-response.json"
          expected_response="$identity_tmp_dir/expected-response.json"
          target_identity="$identity_tmp_dir/target-identity.json"
          expected_identity="$identity_tmp_dir/expected-identity.json"
          cleanup() {
            if [[ -n "${identity_tmp_dir:-}" && "$identity_tmp_dir" != / && -d "$identity_tmp_dir" ]]; then
              rm -rf -- "$identity_tmp_dir"
            fi
          }
          trap cleanup EXIT
          test ! -e "$target_response"
          test ! -e "$expected_response"
          test ! -e "$target_identity"
          test ! -e "$expected_identity"
          TARGET_HOST="${TARGET_URL#https://}"
          EXPECTED_GIT_REF=''
          if [[ "$TARGET_MODE" == candidate || "$TARGET_MODE" == preview ]]; then EXPECTED_GIT_REF="$SOURCE_BRANCH"; fi
          fetch_deployment() {
            local lookup="$1"
            local output="$2"
            if ! curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
              --header "Authorization: Bearer $VERCEL_TOKEN" \
              --get \
              --data-urlencode "teamId=$EXPECTED_TEAM_ID" \
              --data-urlencode 'withGitRepoInfo=true' \
              "https://api.vercel.com/v13/deployments/$lookup" >"$output" 2>/dev/null; then
              echo 'UAT_VERCEL_REST_FETCH_FAILED'
              exit 1
            fi
            test -s "$output"
          }
          fetch_deployment "$TARGET_HOST" "$target_response"
          test -s "$target_response"
          fetch_deployment "$DEPLOYMENT_ID" "$expected_response"
          test -s "$expected_response"
          test ! -e "$target_identity"
          if ! node e2e/helpers/uat-vercel-identity.js sanitize "$target_response" "$target_identity"; then
            echo 'UAT_VERCEL_RESPONSE_SANITIZE_FAILED'
            exit 1
          fi
          test -s "$target_identity"
          test ! -e "$expected_identity"
          if ! node e2e/helpers/uat-vercel-identity.js sanitize "$expected_response" "$expected_identity"; then
            echo 'UAT_VERCEL_RESPONSE_SANITIZE_FAILED'
            exit 1
          fi
          test -s "$expected_identity"
          node e2e/helpers/uat-target-contract.js verify \
            "$TARGET_MODE" "$TARGET_URL" "$DEPLOYMENT_ID" "$SOURCE_SHA" \
            "$target_identity" "$expected_identity" "$EXPECTED_PROJECT_ID" "$EXPECTED_PROJECT_NAME" "$EXPECTED_GIT_REF"
          echo "TARGET_MODE=$TARGET_MODE"
          echo "APPLICATION_SOURCE_BRANCH=$SOURCE_BRANCH"
          echo "APPLICATION_SOURCE_HEAD=$REMOTE_SOURCE_SHA"
          echo "APPLICATION_UNDER_TEST_SHA=$SOURCE_SHA"
          echo "TRUSTED_UAT_HARNESS_SHA=$HARNESS_SHA"
          echo "EXPECTED_DEPLOYMENT_ID=$DEPLOYMENT_ID"
          echo "DEPLOYMENT_IDENTITY_SOURCE=VERCEL_REST_V13"
      - name: Checkout exact application under test
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: application-under-test
      - name: Verify separate application checkout
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HARNESS_SHA"
          test "$(git -C application-under-test rev-parse HEAD)" = "$SOURCE_SHA"
          test -f application-under-test/package.json
      - name: Require all authenticated UAT credentials
        shell: bash
        env:
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
          UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
        run: |
          set -euo pipefail
          for role in ADMIN MANAGER VIEWER; do
            email_key="UAT_${role}_EMAIL"
            password_key="UAT_${role}_PASSWORD"
            email_value="${!email_key-}"
            password_value="${!password_key-}"
            if [[ -z "$email_value" || -z "$password_value" ]]; then
              echo 'UAT_CREDENTIALS_REQUIRED'
              exit 1
            fi
          done
          echo 'UAT_CREDENTIAL_CONTRACT=VALID'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify G03.1 Auth personas have existing 2026 annual authority
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
        run: |
          set -euo pipefail
          node application-under-test/scripts/ci/verify-deployment-target.js --verify
          node scripts/ci/g03-1-auth-persona-preflight.js
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run authenticated UAT V3
        id: uat
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_MODE: authenticated
          UAT_SCOPE: ${{ inputs.uat_scope }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
          UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
          UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
          UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
          UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
          UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const { spawnSync } = require('node:child_process');
            const { isProtectedCandidateUrl } = require('./e2e/helpers/technical-smoke');
            const { sanitizeArtifactContent, scanArtifact, sanitizeArtifactPath } = require('./e2e/helpers/uat-v3-security');

            const bypassSecret = process.env.VERCEL_AUTOMATION_BYPASS_SECRET || '';
            if (isProtectedCandidateUrl(process.env.UAT_BASE_URL) && !bypassSecret) {
              core.setFailed('VERCEL_AUTOMATION_BYPASS_SECRET_MISSING');
              core.setOutput('artifact_leak', 'not-scanned');
              return;
            }
            const passwordValues = [
              process.env.UAT_ADMIN_PASSWORD,
              process.env.UAT_MANAGER_PASSWORD,
              process.env.UAT_VIEWER_PASSWORD
            ].filter(Boolean);
            const emailValues = [
              process.env.UAT_ADMIN_EMAIL,
              process.env.UAT_MANAGER_EMAIL,
              process.env.UAT_VIEWER_EMAIL
            ].filter(Boolean);
            for (const secret of [bypassSecret, ...passwordValues, ...emailValues].filter(Boolean)) core.setSecret(secret);
            const result = spawnSync('npm', ['run', 'test:uat'], { env: { ...process.env }, stdio: 'ignore' });

            const flaggedArtifacts = [];
            for (const root of ['playwright-report', 'test-results']) {
              if (!fs.existsSync(root)) continue;
              const stack = [root];
              while (stack.length) {
                const current = stack.pop();
                const stat = fs.statSync(current);
                if (stat.isDirectory()) {
                  stack.push(...fs.readdirSync(current).map((entry) => path.join(current, entry)));
                } else {
                  const content = fs.readFileSync(current);
                  const relativePath = path.relative(process.cwd(), current).replace(/\\/g, '/');
                  const sanitizedContent = sanitizeArtifactContent(relativePath, content, { bypassSecret, passwordValues, emailValues });
                  if (!sanitizedContent.equals(content)) fs.writeFileSync(current, sanitizedContent);
                  const finding = scanArtifact(relativePath, sanitizedContent, { bypassSecret, passwordValues, emailValues });
                  if (!finding.safe) flaggedArtifacts.push(finding);
                }
              }
            }

            fs.mkdirSync('test-results', { recursive: true });
            const leakCount = flaggedArtifacts.reduce((count, artifact) => count + artifact.categories.length, 0);
            fs.writeFileSync('test-results/uat-v3-artifact-summary.json', JSON.stringify({ leakCount, findings: flaggedArtifacts.map(({ path: filePath, categories }) => ({ path: sanitizeArtifactPath(filePath), categories })) }));
            core.setOutput('artifact_leak', String(leakCount));
            core.setOutput('artifact_leak_count', String(leakCount));
            for (const artifact of flaggedArtifacts) for (const category of artifact.categories) core.warning(`ARTIFACT_SCAN path=${artifact.path} category=${category}`);
            if (leakCount > 0) core.setFailed('UAT_ARTIFACT_LEAK');
            else if (result.error || result.status !== 0) core.setFailed('UAT_EXECUTION_FAILED');
            else core.info('ARTIFACT_LEAK_COUNT=0');
      - name: Publish authenticated UAT summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Automated UAT V3'
            echo "- Mode: $UAT_MODE"
            echo "- Target: $UAT_BASE_URL"
            echo "- Result: ${{ steps.uat.outcome }}"
            echo "- Artifact leak count: ${{ steps.uat.outputs.artifact_leak_count || 'not-scanned' }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload authenticated UAT artifacts
        if: always() && steps.uat.outputs.artifact_leak == '0'
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-authenticated-${{ github.run_id }}
          path: |
            test-results/uat-summary.md
            test-results/uat-results.json
            test-results/uat-v3-account-preflight.json
            test-results/uat-v3-artifact-summary.json
            test-results/uat-v3-stage-diagnostics.jsonl
          if-no-files-found: warn
          retention-days: 7
      - name: Upload authenticated UAT safe diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automated-uat-authenticated-diagnostics-${{ github.run_id }}
          path: |
            test-results/uat-v3-artifact-summary.json
            test-results/uat-v3-stage-diagnostics.jsonl
          if-no-files-found: ignore
          retention-days: 7
      - name: Enforce authenticated UAT result
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.uat.outputs.artifact_leak }}" != "0" ]]; then
            echo 'UAT_ARTIFACT_LEAK'
            exit 1
          fi
          if [[ "${{ steps.uat.outcome }}" != success ]]; then
            echo 'UAT_EXECUTION_FAILED'
            exit 1
          fi

  q13b-identity-preflight:
    if: ${{ inputs.uat_mode == 'authenticated' && inputs.uat_scope == 'q13b-specialist-write-targeted' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production-sms-v3-staging
    env:
      Q13B_CONFIRMATION: MUTATE_Q13B_PREVIEW_SPECIALIST_V1
      Q13B_HARNESS_BRANCH: test/automated-uat-v3-authenticated
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - name: Verify exact Preview, application, and harness identity
        shell: bash
        env:
          TARGET_URL: ${{ inputs.target_url }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          WRITE_CONFIRMATION: ${{ inputs.q13b_write_confirmation }}
        run: |
          set -euo pipefail
          [[ "$WRITE_CONFIRMATION" == "$Q13B_CONFIRMATION" ]] || { echo Q13B_CONFIRMATION_REQUIRED; exit 1; }
          [[ "$TARGET_URL" =~ ^https://sms-v3-staging-[a-z0-9]+-godzillazz\.vercel\.app$ ]] || { echo Q13B_PREVIEW_URL_INVALID; exit 1; }
          [[ "$TARGET_URL" != 'https://sms-v3-staging-ten.vercel.app' ]] || { echo Q13B_PREVIEW_ONLY; exit 1; }
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo Q13B_SOURCE_SHA_INVALID; exit 1; }
          [[ "$HARNESS_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo Q13B_HARNESS_SHA_INVALID; exit 1; }
          [[ "$DEPLOYMENT_ID" =~ ^dpl_[A-Za-z0-9]+$ ]] || { echo Q13B_DEPLOYMENT_ID_INVALID; exit 1; }
          [[ "$(git rev-parse HEAD)" == "$HARNESS_SHA" ]] || { echo Q13B_CHECKOUT_HARNESS_MISMATCH; exit 1; }
          git fetch --no-tags origin \
            "refs/heads/$SOURCE_BRANCH:refs/remotes/origin/$SOURCE_BRANCH" \
            "refs/heads/$Q13B_HARNESS_BRANCH:refs/remotes/origin/$Q13B_HARNESS_BRANCH"
          [[ "$(git rev-parse refs/remotes/origin/$SOURCE_BRANCH)" == "$SOURCE_SHA" ]] || { echo Q13B_SOURCE_HEAD_DRIFT; exit 1; }
          [[ "$(git rev-parse refs/remotes/origin/$Q13B_HARNESS_BRANCH)" == "$HARNESS_SHA" ]] || { echo Q13B_HARNESS_HEAD_DRIFT; exit 1; }
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          identity="$(mktemp)"
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 \
            --header "Authorization: Bearer $VERCEL_TOKEN" \
            --get --data-urlencode "teamId=$VERCEL_ORG_ID" \
            "https://api.vercel.com/v13/deployments/$DEPLOYMENT_ID" > "$identity"
          [[ "$(jq -r '.id // ""' "$identity")" == "$DEPLOYMENT_ID" ]] || { echo Q13B_DEPLOYMENT_ID_MISMATCH; exit 1; }
          [[ "$(jq -r '.projectId // .project.id // ""' "$identity")" == "$VERCEL_PROJECT_ID" ]] || { echo Q13B_PROJECT_MISMATCH; exit 1; }
          [[ "$(jq -r '.readyState // ""' "$identity")" == 'READY' ]] || { echo Q13B_DEPLOYMENT_NOT_READY; exit 1; }
          [[ -z "$(jq -r '.target // ""' "$identity")" ]] || { echo Q13B_TARGET_NOT_PREVIEW; exit 1; }
          [[ "$(jq -r '.meta.githubCommitSha // ""' "$identity")" == "$SOURCE_SHA" ]] || { echo Q13B_DEPLOYMENT_SHA_MISMATCH; exit 1; }
          target_host="${TARGET_URL#https://}"
          [[ "$(jq -r '.url // ""' "$identity")" == "$target_host" ]] || { echo Q13B_DEPLOYMENT_URL_MISMATCH; exit 1; }
          rm -f "$identity"
          echo Q13B_PREVIEW_IDENTITY=PASS
          echo Q13B_PRODUCTION_MUTATION=NONE

  q13b-preview-fixture-prep:
    needs: q13b-identity-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: "Preview \u2013 sms-v3-staging"
    outputs:
      baseline_ready: ${{ steps.baseline.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          path: application-under-test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix application-under-test ci --include=dev
      - run: npm --prefix application-under-test run prisma:generate
      - name: Diagnose Q13-B Preview fixture prerequisites
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT }}
          APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
          UAT_TARGET_MODE: preview
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          UAT_SOURCE_SHA: ${{ inputs.source_sha }}
          UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
          Q13B_WRITE_CONFIRMATION: ${{ inputs.q13b_write_confirmation }}
          Q13B_SNAPSHOT_PATH: test-results/q13b-preview-baseline.json
        run: |
          set -euo pipefail
          node scripts/admin/q13b-preview-fixture.js diagnose
      - name: Capture reversible Preview baseline before mutation
        id: baseline
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT }}
          APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
          UAT_TARGET_MODE: preview
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          UAT_SOURCE_SHA: ${{ inputs.source_sha }}
          UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
          Q13B_WRITE_CONFIRMATION: ${{ inputs.q13b_write_confirmation }}
          Q13B_SNAPSHOT_PATH: test-results/q13b-preview-baseline.json
        run: |
          set -euo pipefail
          node scripts/admin/q13b-preview-fixture.js snapshot
          echo 'ready=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: q13b-preview-baseline-${{ github.run_id }}
          path: test-results/q13b-preview-baseline.json
          if-no-files-found: error
          retention-days: 7
      - name: Prepare isolated reversible Preview fixtures
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
          APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PREVIEW_DATABASE_TARGET_FINGERPRINT }}
          APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_PRODUCTION_DATABASE_TARGET_FINGERPRINT }}
          UAT_TARGET_MODE: preview
          UAT_BASE_URL: ${{ inputs.target_url }}
          UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
          UAT_SOURCE_SHA: ${{ inputs.source_sha }}
          UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
          UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
          Q13B_WRITE_CONFIRMATION: ${{ inputs.q13b_write_confirmation }}
          Q13B_SNAPSHOT_PATH: test-results/q13b-preview-baseline.json
        run: |
          set -euo pipefail
          node scripts/admin/q13b-preview-fixture.js prepare

  q13b-authenticated-write:
    needs: q13b-preview-fixture-prep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production-sms-v3-staging
    env:
      UAT_BASE_URL: ${{ inputs.target_url }}
      UAT_TARGET_MODE: preview
      UAT_SOURCE_SHA: ${{ inputs.source_sha }}
      UAT_SOURCE_BRANCH: ${{ inputs.source_branch }}
      UAT_HARNESS_SHA: ${{ inputs.uat_harness_sha }}
      UAT_APPLICATION_ROOT: ${{ github.workspace }}/application-under-test
      UAT_EXPECTED_DEPLOYMENT_ID: ${{ inputs.expected_deployment_id }}
      UAT_MODE: authenticated
      UAT_SCOPE: q13b-specialist-write-targeted
      Q13B_WRITE_CONFIRMATION: ${{ inputs.q13b_write_confirmation }}
      PLAYWRIGHT_NO_COPY_PROMPT: 1
      UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
      UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
      UAT_MANAGER_EMAIL: ${{ secrets.UAT_MANAGER_EMAIL }}
      UAT_MANAGER_PASSWORD: ${{ secrets.UAT_MANAGER_PASSWORD }}
      UAT_VIEWER_EMAIL: ${{ secrets.UAT_VIEWER_EMAIL }}
      UAT_VIEWER_PASSWORD: ${{ secrets.UAT_VIEWER_PASSWORD }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.uat_harness_sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_sha }}
          path: application-under-test
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run Q13-B authenticated specialist write contracts
        id: q13b
        continue-on-error: true
        shell: bash
        run: npx playwright test e2e/smoke/q13b-specialist-write.spec.js
      - name: Scan Q13-B artifacts for credential leakage
        id: scan
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const { scanArtifact } = require('./e2e/helpers/uat-v3-security');
          const files = ['test-results/uat-summary.md', 'test-results/uat-results.json'];
          const options = {
            bypassSecret: process.env.VERCEL_AUTOMATION_BYPASS_SECRET,
            passwordValues: [process.env.UAT_ADMIN_PASSWORD, process.env.UAT_MANAGER_PASSWORD, process.env.UAT_VIEWER_PASSWORD],
            emailValues: [process.env.UAT_ADMIN_EMAIL, process.env.UAT_MANAGER_EMAIL, process.env.UAT_VIEWER_EMAIL]
          };
          const findings = [];
          for (const file of files) {
            if (!fs.existsSync(file)) continue;
            const result = scanArtifact(file, fs.readFileSync(file), options);
            if (!result.safe) findings.push({ path: result.path, categories: result.categories });
          }
          fs.mkdirSync('test-results', { recursive: true });
          fs.writeFileSync('test-results/q13b-artifact-summary.json', JSON.stringify({ leakCount: findings.reduce((n, row) => n + row.categories.length, 0), findings }));
          if (findings.length) process.exit(1);
          console.log('Q13B_ARTIFACT_LEAK_COUNT=0');
          NODE
      - name: Publish Q13-B summary
        if: always()
        shell: bash
        run: |
          {
            echo '### Q13-B Specialist Write Assurance'
            echo '- Target mode: Preview only'
            echo "- Result: ${{ steps.q13c.outcome }}"
            echo "- Artifact scan: ${{ steps.scan.outcome }}"
            if [[ -f test-results/uat-summary.md ]]; then cat test-results/uat-summary.md; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Q13-B safe evidence
        if: always() && steps.scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: q13b-specialist-write-${{ github.run_id }}
          path: |
            test-results/uat-summary.md
            test-results/uat-results.json
            test-results/uat-v3-account-preflight.json
            test-results/q13b-artifact-summary.json
          if-no-files-found: warn
          retention-days: 7
      - name: Enforce Q13-B result
        if: always()
        shell: bash
        run: |
          [[ "${{ steps.scan.outcome }}" == success ]] || { echo Q13B_ARTIFACT_SCAN_FAILED; exit 1; }
          [[ "${{ steps.q13c.outcome }}" == success ]] || { echo Q13B_SPECIALIST_WRITE_FAILED; exit 1; }
          echo Q13B_SPECIALIST_WRITE=PASS

