name: Rollback sms-v3-staging Production

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: Existing deployment ID belonging to sms-v3-staging
        required: true
        type: string
      confirmation:
        description: Type ROLLBACK_SMS_V3_STAGING to confirm application-only rollback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sms-v3-staging-production
  cancel-in-progress: false

env:
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
      url: https://sms-v3-staging-ten.vercel.app
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate rollback target
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "ROLLBACK_SMS_V3_STAGING"
          test -n "$VERCEL_TOKEN"
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          inspect_log=$(mktemp)
          trap 'rm -f "$inspect_log"' EXIT
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "${{ inputs.deployment_id }}" --format=json --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >"$inspect_log" 2>&1
          node -e "const fs=require('node:fs'); const raw=fs.readFileSync(process.argv[1],'utf8'); const match=raw.match(/\{[\s\S]*\}/); const data=match ? JSON.parse(match[0]) : {}; if(data.projectId !== process.env.EXPECTED_PROJECT_ID) process.exit(1)" "$inspect_log"
      - name: Promote application deployment only
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@"$VERCEL_CLI_VERSION" promote "${{ inputs.deployment_id }}" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" --yes >/tmp/vercel-promote.log 2>&1
      - name: Verify canonical rollback health
        env:
          DEPLOYMENT_URL: https://sms-v3-staging-ten.vercel.app
          CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
        run: node scripts/ci/verify-health.js
      - name: Publish rollback summary
        run: |
          {
            echo '### Application rollback'
            echo '- Project: sms-v3-staging'
            echo '- Deployment promoted: ${{ inputs.deployment_id }}'
            echo '- Canonical health: verified'
            echo '- Database migration rollback: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
