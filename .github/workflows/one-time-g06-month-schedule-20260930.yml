name: ONE-TIME G06 Month Schedule 20260930

on:
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact canonical Production application SHA
        required: true
        type: string
      confirm_scope:
        description: Type G06_MONTH_SCHEDULE_20260930
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_RELEASE_SHA: 3f1b88850748e5c5000044eee505fd7003a1205e
  EXPECTED_EMPLOYEE_CODE: UAT-ST-20260902
  EXPECTED_EMPLOYEE_ID: 76fb6def-9f04-4cbd-8c2e-b9be21d8af56
  EXPECTED_SHIFT_D_ID: a412eab6-b314-4f9e-bef1-8e2d7743c17f
  TARGET_TODAY: '2026-09-30'
  TARGET_MONTH: '2026-10'
  CANONICAL_BASE_URL: https://sms-v3-staging-ten.vercel.app

jobs:
  schedule:
    if: ${{ github.ref_name == 'main' && inputs.confirm_scope == 'G06_MONTH_SCHEDULE_20260930' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-sms-v3-staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
      UAT_ADMIN_EMAIL: ${{ secrets.UAT_ADMIN_EMAIL }}
      UAT_ADMIN_PASSWORD: ${{ secrets.UAT_ADMIN_PASSWORD }}
      INPUT_RELEASE_SHA: ${{ inputs.expected_release_sha }}
    steps:
      - name: Validate exact owner-authorized scope
        shell: bash
        run: |
          set -euo pipefail
          test "$INPUT_RELEASE_SHA" = "$EXPECTED_RELEASE_SHA"
          test -n "$DATABASE_URL"
          test -n "$UAT_ADMIN_EMAIL"
          test -n "$UAT_ADMIN_PASSWORD"
          echo "G06_MONTH_SCHEDULE_SCOPE=PASS"

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_release_sha }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact release dependencies
        run: |
          npm ci --include=dev
          npx prisma generate

      - name: Ensure UAT schedule and monthly approvals through Production API
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');
          const { PrismaClient } = require('@prisma/client');
          const { loadLicenseAuthorityByEmployee, licenseStateForWorkDate } = require('./src/services/license-state.service');

          const prisma = new PrismaClient();
          const baseUrl = process.env.CANONICAL_BASE_URL;
          const employeeCode = process.env.EXPECTED_EMPLOYEE_CODE;
          const employeeId = process.env.EXPECTED_EMPLOYEE_ID;
          const expectedShiftDId = process.env.EXPECTED_SHIFT_D_ID;
          const todayText = process.env.TARGET_TODAY;
          const targetMonth = process.env.TARGET_MONTH;
          const remark = 'G06 monthly controlled UAT fixture';
          const overrideReason = 'Owner-authorized G06 controlled UAT schedule - missing operational license';

          const safe = {
            mode: 'G06_MONTH_SCHEDULE_20260930',
            databaseDirectWritePerformed: false,
            applicationApiMutationOnly: true,
            employeeCode,
            employeeId,
            targetToday: todayText,
            targetMonth,
            createdCount: 0,
            preservedExistingCount: 0,
            approvalMonths: {}
          };

          function fail(code, details = {}) {
            const error = new Error(code);
            error.details = details;
            throw error;
          }

          async function api(path, { method = 'GET', token, body } = {}) {
            const headers = { 'content-type': 'application/json' };
            if (token) headers.authorization = `Bearer ${token}`;
            const response = await fetch(`${baseUrl}${path}`, {
              method,
              headers,
              body: body === undefined ? undefined : JSON.stringify(body)
            });
            const payload = await response.json().catch(() => ({}));
            const requestId = response.headers.get('x-request-id') || payload?.requestId || null;
            return { ok: response.ok, status: response.status, payload, requestId };
          }

          function utcDate(text) {
            return new Date(`${text}T00:00:00.000Z`);
          }

          function datesInMonth(month) {
            const [y, m] = month.split('-').map(Number);
            const last = new Date(Date.UTC(y, m, 0)).getUTCDate();
            return Array.from({ length: last }, (_, idx) =>
              `${month}-${String(idx + 1).padStart(2, '0')}`
            );
          }

          (async () => {
            const ready = await api('/api/v1/ready');
            if (!ready.ok || ready.payload?.status !== 'ready' || ready.payload?.database !== 'ok') {
              fail('CANONICAL_READY_GATE_FAILED', { status: ready.status, requestId: ready.requestId });
            }

            const employee = await prisma.employee.findUnique({
              where: { employeeCode },
              select: { id: true, employeeCode: true, isActive: true, deletedAt: true, department: true }
            });
            if (!employee || employee.id !== employeeId || !employee.isActive || employee.deletedAt) {
              fail('EMPLOYEE_GATE_FAILED');
            }

            const [shiftD, shiftOff] = await Promise.all([
              prisma.shiftType.findUnique({
                where: { code: 'D' },
                select: { id: true, code: true, startTime: true, endTime: true, isActive: true }
              }),
              prisma.shiftType.findUnique({
                where: { code: 'OFF' },
                select: { id: true, code: true, isActive: true }
              })
            ]);
            if (!shiftD || shiftD.id !== expectedShiftDId || !shiftD.isActive || shiftD.startTime !== '07:00' || shiftD.endTime !== '19:00') {
              fail('SHIFT_D_GATE_FAILED');
            }
            if (!shiftOff || !shiftOff.isActive) fail('SHIFT_OFF_GATE_FAILED');

            const targetDates = [todayText, ...datesInMonth(targetMonth)];
            const workDates = targetDates.map(utcDate);

            const [existing, sessions, leaves] = await Promise.all([
              prisma.shiftAssignment.findMany({
                where: { employeeId, workDate: { in: workDates } },
                include: { shiftType: { select: { code: true } } },
                orderBy: { workDate: 'asc' }
              }),
              prisma.attendanceSession.findMany({
                where: { employeeId, workDate: { in: workDates } },
                select: { workDate: true, state: true, events: { select: { id: true } } }
              }),
              prisma.leaveRequest.findMany({
                where: {
                  employeeId,
                  startDate: { lte: utcDate(`${targetMonth}-31`) },
                  endDate: { gte: utcDate(todayText) }
                },
                select: { status: true, startDate: true, endDate: true }
              })
            ]);

            const existingByDate = new Map(existing.map((row) => [row.workDate.toISOString().slice(0, 10), row]));
            const sessionByDate = new Map(sessions.map((row) => [row.workDate.toISOString().slice(0, 10), row]));
            const blockingLeaves = leaves.filter((row) =>
              !['REJECTED', 'CANCELLED'].includes(String(row.status || '').toUpperCase())
            );

            const licenseMap = await loadLicenseAuthorityByEmployee(prisma, [employeeId]);
            const licenses = licenseMap.get(employeeId) || [];
            const planned = [];

            for (const dateText of targetDates) {
              if (existingByDate.has(dateText)) {
                safe.preservedExistingCount += 1;
                continue;
              }
              const session = sessionByDate.get(dateText);
              if (session?.events?.length) {
                fail('ATTENDANCE_EVENT_WITHOUT_ASSIGNMENT', { date: dateText, eventCount: session.events.length });
              }

              const d = utcDate(dateText);
              const hasLeave = blockingLeaves.some((row) => d >= row.startDate && d <= row.endDate);
              const isSunday = d.getUTCDay() === 0;
              const useOff = hasLeave || isSunday;
              const selectedShift = useOff ? shiftOff : shiftD;
              const licenseState = licenseStateForWorkDate(licenses, d);
              const useOverride = !useOff && !licenseState.valid;

              planned.push({
                employeeId,
                shiftTypeId: selectedShift.id,
                workDate: dateText,
                remark,
                licenseOverride: useOverride,
                overrideReason: useOverride ? overrideReason : ''
              });
            }

            safe.before = {
              existingCount: existing.length,
              missingCount: planned.length,
              existing: existing.map((row) => ({
                date: row.workDate.toISOString().slice(0, 10),
                shiftCode: row.shiftType?.code || null,
                licenseStatus: row.licenseStatus || null
              })),
              activeLeaveCount: blockingLeaves.length
            };

            const login = await api('/api/v1/auth/login', {
              method: 'POST',
              body: {
                email: process.env.UAT_ADMIN_EMAIL,
                password: process.env.UAT_ADMIN_PASSWORD,
                clientType: 'browser'
              }
            });
            if (!login.ok || login.payload?.user?.role !== 'ADMIN' || !login.payload?.accessToken) {
              fail('ADMIN_LOGIN_FAILED', { status: login.status, requestId: login.requestId });
            }
            const token = login.payload.accessToken;

            if (planned.length) {
              const batch = await api('/api/v1/schedules/batch', {
                method: 'POST',
                token,
                body: { assignments: planned }
              });
              safe.batchHttpStatus = batch.status;
              safe.batchRequestId = batch.requestId;
              if (!batch.ok) {
                fail('SCHEDULE_BATCH_FAILED', {
                  status: batch.status,
                  requestId: batch.requestId,
                  error: batch.payload?.error || null
                });
              }
              safe.createdCount = planned.length;
            }

            for (const month of ['2026-09', targetMonth]) {
              const approve = await api('/api/v1/schedules/approve', {
                method: 'POST',
                token,
                body: {
                  month,
                  note: 'Owner-authorized G06 UAT monthly schedule readiness'
                }
              });
              safe.approvalMonths[month] = {
                httpStatus: approve.status,
                requestId: approve.requestId
              };
              if (!approve.ok) {
                fail('SCHEDULE_APPROVAL_FAILED', {
                  month,
                  status: approve.status,
                  requestId: approve.requestId,
                  error: approve.payload?.error || null
                });
              }
            }

            const [finalAssignments, sepApproval, octApproval] = await Promise.all([
              prisma.shiftAssignment.findMany({
                where: { employeeId, workDate: { in: workDates } },
                include: { shiftType: { select: { code: true } } },
                orderBy: { workDate: 'asc' }
              }),
              prisma.scheduleApproval.findFirst({
                where: { month: utcDate('2026-09-01') },
                orderBy: [{ revision: 'desc' }, { updatedAt: 'desc' }],
                select: { status: true, revision: true, approvedAt: true }
              }),
              prisma.scheduleApproval.findFirst({
                where: { month: utcDate(`${targetMonth}-01`) },
                orderBy: [{ revision: 'desc' }, { updatedAt: 'desc' }],
                select: { status: true, revision: true, approvedAt: true }
              })
            ]);

            const finalByDate = new Map(finalAssignments.map((row) => [
              row.workDate.toISOString().slice(0, 10),
              row
            ]));
            const missingAfter = targetDates.filter((dateText) => !finalByDate.has(dateText));
            if (missingAfter.length) fail('FINAL_ASSIGNMENTS_INCOMPLETE', { missingAfter });
            if (sepApproval?.status !== 'APPROVED' || octApproval?.status !== 'APPROVED') {
              fail('FINAL_APPROVAL_NOT_APPROVED', {
                september: sepApproval?.status || null,
                october: octApproval?.status || null
              });
            }

            const october = finalAssignments.filter((row) =>
              row.workDate.toISOString().slice(0, 7) === targetMonth
            );
            const today = finalByDate.get(todayText);

            const readiness = await api(`/api/v1/employees/${encodeURIComponent(employeeId)}/onboarding-readiness`, { token });
            safe.readinessHttpStatus = readiness.status;
            safe.readinessRequestId = readiness.requestId;
            safe.readiness = readiness.ok ? {
              status: (readiness.payload?.data || readiness.payload)?.status || null,
              blockers: (readiness.payload?.data || readiness.payload)?.blockers || [],
              checks: (readiness.payload?.data || readiness.payload)?.checks || null
            } : { status: 'API_FAILED' };

            safe.final = {
              totalTargetDates: targetDates.length,
              finalAssignmentCount: finalAssignments.length,
              today: today ? {
                shiftCode: today.shiftType?.code || null,
                startTime: today.startTime || null,
                endTime: today.endTime || null,
                licenseStatus: today.licenseStatus || null,
                licenseOverride: today.licenseOverride === true
              } : null,
              october: {
                assignmentCount: october.length,
                dShiftCount: october.filter((row) => row.shiftType?.code === 'D').length,
                offCount: october.filter((row) => row.shiftType?.code === 'OFF').length
              },
              septemberApproval: {
                status: sepApproval.status,
                revision: sepApproval.revision,
                approvedAt: sepApproval.approvedAt?.toISOString?.() || null
              },
              octoberApproval: {
                status: octApproval.status,
                revision: octApproval.revision,
                approvedAt: octApproval.approvedAt?.toISOString?.() || null
              }
            };

            fs.writeFileSync('g06-month-schedule-evidence.json', JSON.stringify(safe, null, 2));
            console.log('G06_MONTH_SCHEDULE_BEGIN');
            console.log(JSON.stringify(safe, null, 2));
            console.log('G06_MONTH_SCHEDULE_END');
          })()
            .catch((error) => {
              const failure = { code: error.message, details: error.details || null, ...safe };
              fs.writeFileSync('g06-month-schedule-evidence.json', JSON.stringify(failure, null, 2));
              console.error(`G06_MONTH_SCHEDULE_FAILED=${error.message}`);
              if (error.details) console.error(JSON.stringify(error.details));
              process.exitCode = 1;
            })
            .finally(async () => prisma.$disconnect());
          NODE

      - name: Upload sanitized G06 month schedule evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: g06-month-schedule-${{ github.run_id }}
          path: g06-month-schedule-evidence.json
          if-no-files-found: warn
          retention-days: 14
