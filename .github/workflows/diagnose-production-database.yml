name: Diagnose sms-v3-staging Production Database

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit used to identify the production application
        required: true
        type: string
      confirm_project_name:
        description: Type sms-v3-staging to confirm the target project
        required: true
        type: string
      confirm_environment:
        description: Type production to confirm the target environment
        required: true
        type: string

permissions:
  contents: read

env:
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging
  VERCEL_CLI_VERSION: 56.4.1
  DIAGNOSTIC_DIR: /tmp/sms-v3-production-database

jobs:
  diagnose:
    if: ${{ github.ref_name == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check target and secret presence
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          test "${{ inputs.confirm_project_name }}" = "$EXPECTED_PROJECT_NAME"
          test "${{ inputs.confirm_environment }}" = production
          test -n "$VERCEL_TOKEN" && echo 'VERCEL_TOKEN=PRESENT' || { echo 'VERCEL_TOKEN=MISSING'; exit 1; }
          test -n "$VERCEL_ORG_ID" && echo 'VERCEL_ORG_ID=PRESENT' || { echo 'VERCEL_ORG_ID=MISSING'; exit 1; }
          test -n "$VERCEL_PROJECT_ID" && echo 'VERCEL_PROJECT_ID=PRESENT' || { echo 'VERCEL_PROJECT_ID=MISSING'; exit 1; }
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          mkdir -p "$DIAGNOSTIC_DIR"
          chmod 700 "$DIAGNOSTIC_DIR"

      - name: Fetch and validate exact diagnostic target commit
        shell: bash
        env:
          TARGET_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          node scripts/ci/production-database-diagnostic.js validate-sha "$TARGET_SHA"
          git fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git cat-file -e "${TARGET_SHA}^{commit}"
          echo 'TARGET_COMMIT_VALIDATED=true'

      - name: Install read-only diagnostic dependencies
        run: npm ci

      - name: Pull Vercel Production environment to restricted temporary storage
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          pull_log="$DIAGNOSTIC_DIR/vercel-pull.log"
          if ! npx --yes "vercel@$VERCEL_CLI_VERSION" env pull "$DIAGNOSTIC_DIR/vercel.env" --yes --non-interactive --environment=production --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >"$pull_log" 2>&1; then
            echo 'VERCEL_ENV_PULL=FAILED'
            exit 1
          fi
          test -s "$DIAGNOSTIC_DIR/vercel.env"
          echo 'VERCEL_ENV_PULL=SUCCESS'

      - name: Classify only sanitized connection metadata
        run: node scripts/ci/production-database-diagnostic.js format "$DIAGNOSTIC_DIR/vercel.env"

      - name: Run one-shot SELECT 1 against Vercel DATABASE_URL only
        run: node scripts/ci/production-database-diagnostic.js probe "$DIAGNOSTIC_DIR/vercel.env"

      - name: Remove temporary environment files
        if: ${{ always() }}
        shell: bash
        run: rm -rf -- "$DIAGNOSTIC_DIR"
