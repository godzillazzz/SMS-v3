name: Diagnose sms-v3-staging Production Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate-supervisor-roles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production-sms-v3-staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Generate Prisma client
        run: npx prisma generate
      - name: Inventory and activate Supervisor roles through application service
        run: node scripts/admin/activate-supervisor-prod-role.js
      - name: Upload governed role activation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-role-activation-${{ github.run_id }}
          path: |
            supervisor-role-inventory.json
            supervisor-role-rollback.json
            supervisor-role-activation-summary.json
          if-no-files-found: warn
          retention-days: 30
