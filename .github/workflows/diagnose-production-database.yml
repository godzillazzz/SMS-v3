name: g03-1-production-readonly-preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly-preflight:
    runs-on: ubuntu-latest
    environment: production-sms-v3-staging
    timeout-minutes: 10
    env:
      EXPECTED_CANDIDATE_SHA: e39b15df57e9c90f9997e2c1a365f66662ff75c3
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout exact G03.1 candidate
        uses: actions/checkout@v4
        with:
          ref: e39b15df57e9c90f9997e2c1a365f66662ff75c3
          fetch-depth: 1

      - name: Verify exact candidate identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          echo "CANDIDATE_IDENTITY=PASS"

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts
          npx --no-install prisma generate

      - name: Run database-enforced read-only aggregate preflight
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          'use strict';
          const crypto = require('node:crypto');
          const { PrismaClient } = require('@prisma/client');
          if (!process.env.DATABASE_URL) throw new Error('Protected DATABASE_URL is unavailable.');
          const prisma = new PrismaClient({ log: [] });
          const TARGET_YEAR = 2026;
          const EPS = 1e-9;
          const num = (v) => typeof v === 'bigint' ? Number(v) : Number(v || 0);
          const toDate = (v) => v instanceof Date ? v : new Date(v);
          const year = (v) => toDate(v).getUTCFullYear();
          const hashJson = (v) => crypto.createHash('sha256').update(JSON.stringify(v)).digest('hex');
          function inclusiveDays(start, end) {
            const s = toDate(start), e = toDate(end);
            return Math.floor((Date.UTC(e.getUTCFullYear(), e.getUTCMonth(), e.getUTCDate()) - Date.UTC(s.getUTCFullYear(), s.getUTCMonth(), s.getUTCDate())) / 86400000) + 1;
          }
          function fieldForLeaveType(value) {
            const t = String(value || '').trim().toLowerCase();
            if (t.includes('ป่วย') || t.includes('sick')) return 'sickLeave';
            if (t.includes('กิจ') || t.includes('personal')) return 'personalLeave';
            if (t.includes('พักร้อน') || t.includes('vacation')) return 'vacationLeave';
            return 'UNSUPPORTED';
          }
          const blankUsage = () => ({ sickLeave: 0, personalLeave: 0, vacationLeave: 0 });
          const addUsage = (target, field, amount) => { if (field !== 'UNSUPPORTED') target[field] += Number(amount); };
          (async () => {
            try {
              const result = await prisma.$transaction(async (tx) => {
                await tx.$executeRawUnsafe('SET TRANSACTION ISOLATION LEVEL REPEATABLE READ, READ ONLY');
                const ro = await tx.$queryRawUnsafe('SHOW transaction_read_only');
                if (String(ro?.[0]?.transaction_read_only || '').toLowerCase() !== 'on') throw new Error('READ_ONLY_ENFORCEMENT_FAILED');

                const quotaYearCol = await tx.$queryRawUnsafe("SELECT COUNT(*)::int AS count FROM information_schema.columns WHERE table_schema='public' AND table_name='leave_quotas' AND column_name='quota_year'");
                const quotaYearExists = num(quotaYearCol[0]?.count) > 0;
                const tableCols = await tx.$queryRawUnsafe("SELECT table_name, column_name, data_type FROM information_schema.columns WHERE table_schema='public' AND table_name IN ('leave_quotas','leave_requests','employees','users') ORDER BY table_name, ordinal_position");
                const migrationRows = await tx.$queryRawUnsafe('SELECT migration_name FROM "_prisma_migrations" WHERE finished_at IS NOT NULL AND rolled_back_at IS NULL ORDER BY migration_name');
                const countSql = `SELECT
                  (SELECT COUNT(*) FROM leave_quotas)::bigint AS quota_count,
                  (SELECT COUNT(*) FROM leave_requests)::bigint AS leave_count,
                  (SELECT COUNT(*) FROM employees)::bigint AS employee_count,
                  (SELECT COUNT(*) FROM users)::bigint AS user_count`;
                const start = (await tx.$queryRawUnsafe(countSql))[0];
                const before = { leaveQuotaRows: num(start.quota_count), leaveRequestRows: num(start.leave_count), employeeRows: num(start.employee_count), userRows: num(start.user_count), migrationCount: migrationRows.length };

                const quotaAgg = (await tx.$queryRawUnsafe(`SELECT COUNT(*)::bigint AS total,
                  COUNT(*) FILTER (WHERE employee_id IS NOT NULL)::bigint AS linked,
                  COUNT(*) FILTER (WHERE employee_id IS NULL)::bigint AS unlinked,
                  COUNT(*) FILTER (WHERE match_status IN ('UNMATCHED','DUPLICATE_UNMATCHED'))::bigint AS unmatched
                  FROM leave_quotas`))[0];
                const statusRows = await tx.$queryRawUnsafe('SELECT match_status, COUNT(*)::bigint AS count FROM leave_quotas GROUP BY match_status ORDER BY match_status');
                const linkedQuotas = await tx.$queryRawUnsafe('SELECT employee_id, sick_leave::text AS sick_leave, personal_leave::text AS personal_leave, vacation_leave::text AS vacation_leave FROM leave_quotas WHERE employee_id IS NOT NULL');
                const linkedGroups = await tx.$queryRawUnsafe('SELECT employee_id, COUNT(*)::bigint AS count FROM leave_quotas WHERE employee_id IS NOT NULL GROUP BY employee_id');
                const approved = await tx.$queryRawUnsafe("SELECT employee_id, leave_type, start_date, end_date, day_count::text AS day_count FROM leave_requests WHERE status='APPROVED'");

                let sameYear = 0, crossYear = 0, fractional = 0, mismatch = 0, fractionalCross = 0, ambiguous = 0;
                let touch2026 = 0, touch2027Plus = 0, before2026 = 0;
                const byPair = {};
                const ambiguousEmployees2026 = new Set();
                for (const row of approved) {
                  const sy = year(row.start_date), ey = year(row.end_date), persisted = Number(row.day_count);
                  const isFractional = !Number.isInteger(persisted);
                  if (isFractional) fractional += 1;
                  if (sy === ey) { sameYear += 1; continue; }
                  crossYear += 1;
                  if (isFractional) fractionalCross += 1;
                  const pair = `${sy}->${ey}`;
                  if (!byPair[pair]) byPair[pair] = { approved: 0, ambiguous: 0 };
                  byPair[pair].approved += 1;
                  const bad = Math.abs(inclusiveDays(row.start_date, row.end_date) - persisted) > EPS;
                  if (bad) {
                    mismatch += 1; ambiguous += 1; byPair[pair].ambiguous += 1;
                    if (sy <= TARGET_YEAR && ey >= TARGET_YEAR) { touch2026 += 1; ambiguousEmployees2026.add(String(row.employee_id)); }
                    if (ey >= 2027) touch2027Plus += 1;
                    if (ey < TARGET_YEAR) before2026 += 1;
                  }
                }

                const quotasByEmployee = new Map();
                for (const q of linkedQuotas) {
                  const key = String(q.employee_id);
                  if (!quotasByEmployee.has(key)) quotasByEmployee.set(key, []);
                  quotasByEmployee.get(key).push(q);
                }
                const leavesByEmployee = new Map();
                for (const l of approved) {
                  const key = String(l.employee_id);
                  if (!leavesByEmployee.has(key)) leavesByEmployee.set(key, []);
                  leavesByEmployee.get(key).push(l);
                }
                const differenceByLeaveType = {
                  sickLeave: { entitlement: 0, used: 0, remaining: 0 },
                  personalLeave: { entitlement: 0, used: 0, remaining: 0 },
                  vacationLeave: { entitlement: 0, used: 0, remaining: 0 }
                };
                let employeesCompared = 0, parityNotComputableEmployees = 0, entitlementDiff = 0, usedDiff = 0, remainingDiff = 0;
                for (const [employeeKey, quotas] of quotasByEmployee) {
                  if (quotas.length !== 1) continue;
                  if (ambiguousEmployees2026.has(employeeKey)) { parityNotComputableEmployees += 1; continue; }
                  const q = quotas[0];
                  const entBefore = { sickLeave: Number(q.sick_leave), personalLeave: Number(q.personal_leave), vacationLeave: Number(q.vacation_leave) };
                  const entAfter = { ...entBefore };
                  const usedBefore = blankUsage(), usedAfter = blankUsage();
                  for (const l of leavesByEmployee.get(employeeKey) || []) {
                    const field = fieldForLeaveType(l.leave_type), persisted = Number(l.day_count), sy = year(l.start_date), ey = year(l.end_date);
                    addUsage(usedBefore, field, persisted);
                    if (sy === ey) {
                      if (sy === TARGET_YEAR) addUsage(usedAfter, field, persisted);
                    } else if (Math.abs(inclusiveDays(l.start_date, l.end_date) - persisted) <= EPS && sy <= TARGET_YEAR && ey >= TARGET_YEAR) {
                      const startDate = toDate(l.start_date), endDate = toDate(l.end_date);
                      let allocation = 0;
                      for (let d = new Date(Date.UTC(startDate.getUTCFullYear(), startDate.getUTCMonth(), startDate.getUTCDate())); d <= endDate; d.setUTCDate(d.getUTCDate() + 1)) if (d.getUTCFullYear() === TARGET_YEAR) allocation += 1;
                      addUsage(usedAfter, field, allocation);
                    }
                  }
                  employeesCompared += 1;
                  let eDiff = false, uDiff = false, rDiff = false;
                  for (const field of ['sickLeave','personalLeave','vacationLeave']) {
                    if (Math.abs(entBefore[field] - entAfter[field]) > EPS) { eDiff = true; differenceByLeaveType[field].entitlement += 1; }
                    if (Math.abs(usedBefore[field] - usedAfter[field]) > EPS) { uDiff = true; differenceByLeaveType[field].used += 1; }
                    const beforeRemaining = Math.max(0, entBefore[field] - usedBefore[field]);
                    const afterRemaining = Math.max(0, entAfter[field] - usedAfter[field]);
                    if (Math.abs(beforeRemaining - afterRemaining) > EPS) { rDiff = true; differenceByLeaveType[field].remaining += 1; }
                  }
                  if (eDiff) entitlementDiff += 1;
                  if (uDiff) usedDiff += 1;
                  if (rDiff) remainingDiff += 1;
                }

                const finish = (await tx.$queryRawUnsafe(countSql))[0];
                const after = { leaveQuotaRows: num(finish.quota_count), leaveRequestRows: num(finish.leave_count), employeeRows: num(finish.employee_count), userRows: num(finish.user_count), migrationCount: migrationRows.length };
                const txid = await tx.$queryRawUnsafe('SELECT txid_current_if_assigned()::text AS txid');
                return {
                  databaseEnforcedReadOnly: true,
                  transactionReadOnly: ro[0].transaction_read_only,
                  transactionIdAssigned: txid[0]?.txid || null,
                  quotaYearExists,
                  schema: { migrationCount: migrationRows.length, schemaIdentity: hashJson(tableCols), beforeCounts: before, afterCounts: after, countsEqual: JSON.stringify(before) === JSON.stringify(after) },
                  quota: {
                    totalQuotaRows: num(quotaAgg.total), linkedRows: num(quotaAgg.linked), unlinkedRows: num(quotaAgg.unlinked), unmatchedRows: num(quotaAgg.unmatched),
                    rowsByMatchStatus: Object.fromEntries(statusRows.map(r => [r.match_status, num(r.count)])),
                    linkedNullYearRows: quotaYearExists ? null : num(quotaAgg.linked), annualYearRows: quotaYearExists ? null : 0,
                    employeesWithMultipleLinkedRows: linkedGroups.filter(r => num(r.count) > 1).length,
                    employeesWithMultipleUnclassifiedLinkedRows: linkedGroups.filter(r => num(r.count) > 1).length,
                    maximumLinkedRowsPerEmployee: linkedGroups.length ? Math.max(...linkedGroups.map(r => num(r.count))) : 0,
                    duplicateEmployeeYearAuthorities: quotaYearExists ? null : 'NOT_APPLICABLE_PRE_MIGRATION'
                  },
                  leaveHistory: {
                    approvedLeaveRequests: approved.length, approvedSameYearRequests: sameYear, approvedCrossYearRequests: crossYear, fractionalApprovedRequests: fractional,
                    crossYearPersistedDayCountMismatch: mismatch, fractionalCrossYearRequests: fractionalCross, ambiguousLegacyCrossYearRequests: ambiguous,
                    ambiguousByYearPair: byPair, ambiguousCrossYearTouching2026: touch2026, ambiguousCrossYearTouching2027OrLater: touch2027Plus, ambiguousCrossYearEntirelyBefore2026: before2026
                  },
                  parity2026: {
                    employeesCompared, parityNotComputableEmployees,
                    employeesWithEntitlementDifference: entitlementDiff,
                    employeesWithUsedDifference: usedDiff,
                    employeesWithRemainingDifference: remainingDiff,
                    differenceByLeaveType
                  }
                };
              }, { maxWait: 10000, timeout: 60000 });
              console.log('PRODUCTION_READ_ONLY_PREFLIGHT=' + JSON.stringify(result));
            } finally {
              await prisma.$disconnect().catch(() => undefined);
            }
          })().catch((error) => {
            console.error('READ_ONLY_PREFLIGHT_FAILED=' + (error?.code || error?.name || 'ERROR'));
            process.exitCode = 1;
          });
          NODE
