name: Diagnose sms-v3-staging Production Database

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact commit used to identify the production application
        required: true
        type: string
      confirm_project_name:
        description: Type sms-v3-staging to confirm the target project
        required: true
        type: string
      confirm_environment:
        description: Type production to confirm the target environment
        required: true
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production-sms-v3-staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run Query
        run: |
          npm install pg
          cat << 'INNER_EOF' > query.js
          const { Client } = require('pg');
          const client = new Client({ connectionString: process.env.DATABASE_URL });
          client.connect()
            .then(() => client.query(`
              SELECT id, checksum, started_at, finished_at, migration_name, applied_steps_count 
              FROM _prisma_migrations 
              WHERE migration_name IN (
                '202608020001_license_correction_disposal', 
                '202608030001_email_delivery_reservations', 
                '20260805000000_add_leave_request_created_by_user'
              ) 
              ORDER BY started_at ASC
            `))
            .then(res => { 
              console.log("QUERY_RESULT_START");
              console.log(JSON.stringify(res.rows, null, 2)); 
              console.log("QUERY_RESULT_END");
              process.exit(0);
            })
            .catch(err => { 
              console.error(err); 
              process.exit(1);
            });
          INNER_EOF
          node query.js
