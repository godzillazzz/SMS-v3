name: g03-1-production-cutover-v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-v3-g03-1-production-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production-sms-v3-staging
    env:
      EXPECTED_CANDIDATE_SHA: 0951d4ce08de817dda7b986924232e86e745b532
      EXPECTED_CANDIDATE_TREE: dfacd4261df08139f21bebd498ce709954163b8b
      EXPECTED_CANDIDATE_PARENT: e39b15df57e9c90f9997e2c1a365f66662ff75c3
      EXPECTED_MIGRATION: 202608170001_annual_leave_quota_year
      EXPECTED_MIGRATION_HASH: 5c912c927d2827d53b67df02679fc4fcb596f39f18623bb230adf2a11fa69cfe
      EXPECTED_DEPLOYMENT_ID: dpl_rK4D47D2HaJ2ur4cLV1YfWtnu2eL
      EXPECTED_PRODUCTION_SHA: 1701bcf90a1998ea4999ee02e687172295984c9a
      EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
      EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
      CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
      DATABASE_URL: ${{ secrets.DIRECT_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CUTOVER_STATE_FILE: ${{ runner.temp }}/g03-1-cutover-state.json

    steps:
      - name: Checkout fixed cutover harness
        uses: actions/checkout@v4
        with:
          ref: ci/g03-1-production-cutover-v1
          fetch-depth: 1

      - name: Preserve fixed cutover script outside checkout
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/g03-1-production-cutover-v1.js "$RUNNER_TEMP/g03-1-production-cutover-v1.js"
          test -s "$RUNNER_TEMP/g03-1-production-cutover-v1.js"

      - name: Checkout exact gated G03.1 candidate
        uses: actions/checkout@v4
        with:
          ref: 0951d4ce08de817dda7b986924232e86e745b532
          fetch-depth: 2
          clean: true

      - name: Set up exact Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Establish cutover window
        shell: bash
        run: |
          set -euo pipefail
          echo "CUTOVER_START_ISO=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Verify exact candidate and migration identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CANDIDATE_PARENT"
          migration="prisma/migrations/$EXPECTED_MIGRATION/migration.sql"
          test -f "$migration"
          test "$(sha256sum "$migration" | awk '{print $1}')" = "$EXPECTED_MIGRATION_HASH"
          test "$(grep -Eic '\bUPDATE\b' "$migration" || true)" = "0"
          test "$(grep -Eic '\bDELETE\b' "$migration" || true)" = "0"
          test "$(grep -Eic '\bINSERT\b' "$migration" || true)" = "0"
          grep -Fq 'ADD COLUMN "quota_year" INTEGER' "$migration"
          grep -Fq 'leave_quotas_employee_id_quota_year_key' "$migration"
          grep -Fq 'leave_quotas_quota_year_idx' "$migration"
          echo 'CUTOVER_IDENTITY=PASS'

      - name: Install exact dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts
          npx --no-install prisma generate
          cp "$RUNNER_TEMP/g03-1-production-cutover-v1.js" .g03-1-production-cutover-v1.js
          node --check .g03-1-production-cutover-v1.js

      - name: Verify protected Production database target
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/verify-deployment-target.js --verify

      - name: Verify old G03 Canonical identity before write
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const id = process.env.EXPECTED_DEPLOYMENT_ID;
          const teamId = process.env.EXPECTED_ORG_ID;
          const token = process.env.VERCEL_TOKEN;
          if (!token) throw new Error('VERCEL_TOKEN_UNAVAILABLE');
          const response = await fetch(`https://api.vercel.com/v13/deployments/${id}?teamId=${teamId}`, { headers: { Authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`VERCEL_INSPECT_HTTP_${response.status}`);
          const d = await response.json();
          if (d.id !== id || d.readyState !== 'READY' || d.target !== 'production' || d.meta?.gitCommitSha !== process.env.EXPECTED_PRODUCTION_SHA || d.project?.id !== process.env.EXPECTED_PROJECT_ID) throw new Error('G03_1_CUTOVER_IDENTITY_FAILED');
          console.log('CANONICAL_IDENTITY_BEFORE_WRITE=PASS');
          NODE

      - name: Fresh pre-write invariant and activation gate
        shell: bash
        run: |
          set -euo pipefail
          node .g03-1-production-cutover-v1.js precheck

      - name: Reconfirm only authorized migration is pending
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prisma-migration.js status --allow-pending

      - name: Apply exact authorized additive migration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prisma-migration.js deploy

      - name: Verify exact schema migration and preserved values
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/prisma-migration.js status
          node .g03-1-production-cutover-v1.js post-migration

      - name: Old G03 health and runtime gate after schema migration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const id = process.env.EXPECTED_DEPLOYMENT_ID;
          const teamId = process.env.EXPECTED_ORG_ID;
          const token = process.env.VERCEL_TOKEN;
          const response = await fetch(`https://api.vercel.com/v13/deployments/${id}?teamId=${teamId}`, { headers: { Authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`VERCEL_INSPECT_HTTP_${response.status}`);
          const d = await response.json();
          if (d.id !== id || d.readyState !== 'READY' || d.target !== 'production' || d.meta?.gitCommitSha !== process.env.EXPECTED_PRODUCTION_SHA) throw new Error('G03_1_SCHEMA_APPLIED_POSTHEALTH_FAILED');
          NODE
          test "$(curl -fsS -o /tmp/health.json -w '%{http_code}' "$CANONICAL_URL/api/v1/health")" = "200"
          node -e "const x=require('/tmp/health.json'); if(x.status!=='ok') process.exit(1)"
          for i in 1 2 3; do
            code="$(curl -fsS -o "/tmp/ready-$i.json" -w '%{http_code}' "$CANONICAL_URL/api/v1/ready")"
            test "$code" = "200"
            node -e "const x=require('/tmp/ready-$i.json'); if(x.status!=='ready'||x.database!=='ok') process.exit(1)"
          done
          logs_file="$(mktemp)"
          trap 'rm -f "$logs_file"' EXIT
          npx --yes vercel@56.4.1 logs --deployment "$EXPECTED_DEPLOYMENT_ID" --since "$CUTOVER_START_ISO" --limit 200 --json --no-branch --token "$VERCEL_TOKEN" >"$logs_file" 2>/dev/null
          critical="$(grep -Eic 'P2024|P2028|pool timeout|transaction timeout|Prisma (initialization|init)|ReferenceError|Runtime Timeout|"statusCode"[[:space:]]*:[[:space:]]*(500|503|504)|HTTP (500|503|504)' "$logs_file" || true)"
          test "$critical" = "0"
          echo 'POST_SCHEMA_HEALTH=PASS'
          echo 'POST_SCHEMA_READY=3/3'
          echo 'POST_SCHEMA_RUNTIME_CRITICAL=0'

      - name: Metadata-only 2026 classification transaction
        shell: bash
        run: |
          set -euo pipefail
          node .g03-1-production-cutover-v1.js classify

      - name: Post-cutover parity and activation verification
        shell: bash
        run: |
          set -euo pipefail
          node .g03-1-production-cutover-v1.js postcheck

      - name: Final Canonical health runtime and deployment preservation gate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const id = process.env.EXPECTED_DEPLOYMENT_ID;
          const teamId = process.env.EXPECTED_ORG_ID;
          const token = process.env.VERCEL_TOKEN;
          const response = await fetch(`https://api.vercel.com/v13/deployments/${id}?teamId=${teamId}`, { headers: { Authorization: `Bearer ${token}` } });
          if (!response.ok) throw new Error(`VERCEL_INSPECT_HTTP_${response.status}`);
          const d = await response.json();
          if (d.id !== id || d.readyState !== 'READY' || d.target !== 'production' || d.meta?.gitCommitSha !== process.env.EXPECTED_PRODUCTION_SHA) throw new Error('CANONICAL_CHANGED');
          NODE
          test "$(curl -fsS -o /tmp/final-health.json -w '%{http_code}' "$CANONICAL_URL/api/v1/health")" = "200"
          node -e "const x=require('/tmp/final-health.json'); if(x.status!=='ok') process.exit(1)"
          for i in 1 2 3; do
            code="$(curl -fsS -o "/tmp/final-ready-$i.json" -w '%{http_code}' "$CANONICAL_URL/api/v1/ready")"
            test "$code" = "200"
            node -e "const x=require('/tmp/final-ready-$i.json'); if(x.status!=='ready'||x.database!=='ok') process.exit(1)"
          done
          logs_file="$(mktemp)"
          prod_file="$(mktemp)"
          trap 'rm -f "$logs_file" "$prod_file"' EXIT
          npx --yes vercel@56.4.1 logs --deployment "$EXPECTED_DEPLOYMENT_ID" --since "$CUTOVER_START_ISO" --limit 250 --json --no-branch --token "$VERCEL_TOKEN" >"$logs_file" 2>/dev/null
          critical="$(grep -Eic 'P2024|P2028|pool timeout|transaction timeout|Prisma (initialization|init)|ReferenceError|Runtime Timeout|"statusCode"[[:space:]]*:[[:space:]]*(500|503|504)|HTTP (500|503|504)' "$logs_file" || true)"
          test "$critical" = "0"
          npx --yes vercel@56.4.1 list sms-v3-staging --environment production --format json --limit 20 --token "$VERCEL_TOKEN" >"$prod_file" 2>/dev/null
          node - "$prod_file" <<'NODE'
          const fs = require('node:fs');
          const data = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const items = Array.isArray(data) ? data : (data.deployments || []);
          items.sort((a,b) => Number(b.createdAt || 0) - Number(a.createdAt || 0));
          const latest = items[0];
          if (!latest || latest.url !== 'sms-v3-staging-eoux0ahlo-godzillazz.vercel.app' || latest.target !== 'production') throw new Error('NEW_PRODUCTION_DEPLOYMENT_DETECTED');
          NODE
          echo 'FINAL_HEALTH=PASS'
          echo 'FINAL_READY=3/3'
          echo 'FINAL_RUNTIME_CRITICAL=0'
          echo 'PRODUCTION_DEPLOYMENT_CREATED=0'
          echo 'PROMOTION=NO'
          echo 'ACTIVATION_MUTATION=0'
