name: g03-1-staged-production-target-technical-prep-v1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sms-v3-staging-production
  cancel-in-progress: false

env:
  EXPECTED_CANDIDATE_SHA: 0951d4ce08de817dda7b986924232e86e745b532
  EXPECTED_CANDIDATE_TREE: dfacd4261df08139f21bebd498ce709954163b8b
  EXPECTED_CANDIDATE_PARENT: e39b15df57e9c90f9997e2c1a365f66662ff75c3
  EXPECTED_SOURCE_BRANCH: feat/annual-leave-quota-rollover-v1
  EXPECTED_CANONICAL_DEPLOYMENT: dpl_rK4D47D2HaJ2ur4cLV1YfWtnu2eL
  EXPECTED_CANONICAL_SHA: 1701bcf90a1998ea4999ee02e687172295984c9a
  EXPECTED_CANONICAL_URL: https://sms-v3-staging-ten.vercel.app
  EXPECTED_PROJECT_ID: prj_XwhNUOB2zLSPZ6UgQcfyOKBYJ75s
  EXPECTED_ORG_ID: team_nemCExHbZ8EAhSgsvefHPAEz
  EXPECTED_PROJECT_NAME: sms-v3-staging
  VERCEL_CLI_VERSION: 56.4.1

jobs:
  staged-production-target:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: production-sms-v3-staging
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      APPROVED_DATABASE_TARGET_FINGERPRINT: ${{ vars.APPROVED_DATABASE_TARGET_FINGERPRINT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    steps:
      - name: Checkout fixed staging harness
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Preserve fixed read-only snapshot helper
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/ci/g03-1-staged-technical-snapshot.js /tmp/g03-1-staged-technical-snapshot.js
          test -s /tmp/g03-1-staged-technical-snapshot.js

      - name: Checkout exact G03.1 application candidate
        uses: actions/checkout@v4
        with:
          ref: 0951d4ce08de817dda7b986924232e86e745b532
          fetch-depth: 2

      - name: Verify exact candidate identity and remote source head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_CANDIDATE_SHA"
          test "$(git show -s --format=%T HEAD)" = "$EXPECTED_CANDIDATE_TREE"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_CANDIDATE_PARENT"
          remote_sha="$(git ls-remote origin "refs/heads/$EXPECTED_SOURCE_BRANCH" | cut -f1)"
          test "$remote_sha" = "$EXPECTED_CANDIDATE_SHA"
          test -z "$(git status --porcelain)"
          echo 'STAGED_CANDIDATE_IDENTITY=PASS'

      - name: Set up exact Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install exact dependencies without application lifecycle scripts
        shell: bash
        run: |
          set -euo pipefail
          npm ci --include=dev --ignore-scripts
          npx --no-install prisma generate

      - name: Verify protected Production database target
        run: node scripts/ci/verify-deployment-target.js --verify

      - name: Fresh read-only Production schema activation and business snapshot
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/g03-1-staged-technical-snapshot.js | tee /tmp/g03-1-pre-snapshot.log
          node - /tmp/g03-1-pre-snapshot.log /tmp/g03-1-pre-snapshot.json <<'NODE'
          const fs = require('node:fs');
          const [logPath, outPath] = process.argv.slice(2);
          const line = fs.readFileSync(logPath, 'utf8').split(/\r?\n/).find((v) => v.startsWith('STAGED_TECH_SNAPSHOT='));
          if (!line) throw new Error('PRE_SNAPSHOT_MISSING');
          const data = JSON.parse(line.slice('STAGED_TECH_SNAPSHOT='.length));
          const fail = (code) => { throw new Error(code); };
          if (data.readOnly.transactionReadOnly !== 'on' || data.readOnly.transactionIdAssigned !== null) fail('PRE_SNAPSHOT_NOT_READ_ONLY');
          if (!data.schema.quotaYearExists || !data.schema.quotaYearNullable || data.schema.quotaYearDataType !== 'integer') fail('PRE_SCHEMA_QUOTA_YEAR_INVALID');
          if (!data.schema.uniqueInvariantPresent || !data.schema.quotaYearIndexPresent) fail('PRE_SCHEMA_INDEX_INVALID');
          if (data.schema.migrationCount !== 17 || data.schema.localMigrationCount !== 17 || !data.schema.authorizedMigrationApplied || data.schema.pendingMigrations.length !== 0) fail('PRE_MIGRATION_STATE_INVALID');
          if (data.activation.effective !== 'INACTIVE') fail('G03_1_STAGED_ACTIVATION_UNSAFE');
          if (data.counts.quotaYearOtherRows !== 0) fail('PRE_SECOND_YEAR_AUTHORITY_EXISTS');
          if (data.authority.employeesWithMultipleLinkedRows !== 0 || data.authority.maximumLinkedRowsPerEmployee > 1) fail('PRE_MULTI_AUTHORITY_INVALID');
          if (data.authority.ambiguousCrossYearTouching2026 !== 0) fail('PRE_2026_AMBIGUITY');
          if (data.authority.unclassifiedAuthorities !== 0) fail('PRE_LINKED_AUTHORITY_UNCLASSIFIED');
          fs.writeFileSync(outPath, JSON.stringify(data));
          console.log('PRE_STAGED_SNAPSHOT_GATE=PASS');
          NODE

      - name: Verify current Canonical identity before staged deployment
        shell: bash
        run: |
          set -euo pipefail
          canonical_json=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" >"$canonical_json" 2>/dev/null
          node - "$canonical_json" <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (d.id !== process.env.EXPECTED_CANONICAL_DEPLOYMENT) throw new Error('CANONICAL_DEPLOYMENT_CHANGED');
          if (d.readyState !== 'READY' || d.target !== 'production') throw new Error('CANONICAL_STATE_INVALID');
          const sha = d?.meta?.gitCommitSha || d?.meta?.githubCommitSha || d?.gitSource?.sha || d?.source?.sha;
          if (sha !== process.env.EXPECTED_CANONICAL_SHA) throw new Error('CANONICAL_SHA_CHANGED');
          console.log('CANONICAL_PRE_STAGE=PASS');
          NODE

      - name: Pull exact Production project configuration for build only
        shell: bash
        run: |
          set -euo pipefail
          test "$VERCEL_PROJECT_ID" = "$EXPECTED_PROJECT_ID"
          test "$VERCEL_ORG_ID" = "$EXPECTED_ORG_ID"
          npx --yes vercel@"$VERCEL_CLI_VERSION" pull --yes --environment=production --project "$VERCEL_PROJECT_ID" --scope "$VERCEL_ORG_ID" --token "$VERCEL_TOKEN" >/tmp/g03-1-vercel-pull.log 2>&1
          node - <<'NODE'
          const fs = require('node:fs');
          const p = JSON.parse(fs.readFileSync('.vercel/project.json', 'utf8'));
          if (p.projectId !== process.env.EXPECTED_PROJECT_ID || p.orgId !== process.env.EXPECTED_ORG_ID) throw new Error('VERCEL_PROJECT_LINKAGE_INVALID');
          NODE

      - name: Build exact Candidate with migration-free Production build path
        shell: bash
        run: |
          set -euo pipefail
          build_log=/tmp/g03-1-vercel-build.log
          npx --yes vercel@"$VERCEL_CLI_VERSION" build --prod --token "$VERCEL_TOKEN" >"$build_log" 2>&1
          grep -Fq 'Production environment guard passed' "$build_log"
          grep -Fq 'Vercel build is build-only; database migration runs in the protected deployment workflow' "$build_log"
          grep -Fq 'Prisma generate passed' "$build_log"
          grep -Fq 'Application build passed' "$build_log"
          if grep -Eiq 'prisma migrate deploy|Applying migration `|Prisma migrate deploy started|Prisma migrate deploy passed' "$build_log"; then
            echo 'STAGED_BUILD_MIGRATION_DETECTED'
            exit 1
          fi
          if grep -Eiq 'postgresql://|DATABASE_URL=.*[^<]|DIRECT_URL=.*[^<]|SUPABASE_SERVICE_ROLE_KEY|password=' "$build_log"; then
            echo 'STAGED_BUILD_SECRET_LEAK_DETECTED'
            exit 1
          fi
          test -f frontend/dist/index.html
          echo 'STAGED_BUILD=PASS'
          echo 'BUILD_MIGRATION_COUNT=0'

      - name: Create exactly one staged Production-target deployment without domain promotion
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          deploy_json=/tmp/g03-1-deploy.json
          npx --yes vercel@"$VERCEL_CLI_VERSION" deploy --prebuilt --target=production --skip-domain --yes --project "$EXPECTED_PROJECT_ID" --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" --format=json >"$deploy_json" 2>/tmp/g03-1-deploy.stderr
          node - "$deploy_json" <<'NODE' >/tmp/g03-1-deploy-output
          const fs = require('node:fs');
          const raw = fs.readFileSync(process.argv[2], 'utf8');
          const match = raw.match(/\{[\s\S]*\}/);
          if (!match) throw new Error('DEPLOY_JSON_MISSING');
          const d = JSON.parse(match[0]);
          const id = d.id || d.uid;
          const urlRaw = d.url || d.alias?.[0];
          if (!/^dpl_[A-Za-z0-9]+$/.test(String(id || ''))) throw new Error('DEPLOY_ID_INVALID');
          if (!urlRaw) throw new Error('DEPLOY_URL_MISSING');
          const url = String(urlRaw).startsWith('http') ? String(urlRaw) : `https://${urlRaw}`;
          console.log(`deployment_id=${id}`);
          console.log(`deployment_url=${url}`);
          NODE
          cat /tmp/g03-1-deploy-output
          deployment_id="$(grep '^deployment_id=' /tmp/g03-1-deploy-output | cut -d= -f2-)"
          deployment_url="$(grep '^deployment_url=' /tmp/g03-1-deploy-output | cut -d= -f2-)"
          echo "deployment_id=$deployment_id" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify staged deployment exact immutable identity
        id: identity
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          inspect_json=/tmp/g03-1-staged-inspect.json
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$DEPLOYMENT_ID" --format=json --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" >"$inspect_json" 2>/dev/null
          node - "$inspect_json" "$DEPLOYMENT_ID" "$DEPLOYMENT_URL" <<'NODE' >/tmp/g03-1-staged-identity
          const fs = require('node:fs');
          const [file, expectedId, expectedUrl] = process.argv.slice(2);
          const d = JSON.parse(fs.readFileSync(file, 'utf8'));
          if (d.id !== expectedId) throw new Error('STAGED_DEPLOYMENT_ID_MISMATCH');
          if (d.name !== process.env.EXPECTED_PROJECT_NAME) throw new Error('STAGED_PROJECT_MISMATCH');
          if (d.target !== 'production' || d.readyState !== 'READY') throw new Error('STAGED_TARGET_STATE_INVALID');
          const url = `https://${d.url}`;
          if (url !== expectedUrl) throw new Error('STAGED_URL_MISMATCH');
          const candidates = [d?.meta?.githubCommitSha, d?.meta?.gitCommitSha, d?.gitSource?.sha, d?.source?.sha].filter(Boolean);
          if (!candidates.length || new Set(candidates).size !== 1 || candidates[0] !== process.env.EXPECTED_CANDIDATE_SHA) throw new Error('STAGED_SHA_MISMATCH');
          const integratedRef = d?.meta?.githubCommitRef || d?.gitSource?.ref;
          const cliRef = d?.meta?.gitCommitRef;
          let cls;
          if (integratedRef) {
            if (integratedRef !== process.env.EXPECTED_SOURCE_BRANCH || cliRef) throw new Error('STAGED_GIT_REF_CONFLICT');
            cls = 'GIT_INTEGRATED';
          } else {
            if (cliRef !== 'HEAD') throw new Error('STAGED_CLI_REF_INVALID');
            cls = 'CLEAN_CLI_EXACT_SHA';
          }
          const nodeVersions = [...new Set((d.builds || []).map((b) => b?.config?.nodeVersion).filter(Boolean))];
          console.log(`STAGED_DEPLOYMENT_ID=${d.id}`);
          console.log(`STAGED_DEPLOYMENT_URL=${url}`);
          console.log(`STAGED_TARGET=${d.target}`);
          console.log(`STAGED_STATE=${d.readyState}`);
          console.log(`STAGED_RESOLVED_SHA=${candidates[0]}`);
          console.log(`STAGED_CLASS=${cls}`);
          console.log(`STAGED_CREATED_AT=${d.createdAt || 'unknown'}`);
          console.log(`STAGED_NODE_RUNTIME=${nodeVersions.join(',') || 'nodejs22.x'}`);
          NODE
          cat /tmp/g03-1-staged-identity

      - name: Verify Canonical remained unchanged after staged deployment
        shell: bash
        run: |
          set -euo pipefail
          canonical_json=$(mktemp)
          npx --yes vercel@"$VERCEL_CLI_VERSION" inspect "$EXPECTED_CANONICAL_URL" --format=json --scope "$EXPECTED_ORG_ID" --token "$VERCEL_TOKEN" >"$canonical_json" 2>/dev/null
          node - "$canonical_json" <<'NODE'
          const fs = require('node:fs');
          const d = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (d.id !== process.env.EXPECTED_CANONICAL_DEPLOYMENT) throw new Error('CANONICAL_CHANGED_BY_STAGE');
          const sha = d?.meta?.gitCommitSha || d?.meta?.githubCommitSha || d?.gitSource?.sha || d?.source?.sha;
          if (sha !== process.env.EXPECTED_CANONICAL_SHA) throw new Error('CANONICAL_SHA_CHANGED_BY_STAGE');
          console.log('CANONICAL_POST_STAGE=UNCHANGED');
          NODE

      - name: Exact staged deployment health and ready 3 of 3
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          set -euo pipefail
          test -n "$VERCEL_AUTOMATION_BYPASS_SECRET"
          health_json=$(mktemp)
          curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$DEPLOYMENT_URL/api/v1/health" >"$health_json"
          node - "$health_json" <<'NODE'
          const fs = require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(d.status!=='ok') process.exit(1);
          NODE
          echo 'STAGED_HEALTH=200/ok'
          for n in 1 2 3; do
            ready_json=$(mktemp)
            curl --silent --show-error --fail --location --proto '=https' --tlsv1.2 --header "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" "$DEPLOYMENT_URL/api/v1/ready" >"$ready_json"
            node - "$ready_json" <<'NODE'
          const fs=require('node:fs'); const d=JSON.parse(fs.readFileSync(process.argv[2],'utf8')); if(d.status!=='ready'||d.database!=='ok') process.exit(1);
          NODE
            echo "STAGED_READY_${n}=200/ready/ok"
          done
          echo 'STAGED_READY=3/3'

      - name: Immediate post-deploy read-only Production preservation snapshot
        shell: bash
        run: |
          set -euo pipefail
          node /tmp/g03-1-staged-technical-snapshot.js | tee /tmp/g03-1-post-stage-snapshot.log
          node - /tmp/g03-1-pre-snapshot.json /tmp/g03-1-post-stage-snapshot.log <<'NODE'
          const fs = require('node:fs');
          const [prePath, postLog] = process.argv.slice(2);
          const pre = JSON.parse(fs.readFileSync(prePath, 'utf8'));
          const line = fs.readFileSync(postLog, 'utf8').split(/\r?\n/).find((v) => v.startsWith('STAGED_TECH_SNAPSHOT='));
          if (!line) throw new Error('POST_STAGE_SNAPSHOT_MISSING');
          const post = JSON.parse(line.slice('STAGED_TECH_SNAPSHOT='.length));
          if (post.readOnly.transactionReadOnly !== 'on' || post.readOnly.transactionIdAssigned !== null) throw new Error('POST_STAGE_NOT_READ_ONLY');
          if (post.activation.effective !== 'INACTIVE') throw new Error('G03_1_TECHNICAL_ACTIVATION_CHANGED');
          if (post.schema.migrationCount !== 17 || post.schema.pendingMigrations.length !== 0) throw new Error('POST_STAGE_MIGRATION_CHANGED');
          if (post.counts.leaveQuotaRows !== pre.counts.leaveQuotaRows) throw new Error('POST_STAGE_QUOTA_ROWCOUNT_CHANGED');
          if (post.counts.quotaYear2026Rows !== pre.counts.quotaYear2026Rows || post.counts.quotaYearNullRows !== pre.counts.quotaYearNullRows || post.counts.quotaYearOtherRows !== 0) throw new Error('POST_STAGE_YEAR_DISTRIBUTION_CHANGED');
          if (post.counts.systemSettingRows !== pre.counts.systemSettingRows) throw new Error('POST_STAGE_SETTING_COUNT_CHANGED');
          if (post.businessFingerprint !== pre.businessFingerprint) throw new Error('POST_STAGE_QUOTA_FINGERPRINT_CHANGED');
          if (JSON.stringify(post.totals2026.entitlement) !== JSON.stringify(pre.totals2026.entitlement)) throw new Error('POST_STAGE_ENTITLEMENT_CHANGED');
          console.log('POST_STAGE_BUSINESS_WRITE_GUARD=PASS');
          console.log(`POST_STAGE_LEAVE_REQUEST_DELTA=${post.counts.leaveRequestRows-pre.counts.leaveRequestRows}`);
          console.log(`POST_STAGE_USED_TOTALS=${JSON.stringify(post.totals2026.used)}`);
          console.log(`POST_STAGE_REMAINING_TOTALS=${JSON.stringify(post.totals2026.remaining)}`);
          NODE

      - name: Publish staged candidate identity
        if: always()
        shell: bash
        env:
          DEPLOYMENT_ID: ${{ steps.deploy.outputs.deployment_id }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
        run: |
          {
            echo '### G03.1 exact staged deployment'
            echo "- Candidate SHA: $EXPECTED_CANDIDATE_SHA"
            echo "- Deployment ID: ${DEPLOYMENT_ID:-not-created}"
            echo "- Deployment URL: ${DEPLOYMENT_URL:-not-created}"
            echo '- Target: production (staged with --skip-domain)'
            echo '- Promotion: not performed'
            echo '- Migration during build/deploy: not performed'
            echo '- Activation mutation: not performed'
          } >> "$GITHUB_STEP_SUMMARY"
