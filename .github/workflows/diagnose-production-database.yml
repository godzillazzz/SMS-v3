name: Diagnose sms-v3-staging Production Database

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production-sms-v3-staging
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --include=dev
      - name: Generate Prisma client
        run: npx prisma generate
      - name: LIC-HIST-01 read-only post-repair check
        run: node scripts/ci/lic-hist-impact-preview-readonly.js
      - name: G06-UAT-01 read-only readiness check
        run: node scripts/ci/g06-uat-readiness-readonly.js
      - name: G06-UAT-01 read-only Master candidate check
        run: node scripts/ci/g06-uat-master-candidates-readonly.js
      - name: G06-UAT-01 Owner-approved WCS + Security Guard governed Production setup
        run: node scripts/ci/g06-uat-wcs-security-guard-production.js