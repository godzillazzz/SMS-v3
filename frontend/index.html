<!doctype html>
<html lang="th" class="dark" style="background-color: #020813 !important; color-scheme: dark;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#0B58D8" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SMS" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      (() => {
        // Set Employee-only browser chrome before the first paint; preserve desktop preferences.
        const employeePwa = new URLSearchParams(location.search).get('pwa') === '1'
          || navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
        if (employeePwa) {
          document.documentElement.dataset.smsShell = 'employee';
          document.querySelector('meta[name="theme-color"]').content = '#020813';
        }
        try {
          const stored = localStorage.getItem('sms-v3-theme');
          const preference = stored === 'light' || stored === 'dark' || stored === 'system' ? stored : 'system';
          const dark = preference === 'dark' || (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themePreference = preference;
        } catch {
          const dark = matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
          document.documentElement.dataset.themePreference = 'system';
        }
      })();
    </script>
    <style>
      :root { color-scheme: dark; background: #020813; }
      html, body, #root, #__next { background: #020813 !important; background-color: #020813 !important; color: #f1f5f9; margin: 0 !important; padding: 0 !important; min-height: 100vh !important; width: 100% !important; }
      html, body { overflow-x: hidden; overscroll-behavior-x: none; }
      body { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
      #root { isolation: isolate; }
    </style>
    <link rel="preload" as="image" href="/brand/sms-logo-splash.webp" media="(prefers-color-scheme: light)" />
    <link rel="preload" as="image" href="/brand/sms-logo-splash-dark.webp" media="(prefers-color-scheme: dark)" />
    <style>
      .sms-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#f5f7fb;color:#14243e;font-family:Kanit,sans-serif}
      .sms-splash img{height:240px;width:auto;max-width:90vw;object-fit:contain}
      .sms-splash p{margin:0}
      @media(prefers-color-scheme:dark){.sms-splash{background:#020813;color:#f1f5f9}}
      html[data-theme=light]:not([data-sms-shell=employee]) .sms-splash{background:#f5f7fb;color:#14243e}
      html[data-theme=dark] .sms-splash,html[data-sms-shell=employee] .sms-splash{background:#020813;color:#f1f5f9}
      @media(max-width:600px){.sms-splash img{height:180px}}
    </style>
    <title>Security Management System</title>
  </head>
  <body style="background-color: #020813 !important; margin: 0; padding: 0;">
    <div id="root"><div class="sms-splash" role="status" aria-live="polite">
      <picture><source id="sms-splash-dark" media="(prefers-color-scheme: dark)" srcset="/brand/sms-logo-splash-dark.webp" /><img src="/brand/sms-logo-splash.webp" alt="SMS Security Management System" /></picture>
      <p>กำลังเตรียมระบบ…</p>
    </div></div>
    <script>
      document.getElementById('sms-splash-dark').media = document.documentElement.dataset.smsShell === 'employee' || document.documentElement.dataset.theme === 'dark' ? 'all' : 'not all';
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
