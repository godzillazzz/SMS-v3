<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" role="img" aria-label="SMS shield">
  <defs>
    <linearGradient id="sms-shield-gradient" x1="12%" y1="2%" x2="87%" y2="100%">
      <stop offset="0" stop-color="#ff994c"/>
      <stop offset=".26" stop-color="#f85b64"/>
      <stop offset=".55" stop-color="#be438f"/>
      <stop offset=".80" stop-color="#7538af"/>
      <stop offset="1" stop-color="#572a9b"/>
    </linearGradient>
    <linearGradient id="sms-shield-light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sms-y-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5169e5"/>
      <stop offset="1" stop-color="#5131a4"/>
    </linearGradient>
    <filter id="sms-badge-shadow" x="-35%" y="-30%" width="170%" height="175%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#31166d" flood-opacity=".35"/>
    </filter>
  </defs>
  <path d="M50 5 88 20 V65 C88 84 76 101 50 115 C24 101 12 84 12 65 V20 Z"
