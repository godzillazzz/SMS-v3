  <path d="M50 10 18 23 V64 C18 79 27 93 50 106 Z" fill="url(#sms-shield-light)" opacity=".5"/>
  <path d="M50 9 84 23 V65 C84 81 75 96 50 110 C25 96 16 81 16 65 V23 Z"
        fill="none" stroke="#f7ab9b" stroke-opacity=".42" stroke-width=".85" stroke-linejoin="round"/>
  <circle cx="50" cy="60" r="22" fill="#f9f8ff" filter="url(#sms-badge-shadow)"/>
  <circle cx="50" cy="60" r="20.7" fill="none" stroke="#dcdafb" stroke-width="1.1"/>
  <path d="M37 51 L50 63 L63 51 M50 63 V77" fill="none" stroke="url(#sms-y-gradient)"
