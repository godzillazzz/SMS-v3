<!doctype html>
<html lang="en">
  <head><meta charset="UTF-8"><title>Attendance device key test fixture</title></head>
  <body>
    <output id="fixture-status">ready</output>
    <script type="module">
      import {
        correlateAttendanceDeviceKeyIds,
        generateAttendanceDeviceKeyPair,
        hasAttendanceDeviceKey,
        inspectAttendanceDeviceKey,
        listAttendanceDeviceKeyIds,
        pruneAttendanceDeviceKeys,
        signAttendanceDeviceChallenge,
        storeAttendanceDevicePrivateKey
      } from '/src/lib/attendance-device-key.ts';

      const dbName = 'smsv3-attendance-device-keys';
      const storeName = 'deviceKeys';
      const employeeId = 'browser-test-employee';
      const bytesFromBase64 = (value) => Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
      const bytesFromBase64Url = (value) => bytesFromBase64(value.replace(/-/g, '+').replace(/_/g, '/') + '='.repeat((4 - value.length % 4) % 4));
      const base64UrlFromBytes = (bytes) => btoa(String.fromCharCode(...bytes)).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/g, '');

      function clearDb() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.deleteDatabase(dbName);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error || new Error('deleteDatabase failed'));
          request.onblocked = () => reject(new Error('deleteDatabase blocked'));
        });
      }

      function putMalformedRecord(record) {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(dbName, 1);
          request.onupgradeneeded = () => request.result.createObjectStore(storeName, { keyPath: 'candidateDeviceEnrollmentId' });
          request.onerror = () => reject(request.error || new Error('open failed'));
          request.onsuccess = () => {
            const db = request.result;
            const tx = db.transaction(storeName, 'readwrite');
            tx.objectStore(storeName).put(record);
            tx.oncomplete = () => { db.close(); resolve(); };
            tx.onerror = () => { db.close(); reject(tx.error || new Error('put failed')); };
          };
        });
      }

      window.deviceKeyFixture = {
        clearDb,
        async persistAndVerifyAfterReload() {
          let enrollmentId = sessionStorage.getItem('fixture-enrollment-id');
          let publicKeySpkiBase64 = sessionStorage.getItem('fixture-public-key');
          if (!enrollmentId || !publicKeySpkiBase64) {
            await clearDb();
            const material = await generateAttendanceDeviceKeyPair();
            enrollmentId = 'fixture-active-device-id';
            publicKeySpkiBase64 = material.publicKeySpkiBase64;
            await storeAttendanceDevicePrivateKey(enrollmentId, employeeId, material.privateKey, publicKeySpkiBase64);
            sessionStorage.setItem('fixture-enrollment-id', enrollmentId);
            sessionStorage.setItem('fixture-public-key', publicKeySpkiBase64);
          }
          const inventory = await listAttendanceDeviceKeyIds(employeeId);
          const chain = correlateAttendanceDeviceKeyIds({
            activeDeviceId: enrollmentId,
            verificationDeviceId: enrollmentId,
            storedEnrollmentIds: inventory.enrollmentIds
          });
          const inspection = await inspectAttendanceDeviceKey(enrollmentId);
          const challengeBytes = crypto.getRandomValues(new Uint8Array(32));
          const challenge = base64UrlFromBytes(challengeBytes);
          const signatureBase64 = await signAttendanceDeviceChallenge(enrollmentId, challenge);
          const publicKey = await crypto.subtle.importKey('spki', bytesFromBase64(publicKeySpkiBase64), { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
          const signatureVerified = await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, publicKey, bytesFromBase64(signatureBase64), challengeBytes);
          return {
            activeDeviceId: enrollmentId,
            verificationDeviceId: enrollmentId,
            storedEnrollmentIds: inventory.enrollmentIds,
            activeKeyIdMatch: chain.activeKeyIdMatch,
            verificationMatchesActive: chain.verificationMatchesActive,
            localKeyStatus: inspection.status,
            hasLocalKey: await hasAttendanceDeviceKey(enrollmentId),
            extractable: inspection.extractable,
            algorithm: inspection.algorithm,
            namedCurve: inspection.namedCurve,
            signatureVerified
          };
        },
        async inspectExistingEnrollment(enrollmentId) {
          const inventory = await listAttendanceDeviceKeyIds(employeeId);
          return {
            status: (await inspectAttendanceDeviceKey(enrollmentId)).status,
            available: inventory.available,
            storedEnrollmentIds: inventory.enrollmentIds
          };
        },
        async pruneKeepsAllowed() {
          await clearDb();
          for (const enrollmentId of ['fixture-active', 'fixture-candidate', 'fixture-stale']) {
            const material = await generateAttendanceDeviceKeyPair();
            await storeAttendanceDevicePrivateKey(enrollmentId, employeeId, material.privateKey, material.publicKeySpkiBase64);
          }
          const removed = await pruneAttendanceDeviceKeys(employeeId, ['fixture-active', 'fixture-candidate']);
          const inventory = await listAttendanceDeviceKeyIds(employeeId);
          return {
            removed,
            ids: inventory.enrollmentIds.sort(),
            activeStatus: (await inspectAttendanceDeviceKey('fixture-active')).status,
            candidateStatus: (await inspectAttendanceDeviceKey('fixture-candidate')).status,
            staleStatus: (await inspectAttendanceDeviceKey('fixture-stale')).status
          };
        },
        async malformedRecordFailsClosed() {
          await clearDb();
          await putMalformedRecord({
            candidateDeviceEnrollmentId: 'fixture-malformed',
            employeeId,
            privateKey: { type: 'private', extractable: false, algorithm: { name: 'ECDSA', namedCurve: 'P-256' }, usages: ['sign'] },
            publicKeySpkiBase64: 'not-a-real-key',
            createdAt: '2026-09-30T00:00:00.000Z'
          });
          const inspection = await inspectAttendanceDeviceKey('fixture-malformed');
          let signingErrorCode = null;
          try { await signAttendanceDeviceChallenge('fixture-malformed', 'AA'); }
          catch (error) { signingErrorCode = error?.code || error?.name || 'unknown'; }
          const inventory = await listAttendanceDeviceKeyIds(employeeId);
          return { status: inspection.status, signingErrorCode, malformedRecordCount: inventory.malformedRecordCount };
        }
      };
    </script>
  </body>
</html>
